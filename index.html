  }

  btnEdit.addEventListener("click", function () {
    if (PROFILE_KIND === "lecon") {
      currentView === "editor" ? closeLeconEditor() : openLeconEditor();
    } else {
      currentView === "editor" ? closeEditor() : openEditor();
    }
  });

  /* ---------- persistence (local to this browser only) ---------- */
  function saveData(newSteps, newTheme, newStudents, newStudentGroups, newShowTime, newTimed, newProjectedTools, done) {
    STEPS = newSteps;
    THEME = newTheme;
    STUDENTS = newStudents;
    STUDENT_GROUPS = Array.isArray(newStudentGroups) ? newStudentGroups : [];
    SHOW_TIME = newShowTime !== false;
    TIMED = newTimed !== false;
    PROJECTED_TOOLS = Array.isArray(newProjectedTools) ? newProjectedTools.slice() : allToolIds();
    applyTheme(THEME);
    persist();
    try { localStorage.removeItem(STORE_KEY); } catch (e) {}
    state = { index: 0, running: false, startTs: null, pausedElapsedMs: 0 };
    saveTimerState();
    showToast("Enregistré ✓");
    if (done) done(true);
  }

  /* =====================================================================
     VUE PROJETÉE (affichage plein écran pour toute la classe)
     ===================================================================== */

  /* rassemble les tâches saisies dans toutes les étapes du déroulé — pour une
     "leçon", STEPS ne contient qu'une seule étape qui sert de simple panier
     de tâches, donc la même fonction sert aux deux cas */
  function collectClassTasks(steps) {
    var out = [];
    (steps || STEPS).forEach(function (step) {
      (step.tasks || []).forEach(function (t) { out.push(t); });
    });
    return out;
  }
  /* Tâches montrées à la classe en vue projetée. Programme minuté ou checklist : seulement celles de l'étape
     en cours — la liste reste courte, et une tâche non cochée disparaît avec son étape. Les tâches sont déjà
     rangées par étape dans les données (steps[].tasks) : c'est un filtre d'affichage, rien n'est déplacé ni
     enregistré. Une leçon n'a pas d'étapes : toute sa liste. Les Devoirs, le Plan de travail et l'impression
     gardent, eux, toutes les étapes (collectClassTasks()). */
  function visibleClassTasks() {
    if (PROFILE_KIND === "lecon") return collectClassTasks();
    var step = STEPS[state.index];
    return step ? (step.tasks || []).slice() : [];
  }
  function collectAutoHomeworkTasks(steps) {
    return collectClassTasks(steps).filter(function (t) { return !!t.homework; });
  }

  /* ---------- copier devoirs + infos importantes (texte brut, pour coller dans le
     site de l'école) ---------- */
  function formatDueDateFR(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || "");
    if (!m) return "";
    return m[3] + "." + m[2] + "." + m[1];
  }
  /* équivalent de planTaskLabel() mais en texte brut (sans <strong>/esc HTML) — celui-ci
     sert à l'affichage, celui-là au texte copié dans le presse-papiers */
  function plainTaskLabel(t) {
    if (t.name && t.text) return t.name + " — " + t.text;
    return t.name || t.text || "";
  }
  /* steps : tableau d'étapes à utiliser pour les tâches "à la maison" — par défaut
     STEPS (vue projetée), ou draftSteps/draftLeconTasks depuis un éditeur, pour que
     le texte copié reflète les modifications en cours, même avant Enregistrer.
     extraHomework / infoText : mêmes idées pour COURSE_HOMEWORK_EXTRA / COURSE_INFO —
     par défaut les valeurs en direct (vue projetée), ou draftHomeworkExtra/draftCourseInfo
     (ou leurs équivalents "lecon") depuis un éditeur, pour refléter le brouillon en cours. */
  function buildDevoirsInfosText(steps, extraHomework, infoText) {
    var items = [];
    collectAutoHomeworkTasks(steps).forEach(function (t) {
      var label = plainTaskLabel(t);
      if (label) items.push({ text: label, dueDate: t.dueDate || "" });
    });
    (extraHomework !== undefined ? extraHomework : COURSE_HOMEWORK_EXTRA || []).forEach(function (raw) {
      var it = normalizeHomeworkExtraItem(raw);
      var label = (it.text || "").trim();
      if (label) items.push({ text: label, dueDate: it.dueDate || "" });
    });
    var lines = [];
    if (items.length) {
      lines.push("Devoirs :");
      items.forEach(function (it) {
        var dateStr = formatDueDateFR(it.dueDate);
        lines.push("- " + it.text + (dateStr ? " (à rendre le " + dateStr + ")" : ""));
      });
    }
    var info = ((infoText !== undefined ? infoText : COURSE_INFO) || "").trim();
    if (info) {
      if (lines.length) lines.push("");
      lines.push("Infos importantes :");
      lines.push(info);
    }
    return lines.join("\n");
  }

  /* ---------- bloc "Devoirs et infos" repliable, dans le panneau "Vue projetée" /
     "Outils" de l'éditeur (déroulé et leçon) — permet d'éditer en brouillon les mêmes
     données (COURSE_HOMEWORK_EXTRA, COURSE_INFO) que la vue projetée édite en direct,
     sans passer par elle, avec Annuler/Enregistrer comme le reste de l'éditeur. ---- */
  function homeworkInfoBlockHtml(steps, homeworkExtra, courseInfo, open) {
    var autoTasks = collectAutoHomeworkTasks(steps);
    var autoHtml = autoTasks.length
      ? '<div class="tasks-block">' + autoTasks.map(function (t) {
          return '<div class="task-chip">' + esc(plainTaskLabel(t)) + "</div>";
        }).join("") + "</div>"
      : '<p class="editor-hint" style="margin:4px 0;">Aucune tâche « à la maison » pour l’instant.</p>';

    var extraRowsHtml = (homeworkExtra || []).map(function (item, i) {
      item = normalizeHomeworkExtraItem(item);
      /* class "hw-extra-row" (not "task-row") on purpose: renderLeconEditor() wires ALL
         ".task-row" elements in the whole editor unscoped (for its class task list), and
         would otherwise also try to wire these rows as if they were class tasks, crashing
         on missing .task-name/.task-text */
      return '<div class="hw-extra-row" data-hwi="' + i + '">' +
        '<input type="text" class="text-input hw-extra-text" value="' + esc(item.text) + '" placeholder="Devoir supplémentaire" aria-label="Devoir supplémentaire" />' +
        '<label class="pause-toggle">À rendre le <input type="date" class="hw-extra-date" value="' + esc(item.dueDate || "") + '" aria-label="Date de rendu" /></label>' +
        '<button class="row-btn hw-extra-delete" title="Supprimer ce devoir" aria-label="Supprimer ce devoir">' + svg("trash") + "</button>" +
      "</div>";
    }).join("");

    return '<button class="tasks-toggle' + (open ? " has-tasks" : "") + '" id="hwinfo-toggle" type="button">' +
        svg(open ? "up" : "down") + " Devoirs et infos" +
      "</button>" +
      (open
        ? '<div class="tasks-editor" id="hwinfo-block">' +
            "<h3 style=\"font-size:0.9rem;\">Tâches « à la maison » (dans les étapes)</h3>" +
            autoHtml +
            "<h3 style=\"font-size:0.9rem;margin-top:6px;\">Devoirs ajoutés à la main</h3>" +
            '<div class="editor-rows" id="hwinfo-extra-rows">' + extraRowsHtml + "</div>" +
            '<button class="add-row-btn" id="hwinfo-extra-add">' + svg("plus") + " Ajouter un devoir</button>" +
            "<h3 style=\"font-size:0.9rem;margin-top:6px;\">Infos importantes</h3>" +
            '<textarea class="text-input" id="hwinfo-course-info" rows="3" placeholder="Informations à afficher pour la classe" aria-label="Infos importantes">' + esc(courseInfo || "") + "</textarea>" +
          "</div>"
        : "");
  }

  /* wire : { getHomeworkExtra, setHomeworkExtra, getCourseInfo, setCourseInfo, getOpen, setOpen, rerender } */
  function wireHomeworkInfoBlock(container, wire) {
    var toggleBtn = container.querySelector("#hwinfo-toggle");
    if (toggleBtn) toggleBtn.addEventListener("click", function () {
      wire.setOpen(!wire.getOpen());
      wire.rerender();
    });
    var addBtn = container.querySelector("#hwinfo-extra-add");
    if (addBtn) addBtn.addEventListener("click", function () {
      var arr = (wire.getHomeworkExtra() || []).slice();
      arr.push({ text: "", dueDate: "" });
      wire.setHomeworkExtra(arr);
      wire.rerender();
      var inputs = container.querySelectorAll(".hw-extra-text");
      var last = inputs[inputs.length - 1];
      if (last) last.focus();
    });
    Array.prototype.forEach.call(container.querySelectorAll("[data-hwi]"), function (rowEl) {
      var i = Number(rowEl.getAttribute("data-hwi"));
      var txt = rowEl.querySelector(".hw-extra-text");
      txt.addEventListener("input", function (e) {
        var arr = (wire.getHomeworkExtra() || []).slice();
        arr[i] = normalizeHomeworkExtraItem(arr[i]);
        arr[i].text = e.target.value;
        wire.setHomeworkExtra(arr);
      });
      var dateInput = rowEl.querySelector(".hw-extra-date");
      if (dateInput) dateInput.addEventListener("change", function (e) {
        var arr = (wire.getHomeworkExtra() || []).slice();
        arr[i] = normalizeHomeworkExtraItem(arr[i]);
        arr[i].dueDate = e.target.value;
        wire.setHomeworkExtra(arr);
      });
      rowEl.querySelector(".hw-extra-delete").addEventListener("click", function () {
        var arr = (wire.getHomeworkExtra() || []).slice();
        arr.splice(i, 1);
        wire.setHomeworkExtra(arr);
        wire.rerender();
      });
    });
    var infoEl = container.querySelector("#hwinfo-course-info");
    if (infoEl) infoEl.addEventListener("input", function (e) { wire.setCourseInfo(e.target.value); });
  }
  function copyTextToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        showToast("Copié dans le presse-papiers ✓");
      }).catch(function () {
        showToast("Impossible de copier : autorisez l’accès au presse-papiers.");
      });
    } else {
      showToast("Impossible de copier : le presse-papiers n’est pas disponible dans ce navigateur.");
    }
  }

  function toolsCheckboxesHtml(selectedIds, namePrefix) {
    return TOOL_LIST.concat(PROJECTED_EXTRA_TOOLS).map(function (t) {
      var checked = selectedIds.indexOf(t.id) !== -1;
      return '<label class="pause-toggle" style="min-width:160px;">' +
        '<input type="checkbox" class="' + namePrefix + '-tool-check" value="' + t.id + '"' + (checked ? " checked" : "") + " /> " +
        esc(t.label) + "</label>";
    }).join("");
  }
  function wireToolsCheckboxes(container, namePrefix, draftArrRef, onChange) {
    Array.prototype.forEach.call(container.querySelectorAll("." + namePrefix + "-tool-check"), function (cb) {
      cb.addEventListener("change", function (e) {
        var id = e.target.value;
        var idx = draftArrRef.arr.indexOf(id);
        if (e.target.checked) { if (idx === -1) draftArrRef.arr.push(id); }
        else { if (idx !== -1) draftArrRef.arr.splice(idx, 1); }
        if (onChange) onChange();
      });
    });
  }

  function projTimerLoop() {
    var c = projClock(); /* étape en cours (déroulé minuté) ou minuteur de cours (checklist, leçon) */
    var remaining = c.seconds - c.elapsedMs / 1000;
    var pct = (c.done || c.seconds <= 0) ? 100 : Math.min(100, (c.elapsedMs / (c.seconds * 1000)) * 100);
    var fillEl = document.getElementById("proj-fill");
    var cdEl = document.getElementById("proj-countdown");
    if (fillEl) fillEl.style.width = pct.toFixed(1) + "%";
    if (cdEl) cdEl.textContent = fmt(Math.max(0, remaining));
    var statusEl = document.getElementById("proj-status");
    var statusText = clockStatusText(c);
    if (statusEl && statusEl.textContent !== statusText) statusEl.textContent = statusText;
    var playBtn = document.getElementById("proj-play");
    if (playBtn) playBtn.innerHTML = playIconHtml(c) + " " + playLabelText(c);
    if (!projFollowsSteps() && remaining <= 0 && projTimer.running) {
      projTimer.running = false;
      projTimer.pausedElapsedMs = projTimer.seconds * 1000; /* reste à 0:00 (« Terminé ») au lieu de réafficher la durée entière */
    }
  }
  /* Démarrer / Pause / Reprendre de l'horloge affichée en vue projetée (bouton de l'en-tête, touche Espace,
     outil « Minuteur de cours ») */
  function toggleProjClock() {
    if (projFollowsSteps()) { togglePlay(); return; }
    if (projTimer.running) {
      projTimer.pausedElapsedMs = Date.now() - projTimer.startTs;
      projTimer.running = false;
    } else {
      if (projTimer.pausedElapsedMs >= projTimer.seconds * 1000) projTimer.pausedElapsedMs = 0; /* terminé : on repart du début */
      projTimer.startTs = Date.now() - projTimer.pausedElapsedMs;
      projTimer.running = true;
    }
    refreshProjectedLive();
  }
  /* repeint tout ce qui bouge en vue projetée sans reconstruire le DOM : décompte, statut, titre de
     contexte, « Étape X sur Y », boutons Pause et Suivant de l'en-tête. Appelée par la boucle à 250 ms
     et après chaque action (Pause, Suivant, Recommencer…). */
  function refreshProjectedLive() {
    if (currentView !== "projected") return;
    /* l'étape a changé (Suivant, ←, avance automatique, Recommencer) : les tâches affichées ne sont plus les
       bonnes, on redessine le tableau de bord — une seule fois par changement, jamais à chaque tick. On attend
       si quelqu'un est en train d'écrire dans un champ du tableau de bord (modification des devoirs), pour ne
       pas lui retirer le champ sous les doigts. */
    if (lastProjectedStepIndex !== state.index && PROFILE_KIND !== "lecon") {
      var typingHere = isTypingContext() && projectedWrap.contains(document.activeElement) && !toolsWrap.contains(document.activeElement);
      if (!typingHere) { renderProjected(); return; }
    }
    projTimerLoop();
    var contextTitleEl = document.getElementById("proj-context-title");
    if (contextTitleEl) contextTitleEl.textContent = projectedContextTitle();
    updateProjStepProgress();
    updatePlayButton();
    btnSkip.style.visibility = state.index >= STEPS.length ? "hidden" : "visible";
  }

  function persistProjectedFields() { persist(); }

  /* titre de contexte affiché en vue projetée : l'étape en cours pour un déroulé,
     ou le titre du programme pour une "leçon" (qui n'a pas de vraie notion d'étape,
     voir createLeconProfile — son unique step est un seau synthétique pour les tâches) */
  function projectedContextTitle() {
    if (PROFILE_KIND === "lecon") return TITLE;
    var step = STEPS[state.index];
    return step ? step.label : TITLE;
  }

  /* petit indicateur "Étape X sur Y" + barre, affiché sous le titre de contexte projeté —
     uniquement pour un déroulé (une leçon n'a pas de vraie notion d'étapes, voir
     projectedContextTitle() ci-dessus) */
  function projStepProgressHtml() {
    if (PROFILE_KIND !== "deroule" || !STEPS.length) return "";
    var stepNum = Math.min(state.index + 1, STEPS.length);
    var pct = state.index >= STEPS.length ? 100 : (state.index / STEPS.length) * 100;
    return '<div class="proj-progress" id="proj-progress">' +
      '<span class="proj-progress-text" id="proj-progress-text">Étape ' + stepNum + " sur " + STEPS.length + "</span>" +
      '<div class="progress-track"><div class="progress-fill" id="proj-progress-fill" style="width:' + pct.toFixed(1) + '%"></div></div>' +
    "</div>";
  }
  function updateProjStepProgress() {
    var textEl = document.getElementById("proj-progress-text");
    var fillEl = document.getElementById("proj-progress-fill");
    if (!textEl || !fillEl) return;
    if (PROFILE_KIND !== "deroule" || !STEPS.length) return;
    var stepNum = Math.min(state.index + 1, STEPS.length);
    var pct = state.index >= STEPS.length ? 100 : (state.index / STEPS.length) * 100;
    textEl.textContent = "Étape " + stepNum + " sur " + STEPS.length;
    fillEl.style.width = pct.toFixed(1) + "%";
  }

  /* =====================================================================
     BLOCS PERSONNALISÉS (vue projetée) — un bloc par élève/groupe choisi par
     Pauline, affiché comme les 3 blocs fixes ci-dessous (même grille, même
     mécanisme de visibilité "custom:"+id, voir CUSTOM_BLOCKS plus haut).
     ===================================================================== */
  function customStudentTasksToolHtml(tool) {
    var ids = Array.isArray(tool.studentIds) ? tool.studentIds : [];
    var names = STUDENTS.filter(function (s) { return ids.indexOf(s.id) !== -1; }).map(function (s) { return s.name; }).filter(Boolean);
    var classTasks = visibleClassTasks(); /* comme le bloc « Tâches à faire en classe » : l'étape en cours seulement */
    var filtered = ids.length
      ? classTasks.filter(function (t) { return Array.isArray(t.studentIds) && t.studentIds.some(function (id) { return ids.indexOf(id) !== -1; }); })
      : [];
    if (PRESENTING && !filtered.length) return ""; /* rien à montrer à la classe pour cette étape (voir customBlockHtml) */
    var allGroups = [];
    STEPS.forEach(function (s) { (s.taskGroups || []).forEach(function (g) { allGroups.push(g); }); });
    var showDetails = getPlanShowDetails();
    var showGroups = getPlanShowGroups();
    var itemsHtml = filtered.length
      ? renderTaskListWithGroups(filtered, allGroups, showGroups, function (t) {
          return '<label class="plan-task"><input type="checkbox" /><span>' + planTaskLabel(t) + "</span>" + planBadgesHtml(t, showDetails) + "</label>";
        })
      : '<p class="editor-hint" style="margin:0;">' + (ids.length ? "Aucune tâche " + (PROFILE_KIND === "lecon" ? "pour l’instant" : "à cette étape") + " pour " + esc(names.join(", ") || "cet élève") + "." : "Choisissez au moins un élève dans l’éditeur pour cet outil.") + "</p>";
    return '<div class="custom-block-tool custom-block-studenttasks">' +
      (names.length ? '<p class="editor-hint" style="margin:0 0 4px;">Tâches de ' + esc(names.join(", ")) + "</p>" : "") +
      '<div class="plan-list projected-scroll">' + itemsHtml + "</div>" +
    "</div>";
  }
  /* réglages (préréglages de durée + démarrer/pause/réinitialiser) masqués par défaut
     (voir getCustomTimerState) — même convention visuelle que toolTopbar (chevron
     haut/bas + libellé « Réglages »), mais en version compacte puisqu'on est ici à
     l'intérieur d'un bloc de la vue projetée plutôt que dans le panneau Outils en
     entier ; seul le chiffre (et son remplissage) reste toujours visible, pour un
     bloc élève décoratif et sans distraction quand elle n'a pas besoin d'y toucher */
  function customTimerToolHtml(tool) {
    var st = getCustomTimerState(tool);
    var elapsedMs = st.running ? Date.now() - st.startTs : st.pausedElapsedMs;
    var remaining = st.seconds - elapsedMs / 1000;
    var pct = Math.min(100, (elapsedMs / (st.seconds * 1000)) * 100);
    var presets = [1, 3, 5, 10];
    var settingsVisible = !!st.settingsVisible;
    return '<div class="custom-block-tool custom-block-timer" id="ctw-' + esc(tool.id) + '">' +
      '<div style="display:flex;justify-content:flex-end;">' +
        '<button class="back-link" id="cts-' + esc(tool.id) + '" style="font-size:0.72rem;padding:2px 0;">' +
          svg(settingsVisible ? "up" : "down") + " Réglages</button>" +
      "</div>" +
      (settingsVisible
        ? '<div class="quick-presets" style="margin-bottom:6px;">' +
            presets.map(function (p) {
              return '<button class="preset-btn' + (st.seconds === p * 60 ? " is-active" : "") + '" data-ct-preset="' + p + '">' + p + " min</button>";
            }).join("") +
          "</div>"
        : "") +
      '<div class="active-card" style="padding:10px;">' +
        '<div class="card-fill" id="ctf-' + esc(tool.id) + '" style="width:' + pct.toFixed(1) + '%"></div>' +
        '<div class="card-content" style="align-items:center;">' +
          '<div class="timer-row"><span class="countdown" id="ctc-' + esc(tool.id) + '">' + fmt(Math.max(0, remaining)) + "</span></div>" +
          (settingsVisible
            ? '<div class="active-actions">' +
                '<button class="action-btn primary" id="ctp-' + esc(tool.id) + '">' +
                  (st.running
                    ? fillIcon('<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>') + " Pause"
                    : fillIcon('<path d="M8 5v14l11-7L8 5Z"/>') + " Démarrer") +
                "</button>" +
                '<button class="action-btn" id="ctr-' + esc(tool.id) + '">' + svg("restart") + " Réinitialiser</button>" +
              "</div>"
            : "") +
        "</div>" +
      "</div>" +
    "</div>";
  }
  /* En présentation, un bloc dont aucun outil n'a quelque chose à montrer à cette étape (uniquement des listes
     de tâches, toutes vides) renvoie "" : renderProjected() ne l'affiche pas, comme un bloc fixe vide. */
  function customBlockHtml(block) {
    var toolsHtml = (block.tools || []).map(function (tool) {
      return tool.type === "timer" ? customTimerToolHtml(tool) : customStudentTasksToolHtml(tool);
    }).join("");
    if (!toolsHtml && PRESENTING && (block.tools || []).length) return "";
    toolsHtml = toolsHtml || '<p class="editor-hint" style="margin:0;">Aucun outil dans ce bloc — ajoutez-en depuis l’éditeur.</p>';
    return '<div class="appearance-panel projected-custom-panel" data-custom-block-id="' + esc(block.id) + '">' +
      "<h3>" + esc(block.name || "Bloc personnalisé") + "</h3>" +
      '<div class="custom-block-body projected-scroll">' + toolsHtml + "</div>" +
    "</div>";
  }
  /* câble les boutons d'un minuteur de bloc personnalisé déjà présent dans le DOM (voir
     customTimerToolHtml ci-dessus) — sans effet si ce bloc n'est pas affiché (bloc masqué :
     ses éléments ne sont simplement pas dans le DOM, getElementById renvoie null). */
  function wireCustomTimerTool(tool) {
    var wrapEl = document.getElementById("ctw-" + tool.id);
    if (!wrapEl) return;
    var st = getCustomTimerState(tool);
    var settingsToggle = document.getElementById("cts-" + tool.id);
    if (settingsToggle) settingsToggle.addEventListener("click", function () {
      st.settingsVisible = !st.settingsVisible;
      renderProjected();
    });
    Array.prototype.forEach.call(wrapEl.querySelectorAll("[data-ct-preset]"), function (btn) {
      btn.addEventListener("click", function () {
        st.seconds = Number(btn.getAttribute("data-ct-preset")) * 60;
        st.running = false; st.startTs = null; st.pausedElapsedMs = 0;
        renderProjected();
      });
    });
    var playBtn = document.getElementById("ctp-" + tool.id);
    if (playBtn) playBtn.addEventListener("click", function () {
      if (st.running) {
        st.pausedElapsedMs = Date.now() - st.startTs;
        st.running = false;
      } else {
        st.startTs = Date.now() - st.pausedElapsedMs;
        st.running = true;
      }
      renderProjected();
    });
    var resetBtn = document.getElementById("ctr-" + tool.id);
    if (resetBtn) resetBtn.addEventListener("click", function () {
      st.running = false; st.startTs = null; st.pausedElapsedMs = 0;
      renderProjected();
    });
  }
  /* repeint (sans reconstruire le DOM) le remplissage/chiffre de chaque minuteur de bloc
     personnalisé actuellement affiché — appelée par la boucle globale à 250 ms tout en bas
     du fichier, exactement comme projTimerLoop() pour le minuteur de la vue projetée : aucun
     setInterval propre à chaque instance, donc rien à nettoyer/pouvant fuir à la navigation. */
  function customBlockTimersTick() {
    Object.keys(customTimerRuntime).forEach(function (toolId) {
      var st = customTimerRuntime[toolId];
      if (!st.running) return;
      var elapsedMs = Date.now() - st.startTs;
      var remaining = st.seconds - elapsedMs / 1000;
      var pct = Math.min(100, (elapsedMs / (st.seconds * 1000)) * 100);
      var fillEl = document.getElementById("ctf-" + toolId);
      var cdEl = document.getElementById("ctc-" + toolId);
      if (fillEl) fillEl.style.width = pct.toFixed(1) + "%";
      if (cdEl) cdEl.textContent = fmt(Math.max(0, remaining));
      if (remaining <= 0) {
        st.running = false;
        var playBtn = document.getElementById("ctp-" + toolId);
        if (playBtn) playBtn.innerHTML = fillIcon('<path d="M8 5v14l11-7L8 5Z"/>') + " Démarrer";
      }
    });
  }

  function renderProjected() {
    lastProjectedStepIndex = state.index; /* la liste des tâches dépend de l'étape : voir refreshProjectedLive() */
    var classTasks = visibleClassTasks();
    var homeworkAuto = collectAutoHomeworkTasks(); /* les devoirs restent ceux de toute la séance */
    var showDetails = getPlanShowDetails();
    var showGroups = getPlanShowGroups();
    var allGroups = [];
    STEPS.forEach(function (s) { (s.taskGroups || []).forEach(function (g) { allGroups.push(g); }); });

    var taskItemsHtml = classTasks.length
      ? renderTaskListWithGroups(classTasks, allGroups, showGroups, function (t) {
          return '<label class="plan-task"><input type="checkbox" /><span>' + planTaskLabel(t) + "</span>" + planBadgesHtml(t, showDetails) + "</label>";
        })
      : '<p class="editor-hint" style="margin:0;">' + (PROFILE_KIND === "lecon" ? "Aucune tâche pour l’instant — ajoutez-en depuis l’éditeur." : "Aucune tâche pour cette étape.") + "</p>";

    var homeworkAutoHtml = homeworkAuto.length
      ? '<div class="tasks-block">' + homeworkAuto.map(function (t) {
          var dueStr = formatDueDateFR(t.dueDate);
          return '<div class="task-chip">' + planTaskLabel(t) + (dueStr ? ' <span style="color:var(--muted);font-weight:400;">— à rendre le ' + esc(dueStr) + '</span>' : "") + "</div>";
        }).join("") + "</div>"
      : "";
    var extraHtml = (COURSE_HOMEWORK_EXTRA || []).map(function (item, i) {
      item = normalizeHomeworkExtraItem(item);
      if (PRESENTING) {
        if (!String(item.text || "").trim()) return "";
        var extraDue = formatDueDateFR(item.dueDate);
        return '<div class="task-chip">' + esc(item.text) + (extraDue ? ' <span style="color:var(--muted);font-weight:400;">— à rendre le ' + esc(extraDue) + "</span>" : "") + "</div>";
      }
      return '<div class="task-row" data-hi="' + i + '">' +
        '<input type="text" class="text-input proj-hw-extra-text" value="' + esc(item.text) + '" placeholder="Devoir supplémentaire" aria-label="Devoir supplémentaire" />' +
        '<label class="pause-toggle">À rendre le <input type="date" class="proj-hw-extra-date" value="' + esc(item.dueDate || "") + '" aria-label="Date de rendu" /></label>' +
        '<button class="row-btn proj-hw-extra-delete" title="Supprimer ce devoir" aria-label="Supprimer ce devoir">' + svg("trash") + "</button>" +
      "</div>";
    }).join("");
    var noHomeworkAtAll = !homeworkAuto.length && !(COURSE_HOMEWORK_EXTRA || []).length;

    var blocksVisible = {
      tasks: getProjectedBlockVisible("tasks"),
      homework: getProjectedBlockVisible("homework"),
      info: getProjectedBlockVisible("info")
    };
    if (PRESENTING) {
      /* en présentation, un bloc sans contenu n'a rien à montrer aux élèves : on ne l'affiche pas */
      blocksVisible.tasks = blocksVisible.tasks && classTasks.length > 0;
      blocksVisible.homework = blocksVisible.homework && !noHomeworkAtAll && (homeworkAuto.length > 0 || extraHtml !== "");
      blocksVisible.info = blocksVisible.info && String(COURSE_INFO || "").trim() !== "";
    }
    var customBlocksHtml = (CUSTOM_BLOCKS || []).filter(function (b) { return getProjectedBlockVisible("custom:" + b.id); })
      .map(customBlockHtml).filter(function (html) { return html !== ""; });
    var visibleBlockCount = (blocksVisible.tasks ? 1 : 0) + (blocksVisible.homework ? 1 : 0) + (blocksVisible.info ? 1 : 0) + customBlocksHtml.length;
    var showCourseTimerBlock = getProjectedBlockVisible(COURSE_TIMER_BLOCK_KEY);

    projectedWrap.innerHTML =
      '<div class="editor projected-dashboard' + (PRESENTING ? " presenting-view" : "") + (visibleBlockCount ? "" : " proj-solo") + '">' +
        (PRESENTING
          ? '<h2 class="sr-only">Vue projetée</h2>'
          : '<div class="editor-topbar"><h2>Modifier devoirs et infos</h2><button class="action-btn primary" id="proj-present-btn" title="Revenir à l’affichage pour la classe (touche Échap)">' + svg("check") + " Terminer</button></div>") +
        '<div class="projected-context-title" id="proj-context-title">' + esc(projectedContextTitle()) + "</div>" +
        projStepProgressHtml() +
        '<div class="projected-top-row">' +
          (showCourseTimerBlock
            ? '<div class="appearance-panel projected-timer">' +
                '<div class="active-card" style="padding:16px;">' +
                  '<div class="card-fill" id="proj-fill" style="width:0%"></div>' +
                  '<div class="card-content" style="align-items:center;">' +
                    '<div class="projected-timer-head">' +
                      '<span class="timer-status" id="proj-status"></span>' +
                      (SHOW_COURSE_TIME
                        ? '<div class="timer-row"><span class="countdown" id="proj-countdown"></span><span class="countdown-label">restant</span></div>'
                        : '<div class="projected-timer-hidden-note">Temps non affiché</div>') +
                    "</div>" +
                  "</div>" +
                "</div>" +
              "</div>"
            : "") +
          '<div class="projected-tool-slot" id="proj-tool-slot"' + (projToolOpen ? "" : " hidden") + "></div>" +
        "</div>" +
        '<div class="projected-columns" style="--proj-cols:' + Math.max(visibleBlockCount, 1) + ';">' +
          (blocksVisible.tasks
            ? '<div class="appearance-panel projected-tasks-panel">' +
                "<h3>Tâches à faire en classe</h3>" +
                '<div class="plan-list projected-scroll">' + taskItemsHtml + "</div>" +
              "</div>"
            : "") +
          (blocksVisible.homework
            ? '<div class="appearance-panel projected-homework-panel">' +
                "<h3>Devoirs</h3>" +
                '<div class="projected-scroll">' +
                  homeworkAutoHtml +
                  '<div class="editor-rows" id="proj-hw-extra-rows">' + extraHtml + "</div>" +
                  (noHomeworkAtAll ? '<p class="editor-hint" style="margin:4px 0 0;">Aucun devoir pour l’instant.</p>' : "") +
                "</div>" +
                (PRESENTING ? "" :
                  '<button class="add-row-btn" id="proj-hw-extra-add">' + svg("plus") + " Ajouter un devoir</button>" +
                  '<button class="action-btn" id="proj-copy-btn" style="margin-top:6px;" title="Copier les devoirs et les infos importantes, prêts à coller sur le site de l’école">' + svg("copy") + " Copier devoirs et infos</button>") +
              "</div>"
            : "") +
          (blocksVisible.info
            ? '<div class="appearance-panel projected-info-panel">' +
                "<h3>Infos importantes</h3>" +
                (PRESENTING
                  ? '<div class="proj-info-text">' + esc(COURSE_INFO) + "</div>"
                  : '<textarea class="text-input" id="proj-info" placeholder="Informations à afficher pour la classe" aria-label="Infos importantes">' + esc(COURSE_INFO) + "</textarea>") +
              "</div>"
            : "") +
          customBlocksHtml.join("") +
        "</div>" +
      "</div>";

    /* si un outil était ouvert dans le bloc à côté du minuteur, on le replace dans le
       nouveau slot (le innerHTML ci-dessus vient de tout reconstruire) sans toucher à
       son contenu : le tools-wrap et ses écouteurs d'événements restent intacts */
    if (projToolOpen) {
      var toolSlot = document.getElementById("proj-tool-slot");
      if (toolSlot) {
        toolSlot.hidden = false;
        toolSlot.appendChild(toolsWrap);
        toolsWrap.hidden = false;
      }
    }

    refreshProjectedLive();
    wireProjectedEvents();
  }

  /* PRESENTING = true : l'affichage pour la classe (par défaut, à chaque « Projeter »). false : la modification
     en direct des devoirs et des infos (menu Plus → « Modifier devoirs et infos »), d'où « Terminer » ramène à
     l'affichage pour la classe. L'en-tête ne change pas entre les deux : seul le tableau de bord est redessiné. */
  function setPresenting(v) {
    PRESENTING = !!v;
    renderProjected();
    var focusEl = PRESENTING ? btnMore : (projectedWrap.querySelector("#proj-hw-extra-add, #proj-info") || document.getElementById("proj-present-btn"));
    if (focusEl) focusEl.focus();
  }
  /* Échap, du plus local au plus global : termine la modification des devoirs, sinon referme l'outil ouvert,
     sinon quitte la présentation (retour au Programme). Une leçon n'a pas de vue Programme : Échap n'y
     renvoie pas à l'accueil, il faut le bouton « Quitter la présentation ». */
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape" || currentView !== "projected") return;
    if (document.querySelector('[role="dialog"]')) return; /* une fenêtre ouverte (aide, détail d'étape, confirmation) garde son propre Échap */
    if (!PRESENTING) { setPresenting(true); return; }
    if (toolsOpen) { closeToolsPanel(); btnTools.focus(); return; }
    if (PROFILE_KIND !== "lecon") quitPresentation();
  });

  function wireProjectedEvents() {
    var presentBtn = document.getElementById("proj-present-btn");
    if (presentBtn) presentBtn.addEventListener("click", function () { setPresenting(true); });
    var infoEl = document.getElementById("proj-info");
    if (infoEl) {
      infoEl.addEventListener("input", function (e) { COURSE_INFO = e.target.value; });
      infoEl.addEventListener("blur", function () { persistProjectedFields(); });
    }
    var addHwBtn = document.getElementById("proj-hw-extra-add");
    if (addHwBtn) addHwBtn.addEventListener("click", function () {
      COURSE_HOMEWORK_EXTRA.push({ text: "", dueDate: "" });
      persistProjectedFields();
      renderProjected();
      var inputs = projectedWrap.querySelectorAll(".proj-hw-extra-text");
      var last = inputs[inputs.length - 1];
      if (last) last.focus();
    });
    Array.prototype.forEach.call(projectedWrap.querySelectorAll("[data-hi]"), function (rowEl) {
      var i = Number(rowEl.getAttribute("data-hi"));
      var txt = rowEl.querySelector(".proj-hw-extra-text");
      txt.addEventListener("input", function (e) { COURSE_HOMEWORK_EXTRA[i] = normalizeHomeworkExtraItem(COURSE_HOMEWORK_EXTRA[i]); COURSE_HOMEWORK_EXTRA[i].text = e.target.value; });
      txt.addEventListener("blur", function () { persistProjectedFields(); });
      var dateInput = rowEl.querySelector(".proj-hw-extra-date");
      if (dateInput) dateInput.addEventListener("change", function (e) {
        COURSE_HOMEWORK_EXTRA[i] = normalizeHomeworkExtraItem(COURSE_HOMEWORK_EXTRA[i]);
        COURSE_HOMEWORK_EXTRA[i].dueDate = e.target.value;
        persistProjectedFields();
      });
      rowEl.querySelector(".proj-hw-extra-delete").addEventListener("click", function () {
        COURSE_HOMEWORK_EXTRA.splice(i, 1);
        persistProjectedFields();
        renderProjected();
      });
    });
    var copyBtn = document.getElementById("proj-copy-btn");
    if (copyBtn) copyBtn.addEventListener("click", function () {
      var text = buildDevoirsInfosText();
      if (!text) { showToast("Rien à copier pour l’instant."); return; }
      copyTextToClipboard(text);
    });
    (CUSTOM_BLOCKS || []).forEach(function (block) {
      (block.tools || []).forEach(function (tool) { if (tool.type === "timer") wireCustomTimerTool(tool); });
    });
  }

  /* place le panneau "Outils" habituel (#tools-wrap) dans le bloc prévu à côté du
     minuteur en vue projetée (id="proj-tool-slot"), filtré aux outils choisis pour ce
     programme (PROJECTED_TOOLS) — même panneau et mêmes fonctions de rendu (renderFeu,
     renderMode, …) que le menu "Outils" habituel, mais ici il s'affiche EN PLUS du
     tableau de bord (tâches / devoirs / infos) au lieu de le remplacer : le tableau de
     bord n'est jamais masqué, seul le bloc-outil apparaît, change ou disparaît. */
  function openProjectedToolsMenu() {
    projToolOpen = true;
    toolsOpen = true;
    toolsBackFn = renderProjectedToolsMenu; /* le lien "Outils" d'un outil ouvert revient à cette grille */
    var slot = document.getElementById("proj-tool-slot");
    if (slot) { slot.hidden = false; slot.appendChild(toolsWrap); }
    toolsWrap.hidden = false;
    btnTools.classList.add("is-active");
    renderProjectedToolsMenu();
  }
  function renderProjectedToolsMenu() {
    stopSonometre();
    stopQuickMinuteur();
    var toolIds = Array.isArray(PROJECTED_TOOLS) ? PROJECTED_TOOLS : allToolIds();
    var toolsHtml = TOOL_LIST.concat(PROJECTED_EXTRA_TOOLS).filter(function (t) { return toolIds.indexOf(t.id) !== -1; }).map(function (t) {
      return '<button class="tool-card" data-ptool="' + t.id + '">' +
        '<div class="active-icon">' + svg(t.icon) + "</div>" +
        "<span>" + esc(t.label) + "</span>" +
      "</button>";
    }).join("");
    toolsWrap.innerHTML =
      '<div class="editor">' +
        '<div class="editor-topbar"><h2>Outils</h2>' +
          '<button class="back-link" id="tools-close">' + svg("next") + " Fermer</button>" +
        "</div>" +
        (toolsHtml
          ? '<div class="tool-grid">' + toolsHtml + "</div>"
          : '<p class="editor-hint" style="margin:0;">Aucun outil sélectionné — choisissez-les depuis l’éditeur du programme.</p>') +
      "</div>";
    document.getElementById("tools-close").addEventListener("click", closeProjectedTools);
    Array.prototype.forEach.call(toolsWrap.querySelectorAll("[data-ptool]"), function (btn) {
      btn.addEventListener("click", function () {
        openProjectedTool(btn.getAttribute("data-ptool"));
      });
    });
  }

  /* ouvre un outil dans le bloc à côté du minuteur : réutilise exactement les mêmes
     fonctions de rendu (renderFeu, renderMode, …) et le même panneau (toolsWrap) que le
     menu "Outils" habituel — seule sa position dans la page change (dans proj-tool-slot
     plutôt que dans main-row), et son lien "Outils" revient à la grille projetée */
  function openProjectedTool(id) {
    projToolOpen = true;
    toolsOpen = true;
    toolsBackFn = renderProjectedToolsMenu;
    var slot = document.getElementById("proj-tool-slot");
    if (slot) { slot.hidden = false; slot.appendChild(toolsWrap); }
    toolsWrap.hidden = false;
    if (id === "feu") renderFeu();
    else if (id === "mode") renderMode();
    else if (id === "minuteur") renderMinuteur();
    else if (id === "tirage") renderTirage();
    else if (id === "de") renderDe();
    else if (id === "emotions") renderEmotions();
    else if (id === "sonometre") renderSonometre();
    else if (id === "plan") renderPlan();
    else if (id === "chrono") renderProjTimerSettings();

  /* referme le bloc-outil de la vue projetée : le tableau de bord reste affiché tel
     quel (il n'a jamais été masqué), seul le bloc-outil disparaît — closeToolsPanel()

  function closeProjectedTools() { closeToolsPanel(); }

  /* ---- Minuteur de cours : outil (vue projetée uniquement) regroupant Pause/
     Redémarrer, la durée totale du cours et l'affichage du chiffre — ces contrôles
     vivaient auparavant directement dans le bloc chrono, désormais réduit au chiffre
     (ou à la note "Temps non affiché") et à son remplissage visuel (#proj-fill, qui
     reste toujours affiché, quel que soit ce réglage) */
  function renderProjTimerSettings() {
    stopSonometre();
    stopQuickMinuteur();
    /* déroulé minuté : le bloc affiche l'étape en cours (voir projClock()). Pas de « durée totale du cours »
       à régler ici (la durée de chaque étape se règle dans l'éditeur) ; « Redémarrer » relance l'étape. */
    var followsSteps = projFollowsSteps();
    toolsWrap.innerHTML =
      '<div class="editor">' + toolTopbar("Minuteur de cours") +
        '<div class="active-actions">' +
          '<button class="action-btn primary" id="proj-play"></button>' +
          '<button class="action-btn" id="proj-restart">' + svg("restart") + (followsSteps ? " Recommencer l’étape" : " Redémarrer") + "</button>" +
        "</div>" +
        (followsSteps ? '<p class="editor-hint" style="margin:0;">Le décompte suit l’étape en cours. La durée de chaque étape se règle avec « Modifier », dans la vue Programme.</p>' : "") +
        (SHOW_COURSE_TIME && !followsSteps
          ? '<div class="jump-row">' +
              '<span class="unit-label">Durée totale du cours</span>' +
              '<input type="number" id="proj-minutes" min="1" max="300" value="' + Math.max(1, Math.round(projTimer.seconds / 60)) + '" aria-label="Durée totale du cours en minutes" />' +
              '<span class="unit-label">min</span>' +
            "</div>"
          : "") +
        '<label class="switch"><input type="checkbox" id="proj-show-time"' + (SHOW_COURSE_TIME ? " checked" : "") + ' /> Afficher le temps (chiffre et réglage de durée) — le remplissage visuel de la case reste dans tous les cas</label>' +
      "</div>";
    wireToolBack();
    projTimerLoop();
    var playBtn = document.getElementById("proj-play");
    if (playBtn) playBtn.addEventListener("click", toggleProjClock);
    var restartBtn = document.getElementById("proj-restart");
    if (restartBtn) restartBtn.addEventListener("click", function () {
      if (projFollowsSteps()) {
        if (state.index >= STEPS.length) return;
        state.pausedElapsedMs = 0;
        state.startTs = Date.now();
        state.running = true;
        saveTimerState();
      } else {
        projTimer.seconds = (COURSE_MINUTES > 0 ? COURSE_MINUTES : 45) * 60;
        projTimer.pausedElapsedMs = 0;
        projTimer.startTs = Date.now();
        projTimer.running = true;
      }
      refreshProjectedLive();
    });
    var minutesEl = document.getElementById("proj-minutes");
    if (minutesEl) minutesEl.addEventListener("change", function (e) {
      var m = parseInt(e.target.value, 10);
      if (!isFinite(m) || m < 1) m = 45;
      COURSE_MINUTES = m;
      persistProjectedFields();
      projTimer.running = false;
      projTimer.seconds = m * 60;
      projTimer.pausedElapsedMs = 0;
      projTimer.startTs = null;
      renderProjected();
      renderProjTimerSettings();
    });
    var showTimeEl = document.getElementById("proj-show-time");
    if (showTimeEl) showTimeEl.addEventListener("change", function (e) {
      SHOW_COURSE_TIME = e.target.checked;
      persistProjectedFields();
      renderProjected();
      renderProjTimerSettings();
    });
  }

    if (mainRow && toolsWrap.parentNode !== mainRow) mainRow.insertBefore(toolsWrap, mainRow.firstChild);

  /* referme complètement le panneau Outils, où qu'il ait été affiché — y compris le
     cas où il avait été déplacé dans le bloc-outil de la vue projetée (proj-tool-slot) :

  var toolsBackFn = null; /* where "Outils" back-link returns to — renderToolsMenu by default, or the projected view's own tool grid when a tool was opened from there */
  function wireToolBack(after) {

  /* ---- shared "fill available space" sizing helper, used by every tool below ----
     Each tool's display area (icon, digits, gauge…) is a flex child sized `flex: 1 1 auto`
     so it already grows into whatever space its (optional) "Réglages" block frees up —
     but the actual visual content inside it (an icon, a big number…) still needs its own
     pixel size recomputed to fill that box, since it isn't a text node that reflows on its
     own. `setFitObserver` re-measures the box with a ResizeObserver (so it also reacts when
     the panel is reparented into the projected view's differently-sized slot) and only ever
     keeps ONE observer alive at a time, since only one tool panel exists in `toolsWrap` at
     once and every render() call rebuilds it from scratch. */
  var activeFitRO = null;
  function setFitObserver(boxEl, fn) {
    if (activeFitRO) { activeFitRO.disconnect(); activeFitRO = null; }
    if (!boxEl || typeof fn !== "function") return;
    fn();
    if (typeof ResizeObserver === "function") {
      activeFitRO = new ResizeObserver(function () { fn(); });
      activeFitRO.observe(boxEl);
    }
  }

  /* ---- Feu tricolore ---- */
  function loadFeu() {
    try {
      var raw = localStorage.getItem(FEU_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { color: "vert", labels: { rouge: "Silence total", orange: "On chuchote", vert: "On peut parler" }, settingsVisible: true };
  }
  function saveFeu(f) { try { localStorage.setItem(FEU_KEY, JSON.stringify(f)); } catch (e) {} }

  /* grandit le(s) disque(s) du feu pour remplir .feu-wrap (un seul disque, bien plus grand,
     quand les réglages — les 3 couleurs sélectionnables — sont masqués) */
  function fitFeuLights(wrapEl) {
    if (!wrapEl) return;
    var lights = wrapEl.querySelectorAll(".feu-light");
    var n = lights.length;
    if (!n) return;
    var wrapH = wrapEl.clientHeight, wrapW = wrapEl.clientWidth;
    if (!wrapH || !wrapW) return;
    var label = wrapEl.querySelector(".feu-current-label");
    var labelH = label ? label.offsetHeight : 0;
    var wrapGap = 6, bodyPadV = 12, bodyPadH = 20, lightGap = 5;
    var availH = Math.max(20, wrapH - labelH - wrapGap - bodyPadV - lightGap * (n - 1));
    var perLightH = availH / n;
    var availW = Math.max(20, wrapW - bodyPadH);
    var size = Math.max(14, Math.min(perLightH, availW, 220));
    Array.prototype.forEach.call(lights, function (l) { l.style.width = size + "px"; l.style.height = size + "px"; });
  }

  /* ---- Mode de travail ---- */

  /* grandit l'icône de mode pour remplir .mode-current (quasi toute la case quand la

  function fitModeIcon(curEl) {
