    if (!chosen.length) { showToast("Sélectionnez d’abord un ou plusieurs programmes."); return; }
    if (chosen.length === 1) {
      exportProfile(chosen[0].id);
      return;
    }
    downloadJson({ profiles: chosen.map(profileExportShape) }, "programmes (" + chosen.length + ").json");
    showToast(chosen.length + " programmes téléchargés dans un seul fichier.");
  }

  function addImportedProfile(raw) {
    if (!raw || !Array.isArray(raw.steps) || !raw.steps.length) return null;
    var p = {
      id: makeProfileId(),
      title: raw.title || "Programme importé",
      steps: raw.steps.map(function (s) {
        return {
          label: s.label || "", seconds: s.seconds || 60, icon: s.icon || "grid", isPause: !!s.isPause,
          tasks: (s.tasks || []).map(function (t) { return { name: t.name || "", text: t.text || "", mandatory: t.mandatory !== false, homework: !!t.homework, dueDate: t.dueDate || "", groupId: t.groupId || "", studentIds: Array.isArray(t.studentIds) ? t.studentIds.slice() : [] }; }),
          taskGroups: Array.isArray(s.taskGroups) ? s.taskGroups.map(function (g) { return { id: g.id || makeGroupId(), label: g.label || "", choose: g.choose > 0 ? g.choose : 1 }; }) : []
        };
      }),
      theme: Object.assign(defaultTheme(), raw.theme || {}),
      students: Array.isArray(raw.students) ? raw.students.map(function (s) {
        return { id: s.id || makeStudentId(), name: s.name || "", excluded: !!s.excluded, noGroup: !!s.noGroup, tag: s.tag || "", groupId: s.groupId || "" };
      }) : [],
      studentGroups: Array.isArray(raw.studentGroups) ? raw.studentGroups.map(function (g) { return { id: g.id || makeStudentGroupId(), label: g.label || "" }; }) : [],
      planShowDetails: typeof raw.planShowDetails === "boolean" ? raw.planShowDetails : true,
      showTime: raw.showTime !== false,
      timed: raw.timed !== false,
      kind: raw.kind === "lecon" ? "lecon" : "deroule",
      projectedTools: withChronoTool(raw.projectedTools),
      projectedBlocksVisible: raw.projectedBlocksVisible ? Object.assign({}, raw.projectedBlocksVisible) : {},
      customBlocks: normalizeCustomBlocks(raw.customBlocks),
      courseMinutes: raw.courseMinutes > 0 ? raw.courseMinutes : 45,
      showCourseTime: raw.showCourseTime !== false,
      courseInfo: raw.courseInfo || "",
      courseHomeworkExtra: Array.isArray(raw.courseHomeworkExtra) ? raw.courseHomeworkExtra.map(normalizeHomeworkExtraItem) : [],
      updatedAt: Date.now()
    };
    profiles.push(p);
    return p;
  }

  function importFileChosen(file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var data = JSON.parse(String(reader.result));
        var bundle = Array.isArray(data) ? data : (Array.isArray(data && data.profiles) ? data.profiles : [data]);
        var added = bundle.map(addImportedProfile).filter(Boolean);
        if (!added.length) {
          showToast("Fichier invalide : aucun programme trouvé.");
          return;
        }
        saveProfiles(profiles);
        showToast(added.length === 1
          ? "Programme « " + added[0].title + " » importé."
          : added.length + " programmes importés.");
        renderHome();
      } catch (e) {
        showToast("Impossible de lire ce fichier.");
      }
    };
    reader.readAsText(file);
  }

  /* Menu « Plus » d'une carte de programme (accueil) : même comportement que le menu « Plus » de l'en-tête.
     Un seul ouvert à la fois ; il se ferme au clic ailleurs, à Échap (le focus revient sur « Plus ») ou après
     un choix ; flèches haut/bas pour passer d'une action à l'autre. Il reste dans l'écran et s'ouvre vers le
     haut quand la place manque (dernière carte de la liste, petit écran). */
  function closeCardMenus(returnFocus) {
    Array.prototype.forEach.call(homeWrap.querySelectorAll(".card-menu:not([hidden])"), function (menu) {
      menu.hidden = true;
      var btn = menu.parentNode.querySelector(".profile-more");
      if (!btn) return;
      btn.setAttribute("aria-expanded", "false");
      if (returnFocus) btn.focus();
    });
  }
  function openCardMenu(btn, menu) {
    closeCardMenus(false);
    menu.hidden = false;
    btn.setAttribute("aria-expanded", "true");
    menu.classList.remove("drop-up");
    var r = btn.getBoundingClientRect();
    /* aligné sur le bouton, mais ramené dans l'écran s'il dépasserait à droite (ou à gauche sur téléphone) */
    var left = Math.max(8, Math.min(r.left, window.innerWidth - 8 - menu.offsetWidth));
    menu.style.left = (left - menu.parentNode.getBoundingClientRect().left) + "px";
    if (r.bottom + 8 + menu.offsetHeight > window.innerHeight && r.top - 8 - menu.offsetHeight > 0) menu.classList.add("drop-up");
    var firstItem = menu.querySelector(".more-item:not([disabled])");
    if (firstItem) firstItem.focus();
  }
  function focusCardMore(id) {
    Array.prototype.forEach.call(homeWrap.querySelectorAll(".profile-card"), function (card) {
      if (card.getAttribute("data-id") !== id) return;
      var btn = card.querySelector(".profile-more");
      if (btn) btn.focus();
    });
  }
  document.addEventListener("click", function (e) {
    if (e.target.closest && e.target.closest(".card-more-wrap")) return;
    closeCardMenus(false);
  });
  homeWrap.addEventListener("keydown", function (e) {
    var menu = homeWrap.querySelector(".card-menu:not([hidden])");
    if (!menu) return;
    if (e.key === "Escape") { e.preventDefault(); closeCardMenus(true); return; }
    if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
    var items = Array.prototype.slice.call(menu.querySelectorAll(".more-item:not([disabled])"));
    if (!items.length) return;
    e.preventDefault();
    var i = items.indexOf(document.activeElement);
    i = e.key === "ArrowDown" ? (i + 1) % items.length : (i <= 0 ? items.length - 1 : i - 1);
    items[i].focus();
  });

  function renderHome() {
    var validIds = {};
    profiles.forEach(function (p) { validIds[p.id] = true; });
    Object.keys(selectedProfileIds).forEach(function (id) { if (!validIds[id]) delete selectedProfileIds[id]; });
    var selectedCount = Object.keys(selectedProfileIds).filter(function (id) { return selectedProfileIds[id]; }).length;

    var listHtml = profiles.length
      ? profiles.map(function (p, i) {
          return '<div class="profile-card" data-id="' + p.id + '">' +
            '<label class="profile-card-check"><input type="checkbox" class="profile-select"' + (selectedProfileIds[p.id] ? " checked" : "") + ' aria-label="Sélectionner ' + esc(p.title) + '" /></label>' +
            '<div class="profile-card-main">' +
              '<div class="profile-card-title">' + esc(p.title) + "</div>" +
              '<div class="profile-card-meta">' + (p.updatedAt ? "Modifié le " + fmtDate(p.updatedAt) : "") + " · " +
                (p.kind === "lecon" ? "Leçon (vue projetée)" : (p.steps ? p.steps.length : 0) + " étape(s)") + "</div>" +
            "</div>" +
            /* deux commandes visibles par carte : « Ouvrir » (ce qu'on fait presque toujours) et un menu « Plus »
               pour le reste — au lieu de sept boutons par carte. « Supprimer » y est séparé et en rouge. */
            '<div class="profile-card-actions">' +
              '<button class="action-btn primary profile-open" aria-label="Ouvrir ' + esc(p.title) + '">Ouvrir</button>' +
              '<div class="more-wrap card-more-wrap">' +
                '<button class="row-btn row-labeled profile-more" aria-haspopup="menu" aria-expanded="false" aria-controls="card-menu-' + i + '" aria-label="Plus d’actions pour ' + esc(p.title) + '">' + svg("more") + "<span>Plus</span></button>" +
                '<div class="more-menu card-menu" id="card-menu-' + i + '" role="menu" aria-label="Actions pour ' + esc(p.title) + '" hidden>' +
                  '<button class="more-item profile-duplicate" role="menuitem">' + svg("copy") + "<span>Dupliquer</span></button>" +
                  '<button class="more-item profile-export" role="menuitem">' + svg("download") + "<span>Sauvegarder dans un fichier</span></button>" +
                  /* libellé qui dit ce qui se passe : « Réinitialiser » seul laissait croire qu'on effaçait le programme */
                  (p.kind === "lecon" ? "" :
                    '<button class="more-item profile-reset-timer" role="menuitem">' + svg("restart") + "<span>" + (p.timed === false ? "Revenir à la première étape" : "Remettre le minuteur au début") + "</span></button>") +
                  '<button class="more-item profile-up" role="menuitem"' + (i === 0 ? " disabled" : "") + ">" + svg("up") + "<span>Monter dans la liste</span></button>" +
                  '<button class="more-item profile-down" role="menuitem"' + (i === profiles.length - 1 ? " disabled" : "") + ">" + svg("down") + "<span>Descendre dans la liste</span></button>" +
                  '<button class="more-item danger profile-delete" role="menuitem">' + svg("trash") + "<span>Supprimer</span></button>" +
                "</div>" +
              "</div>" +
            "</div>" +
          "</div>";
        }).join("")
      : '<div class="profile-empty">Aucun programme pour l’instant.</div>';

    homeWrap.innerHTML =
      '<div class="editor home-editor">' +
        '<div class="home-title-row">' +
          '<div class="home-title">Bienvenue</div>' +
          '<button class="help-toggle" id="app-help-toggle" type="button" title="À propos de l’application" aria-label="À propos de l’application">?</button>' +
        "</div>" +
        '<p class="editor-hint app-help" id="app-help" hidden>PL-planif’ sert à préparer et lancer le déroulé minuté d’une séance : une suite d’étapes (travail, pause, jeu…) avec leur durée, un minuteur qui les enchaîne automatiquement, et des outils annexes (tirage au sort, feu de circulation, sonomètre, émotions). Chaque programme créé ci-dessous est indépendant : vous pouvez en garder plusieurs, les modifier séparément et rouvrir celui qu’il vous faut.</p>' +
        '<div class="home-actions">' +
          '<button class="action-btn primary" id="home-new">Créer un nouveau programme</button>' +
          '<button class="action-btn" id="home-new-checklist">' + svg("liste", "icon-mini") + " Créer une checklist (sans minutage)</button>" +
          '<button class="action-btn" id="home-new-lecon">' + svg("exposes", "icon-mini") + " Créer une leçon (vue projetée)</button>" +
          '<label class="action-btn home-import-label">Importer un fichier de sauvegarde' +
            '<input type="file" accept="application/json,.json" id="home-import-input" style="display:none" />' +
          "</label>" +
        "</div>" +
        '<p class="editor-hint home-kinds"><strong>Programme</strong> : des étapes avec un minuteur. <strong>Checklist</strong> : des étapes à cocher, sans minuteur. <strong>Leçon</strong> : un écran à projeter avec tâches, devoirs et infos, sans étapes.</p>' +
        '<div class="profile-list">' + listHtml + "</div>" +
        '<div class="home-actions-columns">' +
          '<div class="home-action-col">' +
            '<button class="action-btn" id="home-export-selection"' + (selectedCount ? "" : " disabled") + '>' + svg("download", "icon-mini") + " Sauvegarder la sélection" + (selectedCount ? " (" + selectedCount + ")" : "") + "</button>" +
            (selectedCount ? "" : '<p class="editor-hint">Cochez des programmes dans la liste pour les sauvegarder ensemble.</p>') +
            '<div class="hint-row">' +
              '<p class="editor-hint home-backup-status">' + esc(backupReminderText()) + "</p>" +
              '<button class="help-toggle" id="backup-help-toggle" type="button" title="Comment ça marche\u202F?" aria-label="Comment ça marche\u202F?">?</button>' +
            "</div>" +
            '<p class="editor-hint" id="backup-help" hidden>Chaque programme reste automatiquement enregistré dans ce navigateur, sur cet appareil : recharger la page, la fermer ou redémarrer l’ordinateur ne fait rien perdre. Il n’y a en revanche pas de compte ni de synchronisation en ligne — si vous changez d’ordinateur ou de navigateur, ou si vous voulez garder une copie de sécurité, il faut le faire vous-même : ' +
              '<strong>Sauvegarder</strong> (un programme, ou « Sauvegarder la sélection » — plusieurs à la fois) télécharge un fichier <code>.json</code> — gardez-le. ' +
              'Pour retrouver un programme ainsi sauvegardé (sur cet appareil ou un autre), utilisez <strong>Importer un fichier de sauvegarde</strong> et choisissez ce fichier ; il réapparaît alors dans la liste ci-dessus.</p>' +
          "</div>" +
          '<div class="home-action-col">' +
            '<button class="action-btn" id="home-install">' + svg("download", "icon-mini") + " Installer l’app</button>" +
            '<p class="editor-hint install-help-base">Installe PL-planif’ comme une application, dans sa propre fenêtre (Chrome ou Edge).</p>' +
            '<div class="install-help" id="install-help" hidden>' +
              "Pas d’installation automatique possible ici. Pour installer cette page comme une application : menu <strong>⋮</strong> du navigateur (Chrome ou Edge, en haut à droite) → <strong>Plus d’outils</strong> → <strong>Créer un raccourci…</strong> → cocher <strong>« Ouvrir en tant que fenêtre »</strong> → Créer. " +
              "Sur Mac, une fois l’app ouverte : clic droit (ou <strong>Ctrl</strong> + clic) sur son icône dans le <strong>Dock</strong> → <strong>Options</strong> → <strong>Garder dans le Dock</strong>, pour la retrouver directement au démarrage sans repasser par le navigateur." +
            "</div>" +
          "</div>" +
        "</div>" +
      "</div>";

    document.getElementById("home-new").addEventListener("click", function () { createBlankProfile(true); });
    document.getElementById("home-new-checklist").addEventListener("click", function () { createBlankProfile(false); });
    document.getElementById("home-new-lecon").addEventListener("click", function () { createLeconProfile(); });
    document.getElementById("home-import-input").addEventListener("change", function (e) {
      var file = e.target.files && e.target.files[0];
      importFileChosen(file);
      e.target.value = "";
    });
    document.getElementById("home-export-selection").addEventListener("click", exportSelection);
    document.getElementById("app-help-toggle").addEventListener("click", function () {
      var el = document.getElementById("app-help");
      if (el) el.hidden = !el.hidden;
    });
    document.getElementById("backup-help-toggle").addEventListener("click", function () {
      var el = document.getElementById("backup-help");
      if (el) el.hidden = !el.hidden;
    });
    document.getElementById("home-install").addEventListener("click", function () {
      if (deferredInstallPrompt) {
        deferredInstallPrompt.prompt();
        deferredInstallPrompt.userChoice.then(function (choice) {
          showToast(choice.outcome === "accepted" ? "Application installée." : "Installation annulée.");
          deferredInstallPrompt = null;
        });
      } else {
        var help = document.getElementById("install-help");
        if (help) help.hidden = !help.hidden;
      }
    });
    Array.prototype.forEach.call(homeWrap.querySelectorAll(".profile-card"), function (card) {
      var id = card.getAttribute("data-id");
      card.querySelector(".profile-open").addEventListener("click", function () { openProfile(id); });
      var moreBtn = card.querySelector(".profile-more");
      var menu = card.querySelector(".card-menu");
      moreBtn.addEventListener("click", function () {
        if (menu.hidden) openCardMenu(moreBtn, menu); else closeCardMenus(true);
      });
      /* un choix referme d'abord le menu et rend le focus à « Plus » : c'est là que la fenêtre de
         confirmation (Supprimer, Remettre au début) le rendra si on annule */
      function menuAction(selector, fn) {
        var item = card.querySelector(selector);
        if (item) item.addEventListener("click", function () { closeCardMenus(true); fn(); });
      }
      menuAction(".profile-duplicate", function () { duplicateProfile(id); });
      menuAction(".profile-export", function () { exportProfile(id); });
      menuAction(".profile-reset-timer", function () { resetProfileTimer(id); });
      menuAction(".profile-delete", function () { deleteProfile(id); });
      /* après un déplacement, la liste est redessinée : le focus revient sur le « Plus » de la même carte */
      menuAction(".profile-up", function () { reorderProfile(id, -1); focusCardMore(id); });
      menuAction(".profile-down", function () { reorderProfile(id, 1); focusCardMore(id); });
      card.querySelector(".profile-select").addEventListener("change", function (e) {
        if (e.target.checked) selectedProfileIds[id] = true; else delete selectedProfileIds[id];
        var btn = document.getElementById("home-export-selection");
        var count = Object.keys(selectedProfileIds).filter(function (i) { return selectedProfileIds[i]; }).length;
        btn.disabled = !count;
        btn.innerHTML = svg("download", "icon-mini") + " Sauvegarder la sélection" + (count ? " (" + count + ")" : "");
      });
    });
  }

  function fmt(sec) {
    sec = Math.max(0, Math.ceil(sec));
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ":" + (s < 10 ? "0" : "") + s;
  }

  /* En vue projetée, le bouton pilote l'horloge affichée (voir projClock()) ; il disparaît s'il n'y a rien
     à mettre en pause (checklist ou leçon dont le bloc « Minuteur de cours » est masqué). */
  function updatePlayButton() {
    var onProjected = currentView === "projected";
    var show = currentView !== "home" && (onProjected ? (projFollowsSteps() || getProjectedBlockVisible(COURSE_TIMER_BLOCK_KEY)) : TIMED);
    btnPlay.hidden = !show;
    if (!show) return;
    var c = onProjected ? projClock() : stepClock();
    btnPlay.disabled = c.done && (!onProjected || projFollowsSteps()); /* programme terminé : plus rien à démarrer */
    var label = playLabelText(c);
    if (btnPlay.getAttribute("data-state") === label) return; /* ne réécrit le bouton que si son libellé change */
    btnPlay.setAttribute("data-state", label);
    btnPlay.title = label;
    btnPlay.innerHTML = playIconHtml(c) + '<span class="ctrl-label">' + label + "</span>";
  }

  function tasksBlockHtml(step) {
    if (!step.tasks || !step.tasks.length) return "";
    var items = renderTaskListWithGroups(step.tasks, step.taskGroups || [], getPlanShowGroups(), function (t) {
      var name = esc(t.name), text = esc(t.text);
      if (name && text) return '<div class="task-chip"><strong>' + name + "</strong> — " + text + "</div>";
      if (name) return '<div class="task-chip"><strong>' + name + "</strong></div>";
      return '<div class="task-chip">' + text + "</div>";
    });
    return '<div class="tasks-block"><div class="tasks-block-label">Tâches</div>' + items + "</div>";
  }

  /* ---- popup de détail d'étape (clic sur la carte active ou une puce "À suivre") ---- */
  function getPlanShowDetails() {
    var p = currentProfileId ? findProfile(currentProfileId) : null;
    return p ? p.planShowDetails !== false : true;
  }
  function setPlanShowDetails(checked) {
    if (!currentProfileId) return;
    var pr = findProfile(currentProfileId);
    if (pr) { pr.planShowDetails = checked; saveProfiles(profiles); }
  }
  function getPlanShowGroups() {
    var p = currentProfileId ? findProfile(currentProfileId) : null;
    if (!p) return true;
    return p.planShowGroups !== undefined ? p.planShowGroups : getPlanShowDetails();
  }
  function setPlanShowGroups(checked) {
    if (!currentProfileId) return;
    var pr = findProfile(currentProfileId);
    if (pr) { pr.planShowGroups = checked; saveProfiles(profiles); }
  }
  /* per-profile : lesquels blocs de la vue projetée sont affichés — les 3 blocs fixes
     (tâches / devoirs / infos), le bloc « Minuteur de cours » (clé COURSE_TIMER_BLOCK_KEY)
     et chaque bloc personnalisé (clé "custom:"+id) partagent ce même annuaire.
     absent/undefined = affiché, même logique de valeur par défaut sûre que
     getPlanShowGroups() ci-dessus, pour qu'un profil déjà enregistré (ou un bloc qui
     vient d'être créé) ne perde jamais silencieusement un bloc. */
  function getProjectedBlockVisible(key) {
    var p = currentProfileId ? findProfile(currentProfileId) : null;
    if (!p || !p.projectedBlocksVisible || p.projectedBlocksVisible[key] === undefined) return true;
    return !!p.projectedBlocksVisible[key];
  }
  function setProjectedBlockVisible(key, checked) {
    if (!currentProfileId) return;
    var pr = findProfile(currentProfileId);
    if (!pr) return;
    if (!pr.projectedBlocksVisible) pr.projectedBlocksVisible = {};
    pr.projectedBlocksVisible[key] = !!checked;
    saveProfiles(profiles);
  }
  function stepDetailTasksHtml(step, showDetails) {
    if (!step.tasks || !step.tasks.length) return '<p class="editor-hint" style="margin:0;">Pas de tâche spécifique.</p>';
    return renderTaskListWithGroups(step.tasks, step.taskGroups || [], getPlanShowGroups(), function (t) {
      return '<div class="plan-task"><span>' + planTaskLabel(t) + "</span>" + planBadgesHtml(t, showDetails) + "</div>";
    });
  }
  function stepDetailHtml(step) {
    var showDetails = getPlanShowDetails();
    return (
      '<div class="step-modal-top">' +
        '<div class="step-modal-heading">' +
          '<div class="active-icon">' + svg(step.icon) + "</div>" +
          '<div class="active-meta">' +
            '<span class="active-label">' + esc(step.label) + "</span>" +
            (TIMED && step.seconds ? '<span class="step-modal-duration">' + Math.round(step.seconds / 60) + " min</span>" : "") +
          "</div>" +
        "</div>" +
        '<button class="ctrl-btn" id="step-detail-close" title="Fermer" aria-label="Fermer">' + svg("close") + "</button>" +
      "</div>" +
      '<div class="appearance-panel step-modal-body">' +
        "<h3>Tâches</h3>" +
        '<div class="plan-list projected-scroll" id="step-detail-tasks">' + stepDetailTasksHtml(step, showDetails) + "</div>" +
      "</div>"
    );
  }
  /* Focus des fenêtres « détail d'étape » et « guide » (comme askConfirm) : à l'ouverture il va sur « Fermer »,
     Tab reste dans la fenêtre, et à la fermeture il revient d'où il venait. Sans cela, au clavier, on
     restait derrière la fenêtre. Ouverte depuis le menu « Plus » (qui se referme), elle rend le focus à « Plus ». */
  var modalReturnFocus = null;
  function focusIntoModal(closeBtnId) {
    var from = document.activeElement;
    modalReturnFocus = (from && moreMenu.contains(from)) ? btnMore : from;
    var closeBtn = document.getElementById(closeBtnId);
    if (closeBtn) closeBtn.focus();
  }
  function restoreModalFocus() {
    if (modalReturnFocus && modalReturnFocus.focus && document.body.contains(modalReturnFocus)) {
      try { modalReturnFocus.focus(); } catch (e) {}
    }
    modalReturnFocus = null;
  }
  function trapTabIn(overlayId, e) {
    if (e.key !== "Tab") return;
    var els = document.querySelectorAll("#" + overlayId + " button, #" + overlayId + " input, #" + overlayId + " a[href]");
    if (!els.length) return;
    var first = els[0], last = els[els.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
  function closeStepDetail() {
    var el = document.getElementById("step-detail-overlay");
    if (!el) return;
    el.remove();
    document.removeEventListener("keydown", stepDetailKeydown);
    restoreModalFocus();
  }
  function stepDetailKeydown(e) {
    if (e.key === "Escape") closeStepDetail();
    else trapTabIn("step-detail-overlay", e);
  }
  function wireStepDetailTrigger(el, step) {
    if (!el) return;
    el.classList.add("has-step-detail");
    el.addEventListener("click", function (e) {
      if (e.target.closest("button, input, a, label")) return;
      openStepDetail(step);
    });
  }
  function openStepDetail(step) {
    closeStepDetail();
    var overlay = document.createElement("div");
    overlay.id = "step-detail-overlay";
    overlay.className = "step-modal-backdrop";
    overlay.innerHTML = '<div class="step-modal" role="dialog" aria-modal="true" aria-label="Détail de l’étape ' + esc(step.label) + '">' + stepDetailHtml(step) + "</div>";
    overlay.addEventListener("click", function (e) {
      if (e.target === overlay) closeStepDetail();
    });
    document.body.appendChild(overlay);
    document.getElementById("step-detail-close").addEventListener("click", closeStepDetail);
    document.addEventListener("keydown", stepDetailKeydown);
    focusIntoModal("step-detail-close");
  }

  /* help guide popup — same overlay pattern as the step detail popup above
     (.step-modal-backdrop/.step-modal), reused as-is: it's already the app's "big,
     scrollable, closes on backdrop/close/Escape" overlay, which fits a long reference
     document better than the editor/tools side panels. It is appended to <body> and
     torn down on close, independently of whichever view (home/timer/editor/projected)
     or running timer is underneath, so opening/closing it never touches that state. */
  function closeHelpGuide() {
    var el = document.getElementById("help-overlay");
    if (!el) return;
    el.remove();
    document.removeEventListener("keydown", helpGuideKeydown);
    restoreModalFocus();
  }
  function helpGuideKeydown(e) {
    if (e.key === "Escape") closeHelpGuide();
    else trapTabIn("help-overlay", e);
  }
  function openHelpGuide() {
    closeHelpGuide();
    var overlay = document.createElement("div");
    overlay.id = "help-overlay";
    overlay.className = "step-modal-backdrop";
    overlay.innerHTML =
      '<div class="step-modal help-modal" role="dialog" aria-modal="true" aria-label="Guide d’utilisation">' +
        '<div class="step-modal-top">' +
          '<div class="step-modal-heading"><span class="active-label">Guide d’utilisation</span></div>' +
          '<button class="ctrl-btn" id="help-close" title="Fermer" aria-label="Fermer">' + svg("close") + "</button>" +
        "</div>" +
        '<div class="help-doc">' + HELP_GUIDE_HTML + "</div>" +
      "</div>";
    overlay.addEventListener("click", function (e) {
      if (e.target === overlay) closeHelpGuide();
    });
    document.body.appendChild(overlay);
    document.getElementById("help-close").addEventListener("click", closeHelpGuide);
    document.addEventListener("keydown", helpGuideKeydown);
    focusIntoModal("help-close");
  }
  btnHelp.addEventListener("click", openHelpGuide);

  var lastRenderedIndex = -1;

  var ACTIONS_KEY = "apres-midi-actions-visible";
  function loadActionsVisible() {
    try { var v = localStorage.getItem(ACTIONS_KEY); return v === "1"; } catch (e) { return false; }
  }
  function saveActionsVisible(v) { try { localStorage.setItem(ACTIONS_KEY, v ? "1" : "0"); } catch (e) {} }

  function render(forceStructure) {
    if (currentView !== "timer") return;
    refreshHeaderProgress();

    if (state.index >= STEPS.length) {
      if (forceStructure || lastRenderedIndex !== -2) {
        stage.innerHTML =
          '<div class="done-card">' +
            '<div class="active-icon">' + svg("check") + "</div>" +
            '<div class="done-title">Bravo, ' + esc(TITLE) + " terminé !</div>" +
          "</div>";
        upcoming.innerHTML = "";
        upcomingLabel.style.display = "none";
        eyebrow.textContent = "Terminé";
        btnSkip.style.visibility = "hidden";
        if (lastRenderedIndex !== -2) announce("Programme terminé.");
        lastRenderedIndex = -2;
      }
      return;
    }

    btnSkip.style.visibility = "visible";
    upcomingLabel.style.display = "";

    var step = STEPS[state.index];

    if (!TIMED) {
      if (forceStructure || state.index !== lastRenderedIndex) {
        eyebrow.textContent = "Étape " + (state.index + 1) + " sur " + STEPS.length;
        if (state.index !== lastRenderedIndex) announce("Étape " + (state.index + 1) + " sur " + STEPS.length + " : " + step.label);
        stage.innerHTML =
          '<div class="active-card' + (step.isPause ? " is-pause" : "") + '">' +
            '<div class="card-content">' +
              '<div class="active-top">' +
                '<div class="active-icon">' + svg(step.icon) + "</div>" +
                '<div class="active-meta">' +
                  '<span class="active-step-of">En cours</span>' +
                  '<span class="active-label">' + esc(step.label) + "</span>" +
                "</div>" +
              "</div>" +
              tasksBlockHtml(step) +
              '<div class="active-actions">' +
                '<button class="action-btn primary" id="inline-skip">' + svg("next") + " Étape suivante</button>" +
              "</div>" +
            "</div>" +
          "</div>";
        document.getElementById("inline-skip").addEventListener("click", skip);
        wireStepDetailTrigger(stage.querySelector(".active-card"), step);
        renderUpcoming();
        lastRenderedIndex = state.index;
      }
      updatePlayButton();
      return;
    }

    var elapsedMs = elapsedMsFor(state);
    var totalMs = step.seconds * 1000;
    var pct = Math.min(100, (elapsedMs / totalMs) * 100);
    var remaining = step.seconds - elapsedMs / 1000;

    if (forceStructure || state.index !== lastRenderedIndex) {
      eyebrow.textContent = "Étape " + (state.index + 1) + " sur " + STEPS.length;
      if (state.index !== lastRenderedIndex) announce("Étape " + (state.index + 1) + " sur " + STEPS.length + " : " + step.label);
      stage.innerHTML =
        '<div class="active-card' + (step.isPause ? " is-pause" : "") + '">' +
          '<div class="card-fill" id="card-fill" style="width:' + pct.toFixed(1) + '%"></div>' +
          '<div class="card-content">' +
            '<div class="active-top">' +
              '<div class="active-icon">' + svg(step.icon) + "</div>" +
              '<div class="active-meta">' +
                '<span class="active-step-of" id="active-status">' + clockStatusText(stepClock()) + "</span>" +
                '<span class="active-label">' + esc(step.label) + "</span>" +
              "</div>" +
            "</div>" +
            (SHOW_TIME
              ? '<div class="timer-row">' +
                  '<span class="countdown" id="countdown">' + fmt(remaining) + "</span>" +
                  '<span class="countdown-label">restant</span>' +
                "</div>"
              : "") +
            tasksBlockHtml(step) +
            '<button class="back-link" id="actions-toggle">' + svg(loadActionsVisible() ? "up" : "down") + " Réglages</button>" +
            '<div class="active-actions"' + (loadActionsVisible() ? "" : " hidden") + '>' +
              '<button class="action-btn primary" id="inline-play"></button>' +
              '<button class="action-btn" id="inline-skip">' + svg("next") + " Suivant</button>" +
            "</div>" +
            '<div class="jump-row"' + (loadActionsVisible() ? "" : " hidden") + '>' +
              '<span class="unit-label">Avancer à la minute</span>' +
              '<input type="number" id="jump-minute" min="0" max="' + Math.floor(step.seconds / 60) + '" value="0" aria-label="Minute de l’étape à atteindre" />' +
              '<button class="action-btn" id="jump-go">' + svg("next") + " Avancer</button>" +
            "</div>" +
          "</div>" +
        "</div>";
      document.getElementById("inline-play").addEventListener("click", togglePlay);
      document.getElementById("inline-skip").addEventListener("click", skip);
      document.getElementById("actions-toggle").addEventListener("click", function () {
        var v = !loadActionsVisible();
        saveActionsVisible(v);
        var box = stage.querySelector(".active-actions");
        if (box) box.hidden = !v;
        var jumpBox = stage.querySelector(".jump-row");
        if (jumpBox) jumpBox.hidden = !v;
        document.getElementById("actions-toggle").innerHTML = svg(v ? "up" : "down") + " Réglages";
      });
      document.getElementById("jump-go").addEventListener("click", function () {
        var m = parseInt(document.getElementById("jump-minute").value, 10);
        if (!isFinite(m) || m < 0) m = 0;
        jumpToMinute(m);
      });
      wireStepDetailTrigger(stage.querySelector(".active-card"), step);
      renderUpcoming();
      lastRenderedIndex = state.index;
    } else {
      var cardFill = document.getElementById("card-fill");
      var countdown = document.getElementById("countdown");
      if (cardFill) cardFill.style.width = pct.toFixed(1) + "%";
      if (countdown) countdown.textContent = fmt(remaining);
    }

    updatePlayButton();
    var clockNow = stepClock();
    var statusEl = document.getElementById("active-status");
    var statusText = clockStatusText(clockNow);
    if (statusEl && statusEl.textContent !== statusText) statusEl.textContent = statusText;
    var inlinePlay = document.getElementById("inline-play");
    if (inlinePlay) inlinePlay.innerHTML = playIconHtml(clockNow) + " " + playLabelText(clockNow);

    if (remaining <= 0 && state.running) {
      advance();
      playTransitionSound();
      saveTimerState();
      render(true);
    }
  }

  function renderUpcoming() {
    var rest = STEPS.slice(state.index + 1);
    if (rest.length === 0) {
      upcoming.innerHTML = '<div class="chip" style="justify-content:center;color:var(--muted)">C’est la dernière étape</div>';
      return;
    }
    upcoming.innerHTML = rest.map(function (s, i) {
      return '<div class="chip has-step-detail' + (s.isPause ? " pause-chip" : "") + '" data-upcoming-index="' + i + '" role="button" tabindex="0" aria-label="Voir le détail de l’étape ' + esc(s.label) + '">' +
        '<div class="chip-icon">' + svg(s.icon) + "</div>" +
        '<div class="chip-label">' + esc(s.label) + "</div>" +
        (TIMED && SHOW_TIME ? '<div class="chip-duration">' + Math.round(s.seconds / 60) + " min</div>" : "") +
      "</div>";
    }).join("");
    var chips = upcoming.querySelectorAll(".chip[data-upcoming-index]");
    for (var i = 0; i < chips.length; i++) {
      (function (s) {
        chips[i].addEventListener("click", function () { openStepDetail(s); });
        chips[i].addEventListener("keydown", function (e) {
          if (e.key !== "Enter" && e.key !== " " && e.key !== "Spacebar") return;
          e.preventDefault();
          openStepDetail(s);
        });
      })(rest[i]);
    }
  }

  function togglePlay() {
    /* accessible aussi depuis la vue projetée (boutons de l'en-tête et raccourcis clavier
       Espace/Flèche, voir plus bas) : "étape suivante"/"démarrer-pause" agissent sur le même
       state/STEPS, qui pilotent à la fois le titre de contexte et — pour un déroulé minuté —
       le décompte projeté (voir projClock()). Le minuteur de cours (projTimer) ne sert plus
       qu'aux checklists et aux leçons : c'est toggleProjClock() qui choisit la bonne horloge. */
    if ((currentView !== "timer" && currentView !== "projected") || state.index >= STEPS.length || !TIMED) return;
    if (state.running) {
      state.pausedElapsedMs = elapsedMsFor(state);
      state.running = false; state.startTs = null;
    } else {
      state.startTs = Date.now() - state.pausedElapsedMs;
      state.running = true;
    }
    saveTimerState();
    render(false);
    refreshProjectedLive();
  }

  function skip() {
    if ((currentView !== "timer" && currentView !== "projected") || state.index >= STEPS.length) return;
    advance();
    saveTimerState();
    render(true);
    refreshProjectedLive();
  }

  function goBack() {
    if ((currentView !== "timer" && currentView !== "projected") || state.index <= 0) return;
    state.index -= 1;
    state.pausedElapsedMs = 0;
    state.startTs = state.running ? Date.now() : null;
    saveTimerState();
    render(true);
    refreshProjectedLive();
  }

  function restart() {
    if (currentView !== "timer" && currentView !== "projected") return;
    state = { index: 0, running: false, startTs: null, pausedElapsedMs: 0 };
    saveTimerState();
    lastRenderedIndex = -1;
    render(true);
    refreshProjectedLive();
  }

  function jumpToMinute(minutes) {
    if (currentView !== "timer" || state.index >= STEPS.length || !TIMED) return;
    var step = STEPS[state.index];
    var maxMs = step.seconds * 1000;
    var targetMs = Math.max(0, Math.min(maxMs, minutes * 60 * 1000));
    state.pausedElapsedMs = targetMs;
    state.startTs = state.running ? Date.now() - targetMs : null;
    saveTimerState();
    render(true);
  }

  btnPlay.addEventListener("click", function () {
    if (currentView === "projected") toggleProjClock(); else togglePlay();
  });
  btnSkip.addEventListener("click", skip);
  /* « Recommencer » efface la progression : on demande confirmation (focus sur « Annuler ») */
  btnRestart.addEventListener("click", function () {
    askConfirm("Recommencer le programme depuis la première étape\u202F?", "Recommencer", restart);
  });

  /* menu « Plus » : s'ouvre au clic, se ferme au clic ailleurs, à Échap (le focus revient sur « Plus ») ou après un choix ;
     flèches haut/bas pour passer d'un élément à l'autre. Aligné à droite s'il dépasserait de l'écran (petits écrans). */
  var btnMore = document.getElementById("btn-more");
  var moreMenu = document.getElementById("more-menu");
  var moreWrap = document.getElementById("more-wrap");
  function setMoreMenu(open, returnFocus) {
    moreMenu.hidden = !open;
    btnMore.setAttribute("aria-expanded", open ? "true" : "false");
    if (open) {
      moreMenu.classList.remove("align-end");
      var r = btnMore.getBoundingClientRect();
      if (r.left + moreMenu.offsetWidth > window.innerWidth - 8) moreMenu.classList.add("align-end");
      var firstItem = moreMenu.querySelector(".more-item:not([hidden])");
      if (firstItem) firstItem.focus();
    } else if (returnFocus) {
      btnMore.focus();
    }
  }
  btnMore.addEventListener("click", function () { setMoreMenu(moreMenu.hidden, false); });
  moreMenu.addEventListener("click", function (e) {
    if (e.target.closest && e.target.closest(".more-item")) setMoreMenu(false, false);
  });
  document.addEventListener("click", function (e) {
    if (!moreMenu.hidden && !moreWrap.contains(e.target)) setMoreMenu(false, false);
  });
  moreWrap.addEventListener("keydown", function (e) {
    if (moreMenu.hidden) return;
    if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); setMoreMenu(false, true); return; }
    if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
    var items = Array.prototype.slice.call(moreMenu.querySelectorAll(".more-item:not([hidden])"));
    if (!items.length) return;
    e.preventDefault();
    var i = items.indexOf(document.activeElement);
    i = e.key === "ArrowDown" ? (i + 1) % items.length : (i <= 0 ? items.length - 1 : i - 1);
    items[i].focus();
  });

  /* Raccourcis clavier globaux : Espace (démarrer/pause), Flèche droite (étape
     suivante), Flèche gauche (étape précédente) et F (bascule vue projetée),
     pour piloter le déroulé sans toucher l'écran quand il est projeté ou
     loin de l'enseignant·e (cf. togglePlay()/skip()/goBack()/toggleProjectedView()
     ci-dessus, qui acceptent maintenant la vue "projected" en plus de "timer").
     On n'agit jamais si le focus est dans un champ de saisie quelconque (input,
     textarea, select, contenteditable — dont le titre en haut de page) : sans
     cette garde, Espace saisi dans un champ texte déclencherait play/pause au
     lieu d'insérer une espace. */
  function isTypingContext() {
    var el = document.activeElement;
    if (!el) return false;
    var tag = (el.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea" || tag === "select") return true;
    if (el.isContentEditable) return true;
    return false;
  }
  function isActivatableFocus() {
    var el = document.activeElement;
    if (!el) return false;
    var tag = (el.tagName || "").toLowerCase();
    if (tag === "button" || tag === "a" || tag === "summary") return true;
    if (tag === "input") return true;
    return el.getAttribute("role") === "button";
  }
  document.addEventListener("keydown", function (e) {
    var key = e.key;
    if (key !== " " && key !== "Spacebar" && key !== "ArrowRight" && key !== "ArrowLeft" && key !== "f" && key !== "F") return;
    if (isTypingContext()) return;
    if (currentView !== "timer" && currentView !== "projected") return;
    if (document.querySelector('[role="dialog"]')) return; /* aide, détail d'étape, confirmation : leurs touches d'abord */
    if ((key === " " || key === "Spacebar") && isActivatableFocus()) return; /* Espace active le bouton, le lien ou la case qui a le focus */
    if (key === "f" || key === "F") {
      e.preventDefault();
      toggleProjectedView();
      return;
    }
    if (key === "ArrowRight") {
      e.preventDefault();
      skip();
    } else if (key === "ArrowLeft") {
      e.preventDefault();
      goBack();
    } else {
      e.preventDefault();
      if (currentView === "projected") toggleProjClock(); else togglePlay();
    }
  });
  btnHome.addEventListener("click", goHome);
  btnTheme.addEventListener("click", cycleThemeMode);
  applyThemeMode(loadThemeMode());
  function applyTransitionSoundIcon() {
    var on = loadTransitionSoundEnabled();
    btnSound.innerHTML = svg(on ? "bell" : "bellOff") + "<span>Son de transition : " + (on ? "activé" : "coupé") + "</span>";
    btnSound.title = "Activer ou couper le son de transition";
  }
  btnSound.addEventListener("click", function () {
    saveTransitionSoundEnabled(!loadTransitionSoundEnabled());
    applyTransitionSoundIcon();
  });
  applyTransitionSoundIcon();
  updatePlayButton();

  function toggleProjectedView() {
    if (!currentProfileId || PROFILE_KIND === "lecon") return;
    if (toolsOpen) closeToolsPanel();
    if (currentView === "projected") {
      currentView = "timer";
      showOnly("timer");
      lastRenderedIndex = -1;
      render(true);
    } else {
      currentView = "projected";
      PRESENTING = true; /* « Projeter » ouvre toujours l'affichage pour la classe, jamais la modification des devoirs */
      if (!projFollowsSteps()) {
        /* checklist : pas d'étape minutée, la vue projetée lance le minuteur de cours. Un déroulé minuté,
           lui, affiche directement l'horloge de l'étape en cours (voir projClock()) : rien à recopier. */
        projTimer.running = true;
        projTimer.startTs = Date.now();
        projTimer.pausedElapsedMs = 0;
        projTimer.seconds = (COURSE_MINUTES > 0 ? COURSE_MINUTES : 45) * 60;
      }
      showOnly("projected");
      renderProjected();
    }
  }
  btnProjected.addEventListener("click", function () {
    toggleProjectedView();
    /* « Projeter » vient de disparaître de la barre : le focus va sur la commande principale de la présentation */
    if (currentView === "projected") (btnPlay.hidden ? btnQuitPresent : btnPlay).focus();
  });

  /* La seule sortie de la vue projetée : retour direct au Programme (ou à l'accueil pour une leçon, qui n'a
     pas de vue Programme). Remplace l'ancien duo « Retour » + « Quitter la présentation », dont le second
     menait à une vue intermédiaire avec les champs de saisie. */
  function quitPresentation() {
    if (currentView !== "projected") return;
    if (PROFILE_KIND === "lecon") { goHome(); return; }
    toggleProjectedView();
    btnProjected.focus();
  }
  btnQuitPresent.addEventListener("click", quitPresentation);
  btnProjEdit.addEventListener("click", function () { if (currentView === "projected") setPresenting(false); });

  /* Sur téléphone (≤ 520 px), « Plus » rejoint Démarrer et Suivant sur la première rangée (barre en 2 rangées au
     lieu de 3). On déplace le groupe dans le DOM plutôt qu'avec la propriété CSS « order » : l'ordre de tabulation
     reste ainsi celui qu'on voit à l'écran. En vue projetée, le groupe « Vues » ne contient plus qu'« Outils » :
     « Plus » y reste en dernier, à la même place que sur grand écran. */
  var controlsEl = moreWrap.parentNode;
  var viewsGroupEl = btnProjected.parentNode;
  var narrowMq = window.matchMedia ? window.matchMedia("(max-width: 520px)") : null;
  function placeMoreMenu() {
    var first = !!(narrowMq && narrowMq.matches) && currentView !== "projected";
    if (first) { if (moreWrap.nextSibling !== viewsGroupEl) controlsEl.insertBefore(moreWrap, viewsGroupEl); }
    else if (controlsEl.lastChild !== moreWrap) controlsEl.appendChild(moreWrap);
  }
  if (narrowMq) {
    if (narrowMq.addEventListener) narrowMq.addEventListener("change", placeMoreMenu);
    else if (narrowMq.addListener) narrowMq.addListener(placeMoreMenu);
  }

  function showOnly(which) {
    stage.hidden = which !== "timer";
    upcomingBlock.hidden = which !== "timer";
    footerNote.hidden = which !== "timer";
    editorWrap.hidden = which !== "editor";
    homeWrap.hidden = which !== "home";
    projectedWrap.hidden = which !== "projected";
    document.getElementById("main-row").hidden = which !== "timer";
    var onHome = which === "home";
    var onProjected = which === "projected";
    /* la classe "presenting" habille l'en-tête pour toute la vue projetée (titre masqué, commandes à droite,
       « Quitter la présentation » à gauche), y compris pendant la modification des devoirs et infos */
    document.body.classList.toggle("presenting", onProjected);
    var hasSteps = PROFILE_KIND !== "lecon";
    /* Pause/Reprendre, Suivant et Recommencer restent disponibles en vue projetée : on pilote la séance
       sans quitter ce que la classe regarde. Une leçon n'a pas d'étapes : ni Suivant ni Recommencer. */
    btnSkip.hidden = onHome || (onProjected && !hasSteps);
    btnSkip.classList.toggle("labeled", onProjected); /* « Suivant » écrit en toutes lettres devant la classe */
    btnRestart.hidden = onHome || (onProjected && !hasSteps);
    btnEdit.hidden = onHome || (onProjected && PROFILE_KIND !== "lecon");
    btnTools.hidden = onHome;
    btnHome.hidden = onHome;
    btnProjected.hidden = onHome || onProjected || PROFILE_KIND === "lecon";
    btnQuitPresent.hidden = !onProjected;
    btnProjEdit.hidden = !onProjected;
    placeMoreMenu();
    updatePlayButton();
    if (onProjected) btnSkip.style.visibility = state.index >= STEPS.length ? "hidden" : "visible";
    appTitleEl.contentEditable = onHome ? "false" : "true";
    if (onHome) {
      eyebrow.textContent = "";
      appTitleEl.textContent = "Mes programmes";
    }
    refreshHeaderProgress();
  }

  /* ---------- editor ---------- */
  function openEditor() {
    if (toolsOpen) closeToolsPanel();
    stopSonometre();
    stopQuickMinuteur();
    currentView = "editor";
    draftSteps = STEPS.map(function (s) {
      return {
        label: s.label, seconds: s.seconds, icon: s.icon, isPause: !!s.isPause,
        tasks: (s.tasks || []).map(function (t) { return { name: t.name || "", text: t.text || "", mandatory: t.mandatory !== false, homework: !!t.homework, dueDate: t.dueDate || "", groupId: t.groupId || "", studentIds: Array.isArray(t.studentIds) ? t.studentIds.slice() : [] }; }),
        taskGroups: (s.taskGroups || []).map(function (g) { return { id: g.id, label: g.label || "", choose: g.choose > 0 ? g.choose : 1 }; })
      };
    });
    draftTheme = Object.assign({}, THEME);
    draftStudents = STUDENTS.map(function (s) {
      return { id: s.id, name: s.name || "", excluded: !!s.excluded, noGroup: !!s.noGroup, tag: s.tag || "", groupId: s.groupId || "" };
    });
    draftStudentGroups = STUDENT_GROUPS.map(function (g) { return { id: g.id, label: g.label || "" }; });
    draftShowTime = SHOW_TIME;
    draftTimed = TIMED;
    draftProjectedTools = (Array.isArray(PROJECTED_TOOLS) ? PROJECTED_TOOLS : allToolIds()).slice();
    draftPlanShowDetails = getPlanShowDetails();
    draftPlanShowGroups = getPlanShowGroups();
    draftCustomBlocks = normalizeCustomBlocks(CUSTOM_BLOCKS);
    draftProjectedBlocksVisible = {
      tasks: getProjectedBlockVisible("tasks"),
      homework: getProjectedBlockVisible("homework"),
      info: getProjectedBlockVisible("info")
    };
    draftProjectedBlocksVisible[COURSE_TIMER_BLOCK_KEY] = getProjectedBlockVisible(COURSE_TIMER_BLOCK_KEY);
    draftCustomBlocks.forEach(function (b) { draftProjectedBlocksVisible["custom:" + b.id] = getProjectedBlockVisible("custom:" + b.id); });
    draftHomeworkExtra = (COURSE_HOMEWORK_EXTRA || []).map(normalizeHomeworkExtraItem);
    draftCourseInfo = COURSE_INFO || "";
    draftHomeworkInfoOpen = false;
    expandedTasks = {};
    showOnly("editor");
    renderEditor();
  }

  function closeEditor() {
    currentView = "timer";
    draftSteps = null;
    draftTheme = null;
    draftStudents = null;
    draftStudentGroups = null;
    draftProjectedTools = null;
    draftProjectedBlocksVisible = null;
    draftCustomBlocks = null;
    draftHomeworkExtra = null;
    draftCourseInfo = null;
    showOnly("timer");
    lastRenderedIndex = -1;
    render(true);
  }

  /* =====================================================================
     BLOCS PERSONNALISÉS (édition) — panneau partagé entre renderEditor() et
     renderLeconEditor(), au même titre que draftStudents/draftProjectedTools :
     un seul draftCustomBlocks, une seule fonction de rendu/câblage pour les deux.
     ===================================================================== */
  function customBlockToolEditorRowHtml(bi, tool, ti, students) {
    var typeLabel = tool.type === "timer" ? "Minuteur" : "Liste de tâches filtrée par élève";

  function wireCustomBlocksEditor(container, rerender) {
    Array.prototype.forEach.call(container.querySelectorAll(".custom-block-editor-row"), function (rowEl) {
      var bi = Number(rowEl.getAttribute("data-bi"));
      rowEl.querySelector(".custom-block-name").addEventListener("input", function (e) { draftCustomBlocks[bi].name = e.target.value; });
      var upBtn = rowEl.querySelector(".custom-block-up");

        if (bi <= 0) return;
        var tmp = draftCustomBlocks[bi - 1];
        draftCustomBlocks[bi - 1] = draftCustomBlocks[bi];
        draftCustomBlocks[bi] = tmp;
        rerender();
      });
      var downBtn = rowEl.querySelector(".custom-block-down");
      if (downBtn) downBtn.addEventListener("click", function () {
        if (bi >= draftCustomBlocks.length - 1) return;
        var tmp2 = draftCustomBlocks[bi + 1];
        draftCustomBlocks[bi + 1] = draftCustomBlocks[bi];
        draftCustomBlocks[bi] = tmp2;
        rerender();
      });
      rowEl.querySelector(".custom-block-delete").addEventListener("click", function () {
        (draftCustomBlocks[bi].tools || []).forEach(function (t) { if (t.type === "timer") removeCustomTimerState(t.id); });
        draftCustomBlocks.splice(bi, 1);
        rerender();
      });
      Array.prototype.forEach.call(rowEl.querySelectorAll(".custom-block-tool-row"), function (toolEl) {
        var ti = Number(toolEl.getAttribute("data-ti"));
        var tool = draftCustomBlocks[bi].tools[ti];
        if (tool.type === "studentTasks") {
          var sel = toolEl.querySelector(".task-students");
          if (sel) sel.addEventListener("change", function (e) {
            tool.studentIds = Array.prototype.map.call(e.target.selectedOptions, function (o) { return o.value; });
          });
        } else if (tool.type === "timer") {
          var minInput = toolEl.querySelector(".ct-default-minutes");
          if (minInput) minInput.addEventListener("input", function (e) {
            var v = parseInt(e.target.value, 10);
            tool.seconds = (isFinite(v) && v > 0 ? v : 5) * 60;
          });
        }
        toolEl.querySelector(".custom-tool-delete").addEventListener("click", function () {
          if (tool.type === "timer") removeCustomTimerState(tool.id);
          draftCustomBlocks[bi].tools.splice(ti, 1);
          rerender();
        });
      });
      var addToolBtn = rowEl.querySelector(".custom-tool-add");
      if (addToolBtn) addToolBtn.addEventListener("click", function () {
        var typeSel = rowEl.querySelector(".custom-tool-type-add");
        var type = typeSel ? typeSel.value : "studentTasks";
        draftCustomBlocks[bi].tools.push(type === "timer" ? { id: makeCustomToolId(), type: "timer", seconds: 300 } : { id: makeCustomToolId(), type: "studentTasks", studentIds: [] });
        rerender();
      });
    });
    var addBlockBtn = container.querySelector("#custom-block-add");
    if (addBlockBtn) addBlockBtn.addEventListener("click", function () {
      draftCustomBlocks.push({ id: makeCustomBlockId(), name: "", tools: [] });
      rerender();
      var inputs = container.querySelectorAll(".custom-block-name");

  function cleanCustomBlocksForSave(blocks) {

        id: b.id || makeCustomBlockId(),
        name: (b.name || "").trim(),
        tools: (b.tools || []).map(function (t) {

            ? { id: t.id || makeCustomToolId(), type: "timer", seconds: t.seconds > 0 ? t.seconds : 300 }
            : { id: t.id || makeCustomToolId(), type: "studentTasks", studentIds: Array.isArray(t.studentIds) ? t.studentIds.slice() : [] };

        });
        var dueDateInput = taskEl.querySelector(".task-duedate");
        if (dueDateInput) dueDateInput.addEventListener("change", function (e) { draftSteps[i].tasks[ti].dueDate = e.target.value; });
        var groupSelectInput = taskEl.querySelector(".task-group");
        if (groupSelectInput) groupSelectInput.addEventListener("change", function (e) {
          draftSteps[i].tasks[ti].groupId = e.target.value || "";
          renderEditor(); /* met à jour tout de suite le compte "sur X" du groupe */
        });
        var studentsSelect = taskEl.querySelector(".task-students");
        if (studentsSelect) studentsSelect.addEventListener("change", function (e) {
          draftSteps[i].tasks[ti].studentIds = Array.prototype.map.call(e.target.selectedOptions, function (o) { return o.value; });
        });
        taskEl.querySelector(".task-delete").addEventListener("click", function () {
          draftSteps[i].tasks.splice(ti, 1); renderEditor();
        });
      });

      var groupsWrap = rowEl.querySelector('[data-groups-for="' + i + '"]');
      if (groupsWrap) {
        Array.prototype.forEach.call(groupsWrap.querySelectorAll(".group-row"), function (groupEl) {
          var gi = Number(groupEl.getAttribute("data-gi"));
          groupEl.querySelector(".group-label").addEventListener("input", function (e) { draftSteps[i].taskGroups[gi].label = e.target.value; });
          groupEl.querySelector(".group-choose").addEventListener("input", function (e) {
            var v = parseInt(e.target.value, 10);
            draftSteps[i].taskGroups[gi].choose = isFinite(v) && v > 0 ? v : 1;
          });
          groupEl.querySelector(".group-delete").addEventListener("click", function () {
            var removedId = draftSteps[i].taskGroups[gi].id;
            draftSteps[i].taskGroups.splice(gi, 1);
            draftSteps[i].tasks.forEach(function (t) { if (t.groupId === removedId) t.groupId = ""; });
            renderEditor();
          });
        });
        var addGroupBtn = groupsWrap.querySelector("[data-add-group]");
        if (addGroupBtn) addGroupBtn.addEventListener("click", function () {
          draftSteps[i].taskGroups.push({ id: makeGroupId(), label: "", choose: 1 });

    document.getElementById("row-add").addEventListener("click", function () {

      rowEl.querySelector(".student-excluded").addEventListener("change", function (e) { draftStudents[si].excluded = e.target.checked; });
      rowEl.querySelector(".student-nogroup").addEventListener("change", function (e) { draftStudents[si].noGroup = e.target.checked; });
      rowEl.querySelector(".student-tag").addEventListener("input", function (e) { draftStudents[si].tag = e.target.value; });

    document.getElementById("student-add").addEventListener("click", function () {
      draftStudents.push({ id: makeStudentId(), name: "", excluded: false, noGroup: false, tag: "", groupId: "" });

    document.getElementById("student-import-go").addEventListener("click", function () {

        groupEl.querySelector(".group-label").addEventListener("input", function (e) { draftStudentGroups[sgi].label = e.target.value; });
        groupEl.querySelector(".group-delete").addEventListener("click", function () {

          draftStudentGroups.splice(sgi, 1);
          draftStudents.forEach(function (s) { if (s.groupId === removedId) s.groupId = ""; });

      var addStudentGroupBtn = studentGroupsWrap.querySelector("#student-group-add");

    wireToolsCheckboxes(editorWrap, "proj", { arr: draftProjectedTools });
    wireCustomBlocksEditor(editorWrap, renderEditor);

    document.getElementById("plan-details").addEventListener("change", function (e) { draftPlanShowDetails = e.target.checked; });
    document.getElementById("plan-groups").addEventListener("change", function (e) { draftPlanShowGroups = e.target.checked; });

    document.getElementById("edit-cancel").addEventListener("click", closeEditor);
    document.getElementById("edit-save").addEventListener("click", function () {

          isPause: !!s.isPause,
          tasks: (s.tasks || [])
            .map(function (t) {
              var homework = !!t.homework;
              return { name: (t.name || "").trim(), text: (t.text || "").trim(), mandatory: t.mandatory !== false, homework: homework, dueDate: homework ? (t.dueDate || "").trim() : "", groupId: t.groupId || "", studentIds: Array.isArray(t.studentIds) ? t.studentIds.slice() : [] };
            })
            .filter(function (t) { return t.name || t.text; }),
          taskGroups: (s.taskGroups || []).map(function (g) { return { id: g.id, label: (g.label || "").trim(), choose: g.choose > 0 ? g.choose : 1 }; })
        };

        pause: draftTheme.pause || null,
        font: draftTheme.font || null
      };
      var cleanedStudentGroups = (draftStudentGroups || []).map(function (g) { return { id: g.id || makeStudentGroupId(), label: (g.label || "").trim() }; });
      var cleanedStudents = draftStudents
        .map(function (s) { return { id: s.id || makeStudentId(), name: (s.name || "").trim(), excluded: !!s.excluded, noGroup: !!s.noGroup, tag: (s.tag || "").trim(), groupId: s.groupId || "" }; })
        .filter(function (s) { return s.name; });
      saveBtn.disabled = true;
      setPlanShowDetails(draftPlanShowDetails);
      setPlanShowGroups(draftPlanShowGroups);
      PROJECTED_BLOCK_KEYS.forEach(function (b) { setProjectedBlockVisible(b.key, draftProjectedBlocksVisible[b.key]); });
      setProjectedBlockVisible(COURSE_TIMER_BLOCK_KEY, draftProjectedBlocksVisible[COURSE_TIMER_BLOCK_KEY]);
      commitCustomBlocks(cleanedCustomBlocks);
      COURSE_HOMEWORK_EXTRA = (draftHomeworkExtra || []).map(normalizeHomeworkExtraItem);
      COURSE_INFO = draftCourseInfo || "";
      saveData(cleanedSteps, cleanedTheme, cleanedStudents, cleanedStudentGroups, draftShowTime, draftTimed, draftProjectedTools, function (ok) {
        saveBtn.disabled = false;
        if (ok) closeEditor();
