  /* ---- Minuteur rapide ---- */
  var quick = { seconds: 300, startTs: null, pausedElapsedMs: 0, running: false, raf: null, settingsVisible: true };
  function renderMinuteur() {
    stopSonometre();
    stopQuickMinuteur();
    quick.running = false; quick.startTs = null; quick.pausedElapsedMs = 0;
    quick.settingsVisible = true;
    if (quick.raf) { clearInterval(quick.raf); quick.raf = null; }
    paintMinuteur(true);
    wireToolBack(function () { if (quick.raf) { clearInterval(quick.raf); quick.raf = null; } });
  }
  /* grandit les chiffres du décompte pour remplir .active-card (quasi toute la case quand
     les préréglages sont masqués, plus petits quand ils sont affichés au-dessus) */
  function fitQuickCountdown(cardEl) {
    if (!cardEl) return;
    var cd = cardEl.querySelector("#quick-countdown");
    if (!cd) return;
    var h = cardEl.clientHeight, w = cardEl.clientWidth;
    if (!h || !w) return;
    var actions = cardEl.querySelector(".active-actions");
    var actionsH = actions ? actions.offsetHeight : 0;
    var padV = 48, gap = 12;
    var availH = Math.max(30, h - actionsH - padV - gap);
    var size = Math.max(22, Math.min(availH * 0.85, w * 0.28, 220));
    cd.style.fontSize = size + "px";
  }
  function paintMinuteur(full) {
    var presets = [1, 3, 5, 10];
    if (full) {
      toolsWrap.innerHTML =
        '<div class="editor">' + toolTopbar("Minuteur rapide", quick.settingsVisible) +
          (quick.settingsVisible
            ? '<div class="quick-presets">' +
                presets.map(function (p) {
                  return '<button class="preset-btn' + (quick.seconds === p * 60 ? " is-active" : "") + '" data-preset="' + p + '">' + p + " min</button>";
                }).join("") +
                '<input type="number" min="1" max="120" id="quick-custom" class="text-input" style="width:90px" value="' + Math.round(quick.seconds / 60) + '" aria-label="Minutes personnalisées" />' +
              "</div>"
            : "") +
          '<div class="active-card" style="padding:24px;">' +
            '<div class="card-fill" id="quick-fill" style="width:0%"></div>' +
            '<div class="card-content" style="align-items:center;">' +
              '<div class="timer-row"><span class="countdown" id="quick-countdown">' + fmt(quick.seconds) + "</span></div>" +
              '<div class="active-actions">' +
                '<button class="action-btn primary" id="quick-play">' + fillIcon('<path d="M8 5v14l11-7L8 5Z"/>') + " Démarrer</button>" +
                '<button class="action-btn" id="quick-reset">' + svg("restart") + " Réinitialiser</button>" +
              "</div>" +
            "</div>" +
          "</div>" +
        "</div>";
      setFitObserver(toolsWrap.querySelector(".active-card"), function () { fitQuickCountdown(toolsWrap.querySelector(".active-card")); });
      document.getElementById("tool-settings-toggle").addEventListener("click", function () {
        quick.settingsVisible = !quick.settingsVisible;
        paintMinuteur(true);
      });
      Array.prototype.forEach.call(toolsWrap.querySelectorAll("[data-preset]"), function (btn) {
        btn.addEventListener("click", function () {
          quick.seconds = Number(btn.getAttribute("data-preset")) * 60;
          quick.running = false; quick.startTs = null; quick.pausedElapsedMs = 0;
          if (quick.raf) { clearInterval(quick.raf); quick.raf = null; }
          paintMinuteur(true);
        });
      });
      var customEl = document.getElementById("quick-custom");
      if (customEl) customEl.addEventListener("change", function (e) {
        var v = parseInt(e.target.value, 10);
        quick.seconds = (isFinite(v) && v > 0 ? v : 5) * 60;
        quick.running = false; quick.startTs = null; quick.pausedElapsedMs = 0;
        if (quick.raf) { clearInterval(quick.raf); quick.raf = null; }
        paintMinuteur(true);
      });
      document.getElementById("quick-play").addEventListener("click", function () {
        if (quick.running) {
          quick.pausedElapsedMs = Date.now() - quick.startTs;
          quick.running = false;
        } else {
          quick.startTs = Date.now() - quick.pausedElapsedMs;
          quick.running = true;
          if (!quick.raf) quick.raf = setInterval(function () { paintMinuteur(false); }, 250);
        }
        paintMinuteur(false);
      });
      document.getElementById("quick-reset").addEventListener("click", function () {
        quick.running = false; quick.startTs = null; quick.pausedElapsedMs = 0;
        if (quick.raf) { clearInterval(quick.raf); quick.raf = null; }
        paintMinuteur(true);
      });
    }
    var elapsedMs = quick.running ? Date.now() - quick.startTs : quick.pausedElapsedMs;
    var remaining = quick.seconds - elapsedMs / 1000;
    var pct = Math.min(100, (elapsedMs / (quick.seconds * 1000)) * 100);
    var fillEl = document.getElementById("quick-fill");
    var cdEl = document.getElementById("quick-countdown");
    if (fillEl) fillEl.style.width = pct.toFixed(1) + "%";
    if (cdEl) cdEl.textContent = fmt(Math.max(0, remaining));
    var playBtn = document.getElementById("quick-play");
    if (playBtn) {
      playBtn.innerHTML = quick.running
        ? fillIcon('<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>') + " Pause"
        : fillIcon('<path d="M8 5v14l11-7L8 5Z"/>') + " Démarrer";
    }
    if (remaining <= 0 && quick.running) {
      quick.running = false;
      if (quick.raf) { clearInterval(quick.raf); quick.raf = null; }
    }
  }

  /* ---- Tirage au sort / groupes aléatoires ---- */
  /* ouvre l'éditeur du programme directement sur la liste des élèves (depuis l'état vide du tirage au sort) */
  function openStudentsEditor() {
    if (PROFILE_KIND === "lecon") openLeconEditor(); else openEditor();
    var addBtn = document.getElementById("student-add");
    if (!addBtn) return;
    if (addBtn.scrollIntoView) addBtn.scrollIntoView({ block: "center" });
    addBtn.focus();
  }
  function eligibleForDraw() {
    return STUDENTS.filter(function (s) { return s.name && !s.excluded; });
  }
  function eligibleForGroups() {
    return STUDENTS.filter(function (s) { return s.name && !s.noGroup; });
  }

  /* ---- Tirage au sort / "Groupes fixes" ----
     Pure affichage de STUDENT_GROUPS/STUDENTS.groupId, sans aucun tirage : contrairement à
     "Groupes aléatoires" (formGroups/eligibleForGroups, tag-based, ci-dessus), rien n'est
     mélangé ici — on montre juste, pour chaque groupe nommé créé dans l'éditeur (onglet
     Élèves), les élèves qui lui sont actuellement assignés, plus une carte "Sans groupe"
     pour les élèves restants (s'il y en a). Recalculé à chaque rendu, jamais mis en cache. */
  function fixedGroupsHtml() {
    if (!STUDENT_GROUPS || !STUDENT_GROUPS.length) {
      return '<p class="editor-hint">Aucun groupe fixe pour l’instant. Créez des groupes dans l’éditeur du programme, onglet Élèves.</p>';
    }
    var namedStudents = STUDENTS.filter(function (s) { return s.name; });
    var unnamedCounter = 0;
    var cardsHtml = STUDENT_GROUPS.map(function (g) {
      if (!g.label) unnamedCounter++;
      var label = g.label ? esc(g.label) : "Groupe sans nom (" + unnamedCounter + ")";
      var members = namedStudents.filter(function (s) { return (s.groupId || "") === g.id; });
      return '<div class="group-card"><h4>' + label + "</h4><ul>" +
        (members.length
          ? members.map(function (s) { return "<li>" + esc(s.name) + "</li>"; }).join("")
          : '<li style="color:var(--muted);font-weight:400;">Aucun élève</li>') +
        "</ul></div>";
    }).join("");
    var groupIds = STUDENT_GROUPS.map(function (g) { return g.id; });
    var unassigned = namedStudents.filter(function (s) { return groupIds.indexOf(s.groupId || "") === -1; });
    var unassignedHtml = unassigned.length
      ? '<div class="group-card"><h4>Sans groupe</h4><ul>' + unassigned.map(function (s) { return "<li>" + esc(s.name) + "</li>"; }).join("") + "</ul></div>"
      : "";
    return '<div class="group-grid">' + cardsHtml + unassignedHtml + "</div>";
  }

  function loadTirage() {
    try {
      var raw = localStorage.getItem(TIRAGE_KEY);
      if (raw) {
        var t = JSON.parse(raw);
        if (!t.counts) t.counts = {};
        return t;
      }
    } catch (e) {}
    return { remaining: [], mode: "individuel", settingsVisible: true, counts: {} };
  }
  function saveTirage(t) { try { localStorage.setItem(TIRAGE_KEY, JSON.stringify(t)); } catch (e) {} }

  function shuffled(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function formGroups(students, numGroups) {
    numGroups = Math.max(1, Math.min(numGroups, students.length || 1));
    var groups = [];
    for (var i = 0; i < numGroups; i++) groups.push([]);
    var byTag = {}, untagged = [];
    students.forEach(function (s) {
      var tag = (s.tag || "").trim();
      if (tag) { (byTag[tag] = byTag[tag] || []).push(s); } else { untagged.push(s); }
    });
    Object.keys(byTag).forEach(function (tag) {
      var members = shuffled(byTag[tag]);
      var order = shuffled(groups.map(function (_, i) { return i; }));
      members.forEach(function (s, idx) { groups[order[idx % order.length]].push(s); });
    });
    shuffled(untagged).forEach(function (s) {
      var gi = 0;
      for (var i = 1; i < groups.length; i++) if (groups[i].length < groups[gi].length) gi = i;
      groups[gi].push(s);
    });
    return groups;
  }

  /* ---- Tirage au sort / "Groupes fixes" : répartition aléatoire ----
     Contrairement à fixedGroupsHtml() (pur affichage) et à "Groupes aléatoires" (formGroups
     forme des groupes ad hoc, non nommés, jamais écrits sur STUDENTS), cette fonction ÉCRIT
     réellement STUDENTS[i].groupId sur les groupes nommés déjà créés dans l'éditeur (onglet
     Élèves), puis persiste — exactement comme si Pauline avait choisi chaque groupe à la
     main via le <select class="student-group">. Le nombre de groupes est fixé par le nombre
     de groupes nommés existants (pas de saisie "combien de groupes ?" ici, à la différence de
     "Groupes aléatoires") ; on réutilise formGroups()/eligibleForGroups() pour la répartition
     et la séparation par étiquette plutôt que de dupliquer cette logique. */
  function assignFixedGroupsRandomly() {
    if (!STUDENT_GROUPS || STUDENT_GROUPS.length < 2) return;
    var pool = eligibleForGroups();
    if (!pool.length) return;
    var groupIds = STUDENT_GROUPS.map(function (g) { return g.id; });
    var hasExisting = pool.some(function (s) { return groupIds.indexOf(s.groupId || "") !== -1; });
    function assign() {
      var groups = formGroups(pool, STUDENT_GROUPS.length);
      groups.forEach(function (members, gi) {
        var gid = STUDENT_GROUPS[gi].id;
        members.forEach(function (s) {
          var student = STUDENTS.filter(function (st) { return st.id === s.id; })[0];
          if (student) student.groupId = gid;
        });
      });
      persist();
    }
    if (hasExisting) askConfirm("Répartir à nouveau les groupes fixes va remplacer l’attribution actuelle. Continuer\u202F?", "Répartir à nouveau", assign);
    else assign();
  }

  /* grandit le texte du nom tiré pour remplir .tirage-display (qui grandit lui-même vers
     l'espace libéré quand #tirage-settings est masqué) */
  function fitTirageDisplay(box) {
    if (!box) return;
    if (box.classList.contains("is-message")) { box.style.fontSize = ""; return; } /* une phrase, pas un nom : taille de texte normale (CSS) */
    var h = box.clientHeight, w = box.clientWidth;
    if (!h || !w) return;
    var size = Math.max(16, Math.min(h * 0.5, w * 0.14, 72));
    box.style.fontSize = size + "px";
  }

  function tirageHistoryHtml(names, counts) {
    var rows = names.slice().sort(function (a, b) { return (counts[a] || 0) - (counts[b] || 0) || a.localeCompare(b); });
    return '<div class="tirage-history">' +
      '<div class="tasks-block-label">Historique des tirages (toutes séances)</div>' +
      rows.map(function (n) {
        var c = counts[n] || 0;
        return '<div class="tirage-history-row"><span>' + esc(n) + '</span><span class="tirage-history-count">' + c + " fois</span></div>";
      }).join("") +
    "</div>";
  }

  function renderTirage() {
    stopSonometre();
    stopQuickMinuteur();
    var drawPool = eligibleForDraw();
    var names = drawPool.map(function (s) { return s.name; });
    var groupPool = eligibleForGroups();
    var t = loadTirage();
    var poolSignature = names.slice().sort().join("|");
    /* re-fill the draw pool whenever the eligible group itself changed (a student added,
       removed, renamed, or un/excluded) — but NOT just because it's empty, since an empty
       "remaining" also legitimately means "everyone has been drawn this round" */
    if (!t.remaining || t.poolSignature !== poolSignature) {
      t.remaining = names.slice();
      t.poolSignature = poolSignature;
      saveTirage(t);
    }
    var mode = (t.mode === "groupes" || t.mode === "fixes") ? t.mode : "individuel";
    /* Deux situations à ne pas confondre : aucun élève à tirer (liste vide, ou tous exclus) — on dit quoi
       faire et on y mène ; ou tous les élèves déjà tirés — on propose de recommencer. Avant, les deux
       affichaient « Liste épuisée », y compris pour une liste où il n'y avait jamais eu personne. */
    var hasNamedStudents = STUDENTS.some(function (s) { return !!s.name; });
    function tirageEmptyHtml(excludedMsg) {
      return '<div class="tirage-empty">' +
        '<p class="tirage-empty-title">' + (hasNamedStudents ? excludedMsg : "Aucun élève dans la liste.") + "</p>" +
        '<p class="editor-hint">' + (hasNamedStudents
          ? "Modifiez la liste des élèves pour en rendre au moins un disponible."
          : "Ajoutez des élèves au programme pour commencer.") + "</p>" +
        '<button class="action-btn primary tirage-open-students" type="button">' + svg(hasNamedStudents ? "pencil" : "plus") + (hasNamedStudents ? " Modifier la liste des élèves" : " Ajouter des élèves") + "</button>" +
      "</div>";
    }
    var allDrawn = names.length > 0 && !t.remaining.length;

    toolsWrap.innerHTML =
      '<div class="editor">' + toolTopbar("Tirage au sort", !!t.settingsVisible) +
        '<div class="editor-hint" id="tirage-settings"' + (t.settingsVisible ? "" : " hidden") + '>' +
          '<div class="tirage-tabs" style="margin-bottom:6px;">' +
            '<button class="preset-btn' + (mode === "individuel" ? " is-active" : "") + '" data-tirage-mode="individuel">Tirage individuel</button>' +
            '<button class="preset-btn' + (mode === "groupes" ? " is-active" : "") + '" data-tirage-mode="groupes">Groupes aléatoires</button>' +
            '<button class="preset-btn' + (mode === "fixes" ? " is-active" : "") + '" data-tirage-mode="fixes">Groupes fixes</button>' +
          "</div>" +
          '<button class="action-btn" id="tirage-resetpool">' + svg("restart") + " Réinitialiser la liste</button>" +
          '<button class="action-btn" id="tirage-resethistory">' + svg("restart") + " Réinitialiser l’historique</button>" +
        "</div>" +
        '<div id="tirage-panel-individuel"' + (mode === "individuel" ? "" : " hidden") + '>' +
          (names.length
            ? '<div class="tirage-display' + (allDrawn ? " is-message" : "") + '" id="tirage-display">' + (allDrawn ? "Tous les élèves ont été tirés." : "Prêt") + "</div>" +
              '<div class="editor-actions" style="justify-content:flex-start;">' +
                '<button class="action-btn primary" id="tirage-go">' + (allDrawn ? svg("restart") + " Recommencer le tirage" : svg("de") + " Tirer") + "</button>" +
              "</div>" +
              tirageHistoryHtml(names, t.counts)
            : tirageEmptyHtml("Tous les élèves sont exclus du tirage.")) +
        "</div>" +
        '<div id="tirage-panel-groupes"' + (mode === "groupes" ? "" : " hidden") + '>' +
          '<div class="group-controls">' +
            '<span class="unit-label">Nombre de groupes</span>' +
            '<input type="number" id="group-count" min="2" max="' + Math.max(2, groupPool.length) + '" value="2" aria-label="Nombre de groupes" />' +
            '<button class="action-btn primary" id="group-go"' + (groupPool.length ? "" : " disabled") + ">" + svg("de") + " Former les groupes</button>" +
          "</div>" +
          (groupPool.length ? "" : tirageEmptyHtml("Tous les élèves sont exclus des groupes.")) +
          '<div class="group-grid" id="group-results"></div>' +
        "</div>" +
        '<div id="tirage-panel-fixes"' + (mode === "fixes" ? "" : " hidden") + '>' +
          (STUDENT_GROUPS.length >= 2
            ? '<div class="editor-actions" style="justify-content:flex-start;margin-bottom:8px;">' +
                '<button class="action-btn primary" id="fixed-groups-go"' + (groupPool.length ? "" : " disabled") + ">" + svg("de") + " Répartir aléatoirement</button>" +
              "</div>"
            : (STUDENT_GROUPS.length === 1
                ? '<p class="editor-hint">Créez au moins un second groupe fixe dans l’éditeur (onglet Élèves) pour pouvoir répartir les élèves automatiquement.</p>'
                : "")) +
          fixedGroupsHtml() +
        "</div>" +
      "</div>";
    wireToolBack();
    setFitObserver(toolsWrap.querySelector(".tirage-display"), function () { fitTirageDisplay(toolsWrap.querySelector(".tirage-display")); });

    document.getElementById("tool-settings-toggle").addEventListener("click", function () {
      var t2 = loadTirage();
      t2.settingsVisible = !t2.settingsVisible;
      saveTirage(t2);
      var box = document.getElementById("tirage-settings");
      if (box) box.hidden = !t2.settingsVisible;
      document.getElementById("tool-settings-toggle").innerHTML = svg(t2.settingsVisible ? "up" : "down") + " Réglages";
    });

    Array.prototype.forEach.call(toolsWrap.querySelectorAll("[data-tirage-mode]"), function (btn) {
      btn.addEventListener("click", function () {
        var t2 = loadTirage();
        t2.mode = btn.getAttribute("data-tirage-mode");
        saveTirage(t2);
        renderTirage();
      });
    });

    Array.prototype.forEach.call(toolsWrap.querySelectorAll(".tirage-open-students"), function (btn) {
      btn.addEventListener("click", openStudentsEditor);
    });

    /* met l'affichage et le bouton en accord avec ce qu'il reste à tirer. keepName : on vient de tirer un
       nom, il reste affiché ; seul le bouton change (« Recommencer le tirage » si c'était le dernier). */
    function paintTirageState(keepName) {
      var displayEl = document.getElementById("tirage-display");
      var goEl = document.getElementById("tirage-go");
      if (!displayEl || !goEl) return;
      var left = (loadTirage().remaining || []).length;
      if (!keepName) {
        displayEl.classList.toggle("is-message", !left);
        displayEl.textContent = left ? "Prêt" : "Tous les élèves ont été tirés.";
        fitTirageDisplay(displayEl);
      }
      goEl.innerHTML = left ? svg("de") + " Tirer" : svg("restart") + " Recommencer le tirage";
    }
    function refillTiragePool() {
      var t2 = loadTirage();
      t2.remaining = names.slice();
      saveTirage(t2);
      paintTirageState(false);
    }
    document.getElementById("tirage-resetpool").addEventListener("click", refillTiragePool);

    document.getElementById("tirage-resethistory").addEventListener("click", function () {
      askConfirm("Réinitialiser l’historique des tirages (nombre de fois tiré par élève)\u202F?", "Réinitialiser", function () {
        var t2 = loadTirage();
        t2.counts = {};
        saveTirage(t2);
        renderTirage();
      });
    });

    var goBtn = document.getElementById("tirage-go");
    if (goBtn) goBtn.addEventListener("click", function () {
      var t2 = loadTirage();
      var pool = t2.remaining || [];
      if (!pool.length) { refillTiragePool(); return; } /* le bouton dit alors « Recommencer le tirage » */
      var display = document.getElementById("tirage-display");
      display.classList.remove("is-message");
      fitTirageDisplay(display);
      var ticks = 0;
      var maxTicks = 14;
      var timer = setInterval(function () {
        var randomName = pool[Math.floor(Math.random() * pool.length)];
        display.textContent = randomName;
        ticks++;
        if (ticks >= maxTicks) {
          clearInterval(timer);
          var finalName = pool[Math.floor(Math.random() * pool.length)];
          display.textContent = finalName;
          var t3 = loadTirage();
          t3.remaining = (t3.remaining || []).filter(function (n) { return n !== finalName; });
          t3.counts = t3.counts || {};
          t3.counts[finalName] = (t3.counts[finalName] || 0) + 1;
          saveTirage(t3);
          var histEl = toolsWrap.querySelector(".tirage-history");
          if (histEl) histEl.outerHTML = tirageHistoryHtml(names, t3.counts);
          paintTirageState(true);
          if (!t3.remaining.length) announce(finalName + ". Tous les élèves ont été tirés.");
        }
      }, 80);
    });

    var fixedGroupsGoBtn = document.getElementById("fixed-groups-go");
    if (fixedGroupsGoBtn) fixedGroupsGoBtn.addEventListener("click", function () {
      assignFixedGroupsRandomly();
      renderTirage();
    });

    var groupGoBtn = document.getElementById("group-go");
    if (groupGoBtn) groupGoBtn.addEventListener("click", function () {
      var n = parseInt(document.getElementById("group-count").value, 10);
      if (!isFinite(n) || n < 2) n = 2;
      var groups = formGroups(groupPool, n);
      document.getElementById("group-results").innerHTML = groups.map(function (g, i) {
        return '<div class="group-card"><h4>Groupe ' + (i + 1) + "</h4><ul>" +
          g.map(function (s) { return "<li>" + esc(s.name) + "</li>"; }).join("") +
          "</ul></div>";
      }).join("");
    });
  }

  /* ---- Dé ---- */
  function loadDe() {
    try {
      var raw = localStorage.getItem(DE_KEY);
      if (raw) {
        var d = JSON.parse(raw);
        if (!(d.faces > 1)) d.faces = 6;
        if (!(d.diceCount >= 1)) d.diceCount = 1;
        d.diceCount = Math.min(d.diceCount, 6);
        d.settingsVisible = !!d.settingsVisible;
        return d;
      }
    } catch (e) {}
    return { faces: 6, diceCount: 1, settingsVisible: true };
  }
  function saveDe(d) { try { localStorage.setItem(DE_KEY, JSON.stringify(d)); } catch (e) {} }

  function deResultsHtml(vals) {
    return vals.map(function (v) {
      return '<div class="tirage-display de-die">' + esc(String(v)) + "</div>";
    }).join("");
  }

  /* grandit la ou les faces du dé pour remplir #de-grid (qui grandit lui-même vers l'espace
     libéré quand #de-settings est masqué) */
  function fitDeGrid(gridEl) {
    if (!gridEl) return;
    var dice = gridEl.querySelectorAll(".de-die");
    var n = dice.length;
    if (!n) return;
    var h = gridEl.clientHeight, w = gridEl.clientWidth;
    if (!h || !w) return;
    var cols = Math.max(1, Math.min(n, Math.floor(w / 64) || 1));
    var rows = Math.ceil(n / cols);
    var cellH = h / rows - 6;
    var cellW = w / cols - 6;
    var size = Math.max(28, Math.min(cellH, cellW, 200));
    Array.prototype.forEach.call(dice, function (d) {
      d.style.minHeight = size + "px";
      d.style.fontSize = Math.max(16, size * 0.42) + "px";
    });
  }

  function renderDe() {
    stopSonometre();
    stopQuickMinuteur();
    var d = loadDe();
    var presets = [4, 6, 8, 10, 12, 20];

    toolsWrap.innerHTML =
      '<div class="editor">' + toolTopbar("Dé", !!d.settingsVisible) +
        '<div class="editor-hint" id="de-settings"' + (d.settingsVisible ? "" : " hidden") + '>' +
          '<div class="quick-presets" style="margin-bottom:8px;">' +
            presets.map(function (p) {
              return '<button class="preset-btn' + (d.faces === p ? " is-active" : "") + '" data-de-preset="' + p + '">' + p + " faces</button>";
            }).join("") +
          "</div>" +
          '<div class="group-controls">' +
            '<span class="unit-label">Nombre de faces</span>' +
            '<input type="number" id="de-faces" min="2" max="100" value="' + d.faces + '" aria-label="Nombre de faces" />' +
            '<span class="unit-label">Nombre de dés</span>' +
            '<input type="number" id="de-count" min="1" max="6" value="' + d.diceCount + '" aria-label="Nombre de dés" />' +
          "</div>" +
        "</div>" +
        '<div class="de-grid" id="de-grid">' + deResultsHtml(new Array(d.diceCount).fill("–")) + "</div>" +
        '<div class="de-sum" id="de-sum"' + (d.diceCount > 1 ? "" : " hidden") + '></div>' +
        '<div class="editor-actions" style="justify-content:flex-start;">' +
          '<button class="action-btn primary" id="de-go">' + svg("de") + " Lancer le dé</button>" +
        "</div>" +
      "</div>";
    wireToolBack();
    setFitObserver(document.getElementById("de-grid"), function () { fitDeGrid(document.getElementById("de-grid")); });

    document.getElementById("tool-settings-toggle").addEventListener("click", function () {
      var d2 = loadDe();
      d2.settingsVisible = !d2.settingsVisible;
      saveDe(d2);
      var box = document.getElementById("de-settings");
      if (box) box.hidden = !d2.settingsVisible;
      document.getElementById("tool-settings-toggle").innerHTML = svg(d2.settingsVisible ? "up" : "down") + " Réglages";
    });

    Array.prototype.forEach.call(toolsWrap.querySelectorAll("[data-de-preset]"), function (btn) {
      btn.addEventListener("click", function () {
        var d2 = loadDe();
        d2.faces = Number(btn.getAttribute("data-de-preset"));
        saveDe(d2);
        renderDe();
      });
    });

    var facesEl = document.getElementById("de-faces");
    if (facesEl) facesEl.addEventListener("change", function (e) {
      var v = parseInt(e.target.value, 10);
      var d2 = loadDe();
      d2.faces = (isFinite(v) && v >= 2) ? v : 6;
      saveDe(d2);
      renderDe();
    });

    var countEl = document.getElementById("de-count");
    if (countEl) countEl.addEventListener("change", function (e) {
      var v = parseInt(e.target.value, 10);
      var d2 = loadDe();
      d2.diceCount = (isFinite(v) && v >= 1) ? Math.min(v, 6) : 1;
      saveDe(d2);
      renderDe();
    });

    var goBtn = document.getElementById("de-go");
    if (goBtn) goBtn.addEventListener("click", function () {
      var d2 = loadDe();
      var grid = document.getElementById("de-grid");
      var sumEl = document.getElementById("de-sum");
      var ticks = 0;
      var maxTicks = 12;
      var timer = setInterval(function () {
        var randomVals = [];
        for (var i = 0; i < d2.diceCount; i++) randomVals.push(1 + Math.floor(Math.random() * d2.faces));
        grid.innerHTML = deResultsHtml(randomVals);
        fitDeGrid(grid);
        ticks++;
        if (ticks >= maxTicks) {
          clearInterval(timer);
          var finalVals = [];
          for (var j = 0; j < d2.diceCount; j++) finalVals.push(1 + Math.floor(Math.random() * d2.faces));
          grid.innerHTML = deResultsHtml(finalVals);
          fitDeGrid(grid);
          if (sumEl && d2.diceCount > 1) {
            var total = finalVals.reduce(function (a, b) { return a + b; }, 0);
            sumEl.hidden = false;
            sumEl.textContent = "Total : " + total;
          }
        }
      }, 80);
    });
  }

  /* ---- Comment ça va (échelle d'émotions) ---- */
  function normalizeMoodData(d) {
    d.mode = findMoodMode(d.mode).key;
    d.countsByMode = d.countsByMode || {};
    MOOD_MODES.forEach(function (m) {
      d.countsByMode[m.key] = d.countsByMode[m.key] || {};
      m.options.forEach(function (o) {
        if (typeof d.countsByMode[m.key][o.key] !== "number") d.countsByMode[m.key][o.key] = 0;
      });
    });
    d.settingsVisible = !!d.settingsVisible;
    return d;
  }
  function loadMoodData() {
    try {
      var raw = localStorage.getItem(MOOD_KEY);
      if (raw) {
        var d = JSON.parse(raw);
        if (d && d.counts && !d.countsByMode) { d = { mode: "emotions", countsByMode: { emotions: d.counts }, settingsVisible: d.settingsVisible }; } /* migration from the single-scale version */
        if (d) return normalizeMoodData(d);
      }
    } catch (e) {}
    return normalizeMoodData({ mode: "emotions", countsByMode: {}, settingsVisible: false });
  }
  function saveMoodData(d) { try { localStorage.setItem(MOOD_KEY, JSON.stringify(d)); } catch (e) {} }

  /* grandit les icônes d'émotion pour remplir .mood-grid (la grille passe elle-même sur
     deux lignes via auto-fit plutôt que de rétrécir les icônes pour tenir sur une seule) */
  function fitMoodGrid(gridEl) {
    if (!gridEl) return;
    var btns = gridEl.querySelectorAll(".mood-btn");
    if (!btns.length) return;
    var rect = btns[0].getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    var cellSize = Math.min(rect.width, rect.height);
    var iconSize = Math.max(18, Math.min(cellSize * 0.42, 72));
    var fontSize = Math.max(9, Math.min(cellSize * 0.14, 20));
    Array.prototype.forEach.call(btns, function (b) {
      var icon = b.querySelector("svg");
      if (icon) { icon.style.width = iconSize + "px"; icon.style.height = iconSize + "px"; }
      b.style.fontSize = fontSize + "px";
    });
  }

  function renderEmotions() {
    stopSonometre();
    stopQuickMinuteur();
    var d = loadMoodData();
    var modeDef = findMoodMode(d.mode);
    var counts = d.countsByMode[modeDef.key];
    toolsWrap.innerHTML =
      '<div class="editor">' + toolTopbar("Comment ça va\u202F?", !!d.settingsVisible) +
        '<div class="mood-grid">' +
          modeDef.options.map(function (o) {
            var count = counts[o.key] || 0;
            return '<button class="mood-btn" data-mood="' + o.key + '">' +
              o.icon +
              "<span>" + esc(o.label) + "</span>" +
              '<span class="mood-count" data-count-for="' + o.key + '">' + count + "</span>" +
            "</button>";
          }).join("") +
        "</div>" +
        '<div class="mood-echo" id="mood-echo"></div>' +
        '<div class="mood-settings"' + (d.settingsVisible ? "" : " hidden") + '>' +
          '<div class="field"><span>Modalité</span><select id="mood-mode-select" aria-label="Modalité">' +
            MOOD_MODES.map(function (m) { return '<option value="' + m.key + '"' + (m.key === modeDef.key ? " selected" : "") + ">" + esc(m.label) + "</option>"; }).join("") +
          "</select></div>" +
          '<button class="action-btn" id="mood-reset">' + svg("restart") + " Réinitialiser les compteurs (cette modalité)</button>" +
        "</div>" +
      "</div>";
    wireToolBack();
    setFitObserver(toolsWrap.querySelector(".mood-grid"), function () { fitMoodGrid(toolsWrap.querySelector(".mood-grid")); });

    document.getElementById("tool-settings-toggle").addEventListener("click", function () {
      var d2 = loadMoodData();
      d2.settingsVisible = !d2.settingsVisible;
      saveMoodData(d2);
      var box = toolsWrap.querySelector(".mood-settings");
      if (box) box.hidden = !d2.settingsVisible;
      document.getElementById("tool-settings-toggle").innerHTML = svg(d2.settingsVisible ? "up" : "down") + " Réglages";
    });

    document.getElementById("mood-mode-select").addEventListener("change", function (e) {
      var d2 = loadMoodData();
      d2.mode = e.target.value;
      d2.settingsVisible = true;
      saveMoodData(d2);
      renderEmotions();
    });

    Array.prototype.forEach.call(toolsWrap.querySelectorAll("[data-mood]"), function (btn) {
      btn.addEventListener("click", function () {
        Array.prototype.forEach.call(toolsWrap.querySelectorAll(".mood-btn"), function (b) { b.classList.remove("is-picked"); });
        btn.classList.add("is-picked");
        var key = btn.getAttribute("data-mood");
        var d2 = loadMoodData();
        d2.countsByMode[modeDef.key][key] = (d2.countsByMode[modeDef.key][key] || 0) + 1;
        saveMoodData(d2);
        var countEl = toolsWrap.querySelector('[data-count-for="' + key + '"]');
        if (countEl) countEl.textContent = d2.countsByMode[modeDef.key][key];
        var found = modeDef.options.filter(function (o) { return o.key === key; })[0];
        document.getElementById("mood-echo").textContent = found ? found.label : "";
      });
    });

    document.getElementById("mood-reset").addEventListener("click", function () {
      var d2 = loadMoodData();
      modeDef.options.forEach(function (o) { d2.countsByMode[modeDef.key][o.key] = 0; });
      saveMoodData(d2);
      renderEmotions();
    });
  }

  /* ---- Sonomètre ---- */
  var sono = { ctx: null, analyser: null, stream: null, raf: null, lastAlertAt: 0 };
  function loadSonoSettings() {
    try {
      var raw = localStorage.getItem(SONO_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return { alertEnabled: false, threshold: 65, settingsVisible: true };
  }
  function saveSonoSettings(s) { try { localStorage.setItem(SONO_KEY, JSON.stringify(s)); } catch (e) {} }

  function stopSonometre() {
    if (sono.raf) { cancelAnimationFrame(sono.raf); sono.raf = null; }
    if (sono.stream) { sono.stream.getTracks().forEach(function (t) { t.stop(); }); sono.stream = null; }
    if (sono.ctx) { try { sono.ctx.close(); } catch (e) {} sono.ctx = null; }
    sono.analyser = null;
  }

  /* Nettoyage défensif du minuteur rapide (voir stopSonometre) : à appeler partout où le
     panneau Outils peut se fermer/changer alors que "Minuteur rapide" tourne, pour éviter
     que son setInterval continue en arrière-plan (bug corrigé : fermeture via btn-tools/Accueil). */
  function stopQuickMinuteur() {
    if (quick.raf) { clearInterval(quick.raf); quick.raf = null; }
    quick.running = false;
  }

  function renderSonometre() {
    stopSonometre();
    stopQuickMinuteur();
    var s = loadSonoSettings();
    toolsWrap.innerHTML =
      '<div class="editor">' + toolTopbar("Sonomètre", !!s.settingsVisible) +
        '<div class="sono-status" id="sono-status">Micro non activé.</div>' +
        '<div class="sono-gauge-track"><div class="sono-gauge-fill" id="sono-fill"></div></div>' +
        '<div class="sono-controls"' + (s.settingsVisible ? "" : " hidden") + '>' +
          '<div class="sono-row"><label class="switch"><input type="checkbox" id="sono-alert"' + (s.alertEnabled ? " checked" : "") + ' /> Alerte sonore si le seuil est dépassé (sinon jauge visuelle seule)</label></div>' +
          '<div class="sono-row"><span class="unit-label">Seuil</span><input type="range" id="sono-threshold" min="10" max="95" value="' + s.threshold + '" aria-label="Seuil d’alerte, en pour cent" /><span class="unit-label" id="sono-threshold-val">' + s.threshold + "%</span></div>" +
          '<div class="editor-actions" style="justify-content:flex-start;"><button class="action-btn primary" id="sono-start">' + svg("ondes") + " Activer le micro</button></div>" +
        "</div>" +
      "</div>";
    wireToolBack(stopSonometre);

    document.getElementById("tool-settings-toggle").addEventListener("click", function () {
      var s2 = loadSonoSettings();
      s2.settingsVisible = !s2.settingsVisible;
      saveSonoSettings(s2);
      var box = toolsWrap.querySelector(".sono-controls");
      if (box) box.hidden = !s2.settingsVisible;
      var toggleBtn = document.getElementById("tool-settings-toggle");
      toggleBtn.innerHTML = svg(s2.settingsVisible ? "up" : "down") + " Réglages";
    });

    document.getElementById("sono-alert").addEventListener("change", function (e) {
      var s2 = loadSonoSettings(); s2.alertEnabled = e.target.checked; saveSonoSettings(s2);
    });
    document.getElementById("sono-threshold").addEventListener("input", function (e) {
      var s2 = loadSonoSettings(); s2.threshold = Number(e.target.value); saveSonoSettings(s2);
      document.getElementById("sono-threshold-val").textContent = s2.threshold + "%";
    });

    document.getElementById("sono-start").addEventListener("click", function () {
      var statusEl = document.getElementById("sono-status");
      if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) {
        statusEl.textContent = "Micro non disponible sur ce navigateur.";
        return;
      }
      navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
        sono.stream = stream;
        var AC = window.AudioContext || window.webkitAudioContext;
        sono.ctx = new AC();
        var source = sono.ctx.createMediaStreamSource(stream);
        sono.analyser = sono.ctx.createAnalyser();
        sono.analyser.fftSize = 512;
        source.connect(sono.analyser);
        statusEl.textContent = "Micro actif.";
        loopSono();
      }, function () {
        statusEl.textContent = "Accès au micro refusé ou indisponible.";
      });
    });

    function loopSono() {
      if (!sono.analyser) return;
      var data = new Uint8Array(sono.analyser.fftSize);
      sono.analyser.getByteTimeDomainData(data);
      var sum = 0;
      for (var i = 0; i < data.length; i++) { var v = (data[i] - 128) / 128; sum += v * v; }
      var rms = Math.sqrt(sum / data.length);
      var level = Math.min(100, Math.round(rms * 260));
      var fillEl = document.getElementById("sono-fill");
      var s2 = loadSonoSettings();
      if (fillEl) {
        fillEl.style.height = level + "%";
        var color = level >= s2.threshold ? "var(--red)" : (level >= s2.threshold * 0.7 ? "var(--pause-accent)" : "var(--accent)");
        fillEl.style.background = color;
      }
      if (s2.alertEnabled && level >= s2.threshold) {
        var now = Date.now();
        if (now - sono.lastAlertAt > 3000) {
          sono.lastAlertAt = now;
          try {
            var osc = sono.ctx.createOscillator();
            var gain = sono.ctx.createGain();
            osc.type = "triangle";
            osc.frequency.value = 440;
            gain.gain.value = 0.06;
            osc.connect(gain).connect(sono.ctx.destination);
            osc.start();
            osc.stop(sono.ctx.currentTime + 0.4);
          } catch (e) {}
        }
      }
      sono.raf = requestAnimationFrame(loopSono);
    }
  }

  /* ---- Groupes de choix ("choisissez N sur M") — couche indépendante des étiquettes
     Obligatoire / À choix / À la maison ci-dessous, qu'elle n'affecte pas : un même
     tâche garde ses badges habituels qu'elle appartienne ou non à un groupe. Le
     nombre total (M) n'est jamais stocké : il se recalcule ici à partir des tâches
     qui portent réellement ce groupId, pour rester juste même après ajout/retrait. */
  function renderTaskListWithGroups(tasks, groups, showDetails, renderTaskFn) {
    tasks = tasks || [];
    groups = groups || [];
    if (!showDetails) {
      return tasks.map(renderTaskFn).join("");
    }
    var membersByGroup = {};
    tasks.forEach(function (t) {
      var gid = t.groupId || "";
      if (!gid) return;
      if (!membersByGroup[gid]) membersByGroup[gid] = [];
      membersByGroup[gid].push(t);
    });
    var groupIndexById = {};
    groups.forEach(function (g, gi) { groupIndexById[g.id] = gi; });
    var groupById = {};
    groups.forEach(function (g) { groupById[g.id] = g; });
    var renderedGroup = {};
    var out = [];
    tasks.forEach(function (t) {
      var gid = t.groupId || "";
      var members = gid ? membersByGroup[gid] : null;
      var group = gid ? groupById[gid] : null;
      if (!gid || !members || !members.length || !group) {
        out.push(renderTaskFn(t));
        return;
      }
      if (renderedGroup[gid]) return; /* déjà rendu à la position du 1er membre */
      renderedGroup[gid] = true;
      var paletteIdx = (groupIndexById[gid] || 0) % GROUP_PALETTE_SIZE;
      var chooseN = group.choose > 0 ? group.choose : 1;
      var headerText = (group.label ? esc(group.label) + " — " : "") + chooseN + " sur " + members.length;
      out.push(
        '<div class="plan-group-block plan-group-' + paletteIdx + '">' +
          '<div class="plan-group-header">' + headerText + "</div>" +
          '<div class="plan-group-members">' + members.map(renderTaskFn).join("") + "</div>" +
        "</div>"
      );
    });
    return out.join("");
  }

  /* ---- Plan de travail (vue liste des étapes/tâches, utilisable à l’écran ou imprimée) ---- */
  function planBadgesHtml(t, showDetails) {
    if (!showDetails) return "";
    var out = "";
    if (t.mandatory !== false) out += '<span class="plan-badge plan-badge-required">Obligatoire</span>';
    else out += '<span class="plan-badge plan-badge-optional">À choix</span>';
    if (t.homework) out += '<span class="plan-badge plan-badge-home">À la maison si pas fini</span>';
    return out;
  }
  function planTaskLabel(t) {
    if (t.name && t.text) return "<strong>" + esc(t.name) + "</strong> — " + esc(t.text);
    return esc(t.name || t.text || "");
  }
  function renderPlan() {
    stopSonometre();
    stopQuickMinuteur();
    var showDetails = getPlanShowDetails();
    var showGroups = getPlanShowGroups();
    toolsWrap.innerHTML =
      '<div class="editor">' + toolTopbar("Plan de travail") +
        '<p class="editor-hint" style="margin:-3px 0 2px;">Liste du programme, utilisable à l’écran comme plan de travail, ou imprimée pour être posée à côté de l’élève.</p>' +
        '<div class="plan-controls">' +
          '<button class="action-btn primary" id="plan-print">' + svg("download", "icon-mini") + " Imprimer</button>" +
        "</div>" +
        '<div class="plan-list" id="plan-list">' + planListHtml(showDetails, showGroups) + "</div>" +
      "</div>";
    wireToolBack();

    document.getElementById("plan-print").addEventListener("click", printPlan);
  }
  function planListHtml(showDetails, showGroups) {
    if (!STEPS.length) return '<p class="editor-hint" style="margin:0;">Aucune étape dans ce programme.</p>';
    return STEPS.map(function (s) {
      var taskItems = renderTaskListWithGroups(s.tasks || [], s.taskGroups || [], showGroups, function (t) {
        return '<label class="plan-task"><input type="checkbox" /><span>' + planTaskLabel(t) + "</span>" + planBadgesHtml(t, showDetails) + "</label>";
      });
      return '<div class="plan-step">' +
        '<div class="plan-step-head"><span>' + svg(s.icon) + " " + esc(s.label) + "</span>" + (TIMED ? "<span>" + Math.round(s.seconds / 60) + " min</span>" : "") + "</div>" +
        (taskItems || '<p class="editor-hint" style="margin:2px 0 0;">Pas de tâche spécifique.</p>') +
      "</div>";
    }).join("");
  }
  function buildPrintPlanHtml(showDetails, showGroups) {
    var dateStr = new Date().toLocaleDateString("fr-CH", { day: "2-digit", month: "2-digit", year: "numeric" });
    var stepsHtml = STEPS.map(function (s) {
      var taskItems = renderTaskListWithGroups(s.tasks || [], s.taskGroups || [], showGroups, function (t) {
        return '<div class="print-task"><span class="box"></span><span>' + planTaskLabel(t) + "</span>" + planBadgesHtml(t, showDetails) + "</div>";
      });
      return '<div class="print-step">' +
        '<div class="print-step-head"><span>' + esc(s.label) + "</span>" + (TIMED ? "<span>" + Math.round(s.seconds / 60) + " min</span>" : "") + "</div>" +
        (taskItems || '<div class="print-task" style="opacity:.6">Pas de tâche spécifique.</div>') +
      "</div>";
    }).join("");
    return "<h1>" + esc(TITLE) + "</h1><div class=\"print-meta\">Plan de travail — " + dateStr + "</div>" + stepsHtml;
  }
  function printPlan() {
    var showDetails = getPlanShowDetails();
    var showGroups = getPlanShowGroups();
    var el = document.getElementById("print-plan");
    if (!el) { el = document.createElement("div"); el.id = "print-plan"; document.body.appendChild(el); }
    el.innerHTML = buildPrintPlanHtml(showDetails, showGroups);
    setTimeout(function () { window.print(); }, 30);
  }

  /* ---------- go ---------- */
  showOnly("home");
  renderHome();
  new MutationObserver(scheduleScrollFadeUpdate).observe(document.body, { childList: true, subtree: true, characterData: true });
  window.addEventListener("resize", scheduleScrollFadeUpdate);
  setInterval(function () {
    /* le déroulé minuté continue d'avancer même quand on regarde la vue projetée
       (render() lui-même ne tourne que pour la vue "timer") : sans ça, le titre de
       l'étape en cours resterait figé pendant qu'on projette l'écran aux élèves.
       catchUp() ne fait jamais avancer que d'une étape par appel (advance() remet startTs à
       "maintenant", donc le temps écoulé retombe aussitôt à ~0) : après un long moment en
       arrière-plan avec plusieurs étapes dépassées, le rattrapage se fait donc étape par étape,
       un appel de cette boucle toutes les 250 ms, jusqu'à revenir à l'étape réellement en cours.
       Sans précaution, ça jouerait un "ding" à chacun de ces passages rapprochés — une rafale
       de sons en une fraction de seconde. On s'en protège avec un court délai anti-rafale
       (lastProjectedDingAt) : un vrai changement d'étape isolé (qui, en usage normal, arrive au
       minimum plusieurs dizaines de secondes après le précédent) sonne toujours, mais des
       avancées à moins de 1.5 s d'intervalle ne redéclenchent pas le son. */
    if (currentView === "projected" && PROFILE_KIND === "deroule" && TIMED && state.running) {
      var indexBeforeCatchUp = state.index;
      catchUp();
      if (state.index > indexBeforeCatchUp) {
        var nowTs = Date.now();
        if (nowTs - lastProjectedDingAt > 1500) {
          lastProjectedDingAt = nowTs;
          playTransitionSound();
        }
      }
    }
    render(false);
    if (currentView === "projected") {
      refreshProjectedLive();
      customBlockTimersTick();
    }
  }, 250);
}
