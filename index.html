<!DOCTYPE html><html lang="fr"><head><meta charset='utf-8'><meta name="viewport" content="width=device-width, initial-scale=1"><title>PL-planif’</title></head><body><script>
function boot(initialData) {
  "use strict";

  /* ---------- style ---------- */
  var CSS_TEXT = `
    @import url('https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Lexend:wght@400;700&family=Andika:wght@400;700&family=Comic+Neue:wght@400;700&family=Quicksand:wght@400;700&display=swap');

    :root {
      --bg: #eff2f0;
      --surface: #ffffff;
      --surface-alt: #e4e9e6;
      --ink: #253433;
      --muted: #5b6c6a;
      --accent: #2f6f63;
      --accent-soft: color-mix(in srgb, var(--accent) 18%, var(--surface));
      --pause-accent: #b97a3d;
      --pause-soft: color-mix(in srgb, var(--pause-accent) 22%, var(--surface));
      --pause-strong: color-mix(in srgb, var(--pause-accent) 80%, #000); /* fond de bouton d'une étape « Pause » : assez foncé pour un libellé clair (≥ 4,5:1) */
      /* couleur du décompte posé sur la jauge : l'accent tiré vers --ink, pour rester lisible sur la zone remplie
         comme sur la zone vide. Suit le thème (--ink change) et la couleur choisie dans l'éditeur (--accent). */
      --accent-strong: color-mix(in srgb, var(--accent) 65%, var(--ink));
      --pause-text: color-mix(in srgb, var(--pause-accent) 60%, var(--ink));
      --pause-fill: color-mix(in srgb, var(--pause-accent) 38%, transparent); /* remplissage de la jauge d'une étape « Pause » */
      --red: #b6503f;
      --red-soft: color-mix(in srgb, var(--red) 20%, var(--surface));
      --border: #d7ddda;
      --shadow: 0 1px 2px rgba(37, 52, 51, 0.06), 0 10px 24px rgba(37, 52, 51, 0.08);
      --font-family-body: 'Atkinson Hyperlegible';
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #182422; --surface: #202f2c; --surface-alt: #24322f; --ink: #eaf1ee;
        --muted: #9fb0ac; --accent: #6fbfae;
        --pause-accent: #e3a768; --red: #d98070; --border: #33443f;
        --pause-strong: var(--pause-accent);
        --pause-fill: color-mix(in srgb, var(--pause-accent) 30%, transparent); /* plus léger en sombre : à 38 %, le petit texte clair tombait à 4,3:1 sur la zone remplie */
        --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 12px 28px rgba(0,0,0,0.35);
      }
    }
    :root[data-theme="dark"] {
      --bg: #182422; --surface: #202f2c; --surface-alt: #24322f; --ink: #eaf1ee;
      --muted: #9fb0ac; --accent: #6fbfae;
      --pause-accent: #e3a768; --red: #d98070; --border: #33443f;
      --pause-strong: var(--pause-accent);
      --pause-fill: color-mix(in srgb, var(--pause-accent) 30%, transparent);
      --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 12px 28px rgba(0,0,0,0.35);
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; } /* our display:flex rules elsewhere would otherwise outrank the browser's own [hidden] rule */
    html { font-size: 112.5%; } /* base 18 px : tout ce qui est en rem suit (hors impression, voir @media print) */
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font-family: var(--font-family-body, 'Atkinson Hyperlegible'), 'Segoe UI', system-ui, sans-serif;
      padding-inline: clamp(16px, 3vw, 48px); padding-block: clamp(10px, 2vh, 24px);
      height: 100%;
      overflow: auto; /* safety net: content shouldn't need it, but nothing gets clipped if it doesn't fit */
    }

    .page { max-width: 1100px; margin-inline: auto; height: 100%; display: flex; flex-direction: column; gap: clamp(8px, 1.6vh, 18px); }
    header { flex: 0 0 auto; }
    footer { flex: 0 0 auto; }

    header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .heading { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .eyebrow { font-weight: 700; font-size: 0.9rem; color: var(--muted); }
    .progress-track {
      width: min(100%, 260px); height: 6px; border-radius: 999px; background: var(--border);
      overflow: hidden; margin-top: 2px;
    }
    .progress-fill { height: 100%; border-radius: 999px; background: var(--accent); width: 0%; transition: width 0.35s ease; }
    h1 { margin: 0; font-size: clamp(1.7rem, 3.4vw, 2.5rem); font-weight: 700; line-height: 1.1; }
    #app-title {
      border-radius: 8px; padding: 2px 6px; margin: -2px -6px; outline: none;
      border: 1px dashed transparent;
    }
    #app-title:hover, #app-title:focus { border-color: var(--border); }
    .controls { display: flex; gap: 10px clamp(14px, 2.4vw, 36px); flex-wrap: wrap; justify-content: flex-start; }
    .ctrl-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .ctrl-btn {
      display: flex; align-items: center; justify-content: center; width: 48px; height: 48px;
      border-radius: 14px; border: 1px solid var(--border); background: var(--surface); color: var(--ink);
      cursor: pointer; transition: transform 0.15s ease;
    }
    .ctrl-btn:hover { transform: translateY(-1px); }
    .ctrl-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .ctrl-btn svg { width: 22px; height: 22px; }
    .ctrl-btn.labeled { width: auto; min-width: 48px; padding-inline: 14px 16px; gap: 8px; font: inherit; font-weight: 700; font-size: 1rem; }
    .ctrl-btn.primary { background: var(--accent); color: var(--surface); border-color: transparent; }
    .ctrl-btn.is-active { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
    .ctrl-btn:disabled { opacity: 0.45; cursor: default; }
    .ctrl-btn:disabled:hover { transform: none; }
    /* Démarrer / Pause / Reprendre : largeur de libellé fixe, pour que les boutons voisins ne se décalent pas quand le libellé change */
    #btn-play .ctrl-label { display: inline-block; text-align: left; }
    #btn-play .ctrl-label::before, #btn-play .ctrl-label::after { display: block; height: 0; overflow: hidden; visibility: hidden; }
    #btn-play .ctrl-label::before { content: "Démarrer"; }
    #btn-play .ctrl-label::after { content: "Reprendre"; }
    /* « Suivant » : icône seule en vue Programme, écrit en toutes lettres en vue projetée (classe posée par showOnly()) */
    #btn-skip .ctrl-label { display: none; }
    #btn-skip.labeled .ctrl-label { display: inline; }
    /* menu « Plus » : accueil, guide, apparence, son et « Recommencer » (celui-ci, séparé et en rouge, loin de « Étape suivante ») */
    .more-wrap { position: relative; }
    .more-menu {
      position: absolute; top: calc(100% + 8px); left: 0; z-index: 30; min-width: 280px; max-width: calc(100vw - 32px);
      display: flex; flex-direction: column; gap: 2px; padding: 8px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow);
    }
    .more-menu.align-end { left: auto; right: 0; }
    .more-item {
      display: flex; align-items: center; gap: 12px; width: 100%; min-height: 48px; padding: 8px 14px; text-align: left;
      border: 0; border-radius: 12px; background: transparent; color: var(--ink); cursor: pointer;
      font: inherit; font-weight: 700; font-size: 1rem;
    }
    .more-item:hover { background: var(--accent-soft); }
    .more-item:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
    .more-item svg { width: 22px; height: 22px; flex: none; }
    .more-item.danger { color: var(--red); margin-top: 6px; border-top: 1px solid var(--border); border-radius: 0 0 12px 12px; padding-top: 10px; }
    .more-item:disabled { opacity: 0.45; cursor: default; }
    .more-item:disabled:hover { background: transparent; }
    .more-menu.drop-up { top: auto; bottom: calc(100% + 8px); } /* menu d'une carte en bas de liste : s'ouvre vers le haut */
    .card-menu { min-width: min(330px, calc(100vw - 32px)); } /* « Remettre le minuteur au début » tient sur une ligne */

    .active-card {
      position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
      padding: clamp(8px, 2vh, 20px); box-shadow: var(--shadow); overflow: hidden;
      display: flex; flex-direction: column; justify-content: center; gap: clamp(5px, 1.2vh, 12px); animation: rise 0.4s ease;
    }
    .active-card.is-pause { background: var(--pause-soft); }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { .active-card { animation: none; } }

    .card-fill {
      position: absolute; inset: 0; width: 0%;
      background: color-mix(in srgb, var(--accent) 38%, transparent);
      transition: width 0.2s linear; z-index: 0;
    }
    .active-card.is-pause .card-fill { background: var(--pause-fill); }
    /* bord avant du remplissage : on lit l'avancement d'un coup d'œil, sans foncer le fond. Plein en haut et
       en bas (dans les marges de la carte, là où il n'y a pas de texte), adouci au milieu : il ne tranche
       plus les lettres quand il passe derrière elles. À 0 % il est hors de la carte, donc invisible. */
    .card-fill::after {
      content: ""; position: absolute; top: 0; bottom: 0; right: 0; width: 6px; --edge: var(--accent);
      background: linear-gradient(to bottom, var(--edge) 0 var(--edge-cap, 12px), color-mix(in srgb, var(--edge) 28%, transparent) var(--edge-cap, 12px) calc(100% - var(--edge-cap, 12px)), var(--edge) calc(100% - var(--edge-cap, 12px)) 100%);
    }
    .active-card.is-pause .card-fill::after { --edge: var(--pause-accent); }
    /* Texte de la carte-jauge : la carte reste d'un seul tenant (pas de plaque sous le texte) ; c'est la
       couleur du texte qui garantit la lecture. Tout ce qui est posé sur la jauge est en --ink (petits
       textes) ou en accent renforcé (décompte) : le contraste tient sur la zone remplie comme sur la zone
       vide, en clair et en sombre. Les gris (--muted) ne passaient pas sur la zone remplie. */
    .active-card .active-step-of, .active-card .countdown-label, .active-card .tasks-block-label,
    .active-card .card-content > .back-link, .active-card .jump-row .unit-label,
    .active-card .projected-timer-hidden-note { color: var(--ink); }
    .active-card .countdown { color: var(--accent-strong); }
    .active-card.is-pause .countdown { color: var(--pause-text); }
    .active-card .task-chip { background: var(--surface); }

    .card-content { position: relative; z-index: 1; display: flex; flex-direction: column; gap: clamp(4px, 1vh, 10px); min-height: 0; overflow: auto; }
    .active-top { display: flex; align-items: center; gap: 8px; }
    .active-icon {
      width: clamp(26px, 6vh, 44px); height: clamp(26px, 6vh, 44px); border-radius: 12px; display: flex; align-items: center; justify-content: center;
      background: var(--accent-soft); color: var(--accent); flex-shrink: 0;
    }
    .active-card.is-pause .active-icon { background: var(--pause-soft); color: var(--pause-accent); }
    .active-icon svg { width: 60%; height: 60%; }
    .active-meta { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
    .active-step-of { color: var(--muted); font-weight: 700; font-size: 0.9rem; font-variant-numeric: tabular-nums; }
    .active-label { font-size: clamp(0.9rem, 2.4vh, 1.3rem); font-weight: 700; text-wrap: balance; }

    .timer-row { display: flex; align-items: baseline; gap: 8px; }
    .countdown { font-variant-numeric: tabular-nums; font-weight: 700; font-size: clamp(1.3rem, 6vh, 2.6rem); color: var(--accent); min-width: 3.6ch; }
    .countdown-label { color: var(--muted); font-weight: 700; font-size: 0.9rem; }
    /* #stage est un conteneur (voir .main-row > div) : outil ouvert à côté, la carte est deux fois moins large et le texte suit */
    #stage .countdown { font-size: clamp(1.6rem, min(8vh, 22cqi), 3.8rem); }
    #stage .active-label { font-size: clamp(1rem, min(3vh, 9cqi), 1.8rem); overflow-wrap: anywhere; }
    #stage .timer-row { flex-wrap: wrap; } /* carte étroite : « restant » passe sous le chiffre au lieu d'être coupé */

    .tasks-block { display: flex; flex-direction: column; gap: 5px; }
    .tasks-block-label { font-size: 0.9rem; color: var(--muted); font-weight: 700; }
    .task-chip {
      background: color-mix(in srgb, var(--surface) 78%, transparent);
      border: 1px solid var(--border); border-radius: 10px; padding: 5px 10px; font-size: 0.9rem;
    }
    .task-chip strong { font-weight: 700; }

    .active-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .jump-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 0.9rem; }
    .jump-row input[type="number"] { width: 56px; font: inherit; padding: 4px 6px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--ink); }
    .action-btn {
      display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px;
      border: 1px solid var(--border); background: var(--surface-alt); color: var(--ink);
      font-family: inherit; font-weight: 700; font-size: 0.9rem; cursor: pointer;
    }
    .action-btn.primary { background: var(--accent); color: var(--surface); border-color: transparent; }
    .active-card.is-pause .action-btn.primary { background: var(--pause-strong); }
    .action-btn svg { width: 14px; height: 14px; }
    .action-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .action-btn:disabled { opacity: 0.5; cursor: default; }

    #upcoming-block { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 6px; overflow: auto; }
    .upcoming-label { flex: 0 0 auto; color: var(--muted); font-weight: 700; font-size: 0.9rem; }
    .upcoming { display: flex; flex-direction: column; gap: clamp(4px, 0.8vh, 8px); min-height: 0; }
    .chip { display: flex; align-items: center; gap: 10px; padding: clamp(6px, 1vh, 10px) 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; color: var(--muted); animation: rise 0.3s ease; }
    .chip.pause-chip { background: var(--pause-soft); }
    .chip-icon { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; color: var(--muted); flex-shrink: 0; }
    .chip-icon svg { width: 16px; height: 16px; }
    .chip-label { flex: 1; font-weight: 700; font-size: 0.9rem; color: var(--ink); }
    .chip-duration { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 0.9rem; }

    .done-card { background: var(--accent-soft); border: 1px solid var(--border); border-radius: 28px; padding: clamp(28px, 5vw, 48px); display: flex; flex-direction: column; align-items: flex-start; gap: 14px; animation: rise 0.4s ease; }
    .done-card .active-icon { background: var(--surface); }
    .done-title { font-size: clamp(1.4rem, 3vw, 2rem); font-weight: 700; }

    /* step detail popup (click on the active card or an upcoming chip) — même langage visuel
       que la vue projetée (grand, lisible à distance) : on réutilise .appearance-panel /
       .projected-scroll / .plan-task / .plan-badge plutôt que de dupliquer un style de "petit modal". */
    .step-modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 100;
      display: flex; align-items: center; justify-content: center; padding: clamp(12px, 3vw, 32px);
      animation: fadeIn 0.15s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .step-modal {
      background: var(--surface); border: 1px solid var(--border); border-radius: 24px;
      box-shadow: var(--shadow); padding: clamp(18px, 3vh, 34px); max-width: 900px; width: 100%;
      max-height: 90vh; min-height: 0; overflow: hidden; display: flex; flex-direction: column;
      gap: clamp(10px, 1.8vh, 20px); animation: rise 0.2s ease;
    }
    .step-modal-top { flex: 0 0 auto; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .step-modal-heading { display: flex; align-items: center; gap: clamp(12px, 2vw, 22px); min-width: 0; }
    .step-modal-heading .active-icon { width: clamp(46px, 8vh, 76px); height: clamp(46px, 8vh, 76px); border-radius: 18px; }
    .step-modal-heading .active-label { display: block; font-size: clamp(1.4rem, 4.5vh, 2.6rem); }
    .step-modal-duration { color: var(--muted); font-weight: 700; font-size: clamp(0.95rem, 1.8vh, 1.25rem); }
    .step-modal-body { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
    .step-modal-body h3 { flex: 0 0 auto; }
    .step-modal-body .plan-list { flex: 1 1 auto; }
    .step-modal-body .plan-task { font-size: clamp(1rem, 2.4vh, 1.4rem); cursor: default; }
    .step-modal-body .plan-badge { font-size: clamp(0.9rem, 1.4vh, 0.95rem); }
    .step-modal-body .editor-hint { font-size: clamp(0.95rem, 1.8vh, 1.2rem); }
    .has-step-detail { cursor: pointer; }
    .chip.has-step-detail { cursor: pointer; }
    .chip.has-step-detail:hover, .active-card.has-step-detail:hover { border-color: var(--accent); }
    .chip.has-step-detail:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .chip.has-step-detail { min-height: 44px; }

    /* help guide — reuses the step-modal-backdrop/.step-modal overlay (same "big scrollable
       reference document" pattern), with its own body class that scrolls internally so the
       guide's length never forces the page itself to scroll */
    .help-modal { max-width: 760px; }
    .help-doc { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 6px; }
    .help-doc h2 { margin: 16px 0 0; font-size: 1.25rem; }
    .help-doc h2:first-child { margin-top: 0; }
    .help-doc p, .help-doc ul { margin: 0; }
    .help-doc .editor-hint { margin: 0; font-size: 0.92rem; line-height: 1.5; }
    .help-doc ul { padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
    .help-doc li { line-height: 1.5; font-size: 0.92rem; }
    .help-doc code { background: var(--bg); border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px; font-size: 0.85em; }
    .help-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; margin: 2px 0; }
    .help-table th, .help-table td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; vertical-align: top; }
    .help-table th { background: var(--bg); font-weight: 700; }

    footer { color: var(--muted); font-size: 0.9rem; }

    /* editor & tools (shared card look) */
    .editor { display: flex; flex-direction: column; gap: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: clamp(18px, 3vw, 30px); box-shadow: var(--shadow); }
    .editor h2 { margin: 0; font-size: 1.25rem; }
    #tools-wrap .editor { padding: clamp(8px, 1.4vh, 16px); gap: clamp(6px, 1vh, 10px); border-radius: 16px; }
    #tools-wrap .editor h2 { font-size: 0.95rem; }
    #tools-wrap .editor-hint { font-size: 0.9rem; margin: -3px 0 0; }
    #tools-wrap .back-link, #stage .back-link { font-size: 0.9rem; padding: 2px 0; }
    #tools-wrap .back-link svg, #stage .back-link svg { width: 13px; height: 13px; }
    #tool-settings-toggle svg, #actions-toggle svg { transform: none; } /* these show an up/down chevron, not the back arrow */
    #tools-wrap, #stage { overflow-x: hidden; }
    #tools-wrap .editor, #stage .active-card, #stage .done-card { overflow-x: hidden; overflow-y: auto; }
    .editor h3 { margin: 0; font-size: 1rem; }
    .editor-hint { color: var(--muted); font-size: 0.9rem; margin: -6px 0 4px; max-width: 72ch; } /* longueur de ligne bornée (repère typographique usuel : 45 à 75 caractères) */
    .editor-topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .back-link {
      display: flex; align-items: center; gap: 6px; border: none; background: none; color: var(--muted);
      font: inherit; font-weight: 700; font-size: 0.9rem; cursor: pointer; padding: 4px 0;
    }
    .back-link svg { width: 16px; height: 16px; transform: rotate(180deg); }

    .appearance-panel { display: flex; flex-direction: column; gap: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 16px; padding: 14px 16px; }
    .appearance-row { display: flex; align-items: flex-end; gap: 18px; flex-wrap: wrap; }
    .field { display: flex; flex-direction: column; gap: 5px; font-size: 0.9rem; color: var(--muted); font-weight: 700; }
    .field input[type="color"] {
      width: 48px; height: 38px; padding: 3px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--surface); cursor: pointer;
    }
    .field select { font: inherit; font-weight: 700; padding: 8px 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--ink); min-width: 190px; }
    .appearance-reset {
      border: none; background: none; color: var(--muted); font: inherit; font-size: 0.9rem; font-weight: 700;
      text-decoration: underline; cursor: pointer; padding: 0;
    }
    .text-input {
      font: inherit; font-weight: 700; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px;
      background: var(--surface); color: var(--ink);
    }
    textarea.text-input { font-weight: 400; resize: vertical; }

    .editor-rows { display: flex; flex-direction: column; gap: 10px; }
    .editor-row { display: flex; flex-direction: column; gap: 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 14px; padding: 10px 12px; }
    .editor-row-main { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .editor-row select, .editor-row input[type="text"], .editor-row input[type="number"] {
      font: inherit; font-weight: 700; padding: 8px 10px; border: 1px solid var(--border); border-radius: 10px;
      background: var(--surface); color: var(--ink);
    }
    .editor-row input[type="text"] { flex: 1; min-width: 140px; }
    .editor-row input[type="number"] { width: 68px; font-variant-numeric: tabular-nums; }
    .editor-row select.row-icon { max-width: 160px; }
    .unit-label { color: var(--muted); font-size: 0.9rem; white-space: nowrap; }
    .pause-toggle { display: flex; align-items: center; gap: 6px; font-size: 0.9rem; color: var(--muted); white-space: nowrap; }
    .row-btns { display: flex; gap: 6px; margin-left: auto; }
    .row-btn {
      width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface);
      color: var(--ink); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
    }
    .row-btn svg { width: 18px; height: 18px; }
    .row-btn:disabled { opacity: 0.35; cursor: default; }
    .row-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .tasks-toggle {
      align-self: flex-start; display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px;
      border: 1px solid var(--border); background: var(--surface); color: var(--muted); font: inherit; font-weight: 700; font-size: 0.9rem; cursor: pointer;
    }
    .tasks-toggle svg { width: 15px; height: 15px; }
    .tasks-toggle.has-tasks { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); }
    .tasks-editor { display: flex; flex-direction: column; gap: 8px; padding-top: 8px; border-top: 1px dashed var(--border); }
    .task-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .hw-extra-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .hw-extra-row input.hw-extra-text { flex: 1; min-width: 160px; }
    .hw-extra-row input[type="date"] {
      font: inherit; font-weight: 700; padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px;
      background: var(--surface); color: var(--ink);
    }
    .task-row input.task-name { width: 130px; }
    .task-row input.task-text { flex: 1; min-width: 160px; }
    .task-row input[type="date"] {
      font: inherit; font-weight: 700; padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px;
      background: var(--surface); color: var(--ink);
    }
    .add-task-btn {
      align-self: flex-start; display: flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px;
      border: 1.5px dashed var(--border); background: transparent; color: var(--muted); font: inherit; font-weight: 700; font-size: 0.9rem; cursor: pointer;
    }
    .add-task-btn svg { width: 15px; height: 15px; }

    .add-row-btn {
      align-self: flex-start; display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px;
      border: 1.5px dashed var(--border); background: transparent; color: var(--muted); font: inherit; font-weight: 700; cursor: pointer;
    }
    .add-row-btn svg { width: 18px; height: 18px; }
    .editor-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }

    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px;
      font-weight: 700; font-size: 0.9rem; box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
      max-width: 90vw; text-align: center; z-index: 20;
    }
    .toast.show { opacity: 1; }
    @media (max-width: 520px) {
      .controls { gap: 8px 10px; }
      .ctrl-group { gap: 6px; }
      .ctrl-btn.labeled { padding-inline: 10px 12px; gap: 6px; font-size: 0.95rem; }
      /* éditeur : le pictogramme puis le nom de l'étape prennent chacun toute la largeur (sinon le nom est coupé à ~140 px) */
      .editor-row select.row-icon { max-width: none; flex: 1 1 100%; }
      .editor-row input.row-label { flex: 1 1 100%; }
      /* barre en 2 rangées au lieu de 3 : Démarrer, Suivant et Plus ensemble, les vues (plus larges) en dessous.
         C'est placeMoreMenu() qui déplace « Plus » dans le DOM (pas « order » : la tabulation suit l'ordre visible). */
      .controls { justify-content: space-between; }
    }
    @media (max-width: 640px) { .footer-keys { display: none; } } /* raccourcis clavier : inutiles sur téléphone */
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    .storage-banner {
      display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
      background: var(--pause-soft); border: 1px solid var(--pause-accent); border-radius: 14px;
      padding: 10px 14px; margin-bottom: 10px; font-weight: 700;
    }
    .confirm-modal { max-width: 560px; }
    .confirm-msg { margin: 0; font-size: 1.15rem; line-height: 1.45; }
    .confirm-actions { display: flex; justify-content: flex-end; gap: 12px; flex-wrap: wrap; }
    .confirm-actions .action-btn { min-height: 48px; padding-inline: 22px; font-size: 1rem; }

    /* students editor */
    .students-rows { display: flex; flex-direction: column; gap: 8px; }
    .import-panel { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--border); }
    .import-panel code { background: var(--bg); border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px; font-size: 0.85em; }
    .import-panel textarea { width: 100%; }
    .student-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .student-row .student-name { flex: 1; min-width: 130px; }

    /* home / profils screen */
    .home-editor { max-width: 780px; margin: 0; } /* aligné à gauche, dans la colonne du titre « Mes programmes » */
    .home-title { font-size: 1.3rem; font-weight: 700; }
    .home-title-row { display: flex; align-items: center; gap: 8px; }
    .hint-row { display: flex; align-items: center; gap: 8px; }
    .hint-row .editor-hint { margin: 0; }
    .help-toggle {
      flex-shrink: 0; width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--border);
      background: var(--surface-alt); color: var(--muted); font: inherit; font-weight: 700; font-size: 0.9rem;
      display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; line-height: 1;
    }
    .help-toggle:hover { border-color: var(--accent); color: var(--accent); }
    .home-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .home-import-label { cursor: pointer; }
    .install-help { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; font-size: 0.9rem; color: var(--muted); margin-top: -4px; }
    .profile-list { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
    .profile-card {
      display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
      background: var(--bg); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px;
    }
    .profile-card-check { display: flex; align-items: center; }
    .profile-card-check input { width: 17px; height: 17px; cursor: pointer; }
    .profile-card-main { flex: 1 1 200px; }
    .profile-card-title { font-weight: 700; }
    .profile-card-meta { font-size: 0.9rem; color: var(--muted); }
    .profile-card-actions { display: flex; align-items: center; gap: 8px; }
    .profile-empty { color: var(--muted); padding: 10px 2px; }
    .home-actions-columns { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 10px; }
    .home-action-col { flex: 1 1 240px; min-width: 220px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
    .home-action-col .editor-hint { margin: 0; }
    /* textes d'aide en --muted plein : l'opacité à 75 % les faisait descendre sous 4,5:1 (3,3:1 en clair) */
    .home-backup-status { font-size: 0.9rem; }
    .install-help-base { font-size: 0.9rem; }
    svg.icon-mini { width: 10px !important; height: 10px !important; }

    /* tools menu (overlay panel: sits alongside the running timer, doesn't hide it) */
    .main-row {
      display: flex; gap: clamp(8px, 1.5vw, 24px); flex-wrap: nowrap;
      flex: 0 0 auto; min-height: 33vh; max-height: 54vh; overflow: hidden; /* grandit avec son contenu (tâches de l'étape) avant de les couper */
    }
    /* always side by side, even on a narrow phone-portrait screen — columns just get slim */
    .main-row > div { flex: 1 1 0; min-width: 0; min-height: 0; display: flex; flex-direction: column; container-type: inline-size; }
    .main-row > div > * { flex: 1 1 auto; min-height: 0; }
    #tools-wrap .editor { border-color: var(--accent); overflow: auto; }
    /* below ~220px of column width, drop the step icon so the title and time stay readable */
    @container (max-width: 220px) {
      #stage .active-top .active-icon { display: none; }
      #stage .active-top { gap: 0; }
    }
    .tasks-block { overflow: auto; }
    .tool-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    @media (max-width: 640px) { .tool-grid { grid-template-columns: repeat(2, 1fr); } }
    .tool-card {
      display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center;
      padding: 8px 6px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg);
      color: var(--ink); font: inherit; font-weight: 700; font-size: 0.9rem; cursor: pointer;
    }
    .tool-card:hover { border-color: var(--accent); }
    .tool-card .active-icon { width: 30px; height: 30px; border-radius: 10px; }
    .tool-card .active-icon svg { width: 16px; height: 16px; }

    /* vue projetée : tout doit tenir sur un seul écran (projeteur), sans défilement de page —
       seules les listes internes défilent si elles débordent (mêmes principes que .main-row / #upcoming-block) */
    #projected-wrap { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
    #projected-wrap .editor.projected-dashboard {
      flex: 1 1 auto; min-height: 0; overflow: hidden;
      padding: clamp(10px, 1.6vh, 22px); gap: clamp(8px, 1.2vh, 14px);
    }
    .projected-dashboard .editor-topbar { flex: 0 0 auto; }
    /* titre de contexte : étape en cours (déroulé) ou titre de la leçon — toujours visible, pour que les
       élèves sachent où ils en sont même sans avoir suivi le début */
    .projected-context-title {
      flex: 0 0 auto; text-align: center; font-weight: 800; text-wrap: balance;
      font-size: clamp(1.25rem, 4.2vh, 2.5rem); line-height: 1.15; padding: clamp(2px, 0.6vh, 8px) 6px;
    }
    /* petit indicateur d'étape (déroulé uniquement) sous le titre de contexte — reste discret,
       la vue projetée doit tenir sur un seul écran */
    .proj-progress { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 3px; margin: -4px 0 2px; }
    .proj-progress-text { color: var(--muted); font-weight: 700; font-size: clamp(1rem, 1.8vh, 1.1rem); }
    .proj-progress .progress-track { width: min(70%, 320px); height: 4px; margin-top: 0; }
    /* rangée du haut : le minuteur, et à côté de lui (seulement si ouvert) le bloc d'un outil —
       le reste du tableau de bord (tâches / devoirs / infos) reste toujours affiché en dessous */
    .projected-top-row {
      display: flex; gap: clamp(10px, 1.6vw, 22px); flex: 0 0 auto; min-height: 0;
      max-height: clamp(200px, 38vh, 460px); align-items: stretch;
    }
    /* Le bloc du décompte est un conteneur (container-type) : les textes qu'il contient se règlent sur SA largeur
       (unités cqi), pas seulement sur celle de l'écran. Quand un outil s'ouvre à côté, le bloc est deux fois
       moins large : le chiffre rétrécit avec lui au lieu de déborder. */
    .projected-timer { flex: 1 1 0; min-width: 0; min-height: 0; overflow: hidden; container-type: inline-size; }
    .projected-timer .active-card { padding: clamp(10px, 2.4vh, 28px) clamp(10px, 2vh, 22px) !important; overflow: auto; --edge-cap: clamp(10px, 2.4vh, 28px); flex: 1 1 auto; }
    /* statut au-dessus, décompte en dessous, centrés */
    .projected-timer-head { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; width: 100%; min-width: 0; }
    .projected-timer-head .timer-row { flex: 0 0 auto; flex-wrap: wrap; justify-content: center; max-width: 100%; } /* bloc étroit : « restant » passe sous le chiffre au lieu d'être coupé */
    /* statut du décompte (« Prêt », « En cours », « En pause », « Terminé ») : un mot, lisible de loin */
    .timer-status { color: var(--ink); font-weight: 700; font-size: clamp(1rem, min(2.6vh, 6cqi), 1.4rem); }
    .presenting-view .timer-status { font-size: clamp(1.1rem, min(3.6vh, 7cqi), 2.1rem); }
    .projected-timer-hidden-note { color: var(--muted); font-weight: 700; font-size: clamp(0.9rem, 1.8vh, 1.1rem); }
    .projected-tool-slot {
      flex: 1 1 0; min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden;
    }
    .projected-tool-slot > div { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
    .projected-tool-slot > div > .editor { flex: 1 1 auto; min-height: 0; position: relative; }
    /* indice de défilement : un dégradé discret en bas du bloc-outil (vue projetée) ou d'une
       liste .projected-scroll, ajouté seulement quand le contenu déborde réellement (classe
       .has-scroll-fade posée/retirée en JS, voir updateScrollFadeHints()) */
    .projected-tool-slot > div > .editor.has-scroll-fade::after {
      content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 32px;
      background: linear-gradient(to bottom, transparent, var(--surface));
      pointer-events: none; border-radius: 0 0 16px 16px;
    }
    /* certains outils (ex. Plan de travail) ont leur propre liste interne qui défile
       (.plan-list) sans que .editor lui-même déborde : même indice, posé sur cette liste */
    .projected-tool-slot .plan-list { position: relative; }
    .projected-tool-slot .plan-list.has-scroll-fade::after {
      content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 28px;
      background: linear-gradient(to bottom, transparent, var(--surface));
      pointer-events: none;
    }
    @media (max-width: 900px) {
      .projected-top-row { flex-wrap: wrap; max-height: none; }
      .projected-timer, .projected-tool-slot { flex: 1 1 260px; max-height: 40vh; }
    }
    .projected-timer .countdown { font-size: clamp(2rem, min(11vh, 20cqi), 6.2rem); line-height: 1; min-width: 0; }
    .projected-timer .countdown-label { font-size: clamp(1rem, 2vh, 1.2rem); }
    .projected-columns {
      flex: 1 1 auto; min-height: 0; display: grid;
      /* --proj-cols est posée en style inline par renderProjected() selon le nombre de blocs
         effectivement affichés (projectedBlocksVisible), pour qu'un ou deux blocs masqués
         ne laissent pas de colonnes vides ou trop étroites ; la media query ci-dessous
         (petits écrans) fixe grid-template-columns directement et reste donc prioritaire */
      grid-template-columns: repeat(var(--proj-cols, 3), minmax(0, 1fr)); gap: clamp(8px, 1.2vw, 16px);
    }
    /* étape sans tâche, sans devoir ni info : aucun bloc sous le décompte, qui occupe alors toute la hauteur */
    .proj-solo .projected-top-row { flex: 1 1 auto; max-height: none; }
    .proj-solo .projected-columns { display: none; }
    .presenting-view.proj-solo .projected-timer .countdown { font-size: clamp(2.4rem, min(40vh, 20cqi), 18rem); }
    .projected-columns .appearance-panel { min-height: 0; overflow: hidden; padding: clamp(8px, 1.4vh, 14px) clamp(10px, 1.2vw, 16px); gap: clamp(5px, 0.9vh, 12px); }
    .projected-columns h3 { flex: 0 0 auto; font-size: clamp(0.95rem, 1.9vh, 1.25rem); }
    .projected-scroll { flex: 1 1 auto; min-height: 0; overflow: auto; position: relative; }
    /* même indice de défilement que .projected-tool-slot .editor ci-dessus, mais dégradé vers
       var(--bg) puisque ces listes vivent dans un .appearance-panel (fond --bg, pas --surface) */
    .projected-scroll.has-scroll-fade::after {
      content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 24px;
      background: linear-gradient(to bottom, transparent, var(--bg));
      pointer-events: none;
    }
    .projected-tasks-panel .plan-task { font-size: clamp(0.92rem, 1.8vh, 1.2rem); }
    .projected-homework-panel .task-chip { font-size: clamp(0.9rem, 1.7vh, 1.15rem); }
    .projected-homework-panel .add-row-btn { flex: 0 0 auto; padding: clamp(6px, 1vh, 10px) 14px; font-size: clamp(0.9rem, 1.3vh, 0.9rem); }
    .projected-info-panel { display: flex; flex-direction: column; }
    /* modification des devoirs dans une colonne étroite : le champ prend la largeur de la colonne au lieu d'en dépasser */
    .projected-homework-panel .task-row > input[type="text"] { flex: 1 1 100%; min-width: 0; }
    /* vue projetée (classe "presenting" sur <body>) : ce que voient les élèves. Le titre de l'en-tête disparaît
       (le titre de contexte le répète). L'en-tête porte tout le pilotage : à gauche « Quitter la présentation »,
       seule sortie, à l'écart ; à droite Pause/Reprendre, Suivant, Outils et Plus. */
    body.presenting header .heading { display: none; }
    body.presenting header { align-items: center; }
    body.presenting header .controls { margin-left: auto; }
    body.presenting header .ctrl-btn:not(.primary) { background: var(--surface); } /* commandes pleinement lisibles, sans chercher */
    @media (max-width: 520px) { body.presenting header .controls { margin-left: 0; justify-content: flex-start; } } /* téléphone : commandes alignées à gauche, sous « Quitter la présentation » */
    /* Tailles de texte de la présentation : chacune est le plus petit de deux repères, la hauteur de l'écran
       (vh : tout doit tenir sur un écran) et la largeur du bloc qui contient le texte (cqi : le texte ne
       dépasse jamais de son bloc). Avant, seule la taille de l'écran comptait : un bloc étroit (3 colonnes,
       outil ouvert à côté du décompte) recevait un texte trop grand pour lui. */
    #projected-wrap { container-type: inline-size; } /* repère du titre de contexte */
    .projected-columns .appearance-panel { container-type: inline-size; } /* repère des listes de chaque colonne */
    /* en présentation, le tableau de bord occupe toute la largeur de l'écran (projecteur) au lieu des 1100 px du reste de l'application */
    body.presenting .page { max-width: none; }
    .presenting-view .projected-context-title { font-size: clamp(1.4rem, min(6.5vh, 7cqi), 3.6rem); overflow-wrap: anywhere; }
    .presenting-view .proj-progress-text { font-size: clamp(1rem, 2.4vh, 1.3rem); }
    .presenting-view .projected-timer .countdown { font-size: clamp(2.4rem, min(22vh, 20cqi), 11rem); }
    .presenting-view .projected-timer .countdown-label { font-size: clamp(1rem, min(3vh, 5cqi), 1.8rem); }
    .presenting-view .projected-columns h3 { font-size: clamp(1.1rem, min(3vh, 7cqi), 1.7rem); }
    .presenting-view .projected-tasks-panel .plan-task { font-size: clamp(1.1rem, min(3.4vh, 7.5cqi), 2rem); }
    .presenting-view .projected-homework-panel .task-chip { font-size: clamp(1.1rem, min(3.2vh, 7.5cqi), 1.9rem); }
    .presenting-view .projected-tasks-panel .plan-task { --cb: clamp(22px, min(3.4vh, 8cqi), 36px); --cb-gap: clamp(8px, 1.6vh, 16px); gap: 4px var(--cb-gap); }
    /* Tâche d'une colonne projetée : la case est sortie du flux (à gauche, sur la première ligne) et tout le
       reste est en retrait d'autant. Le texte garde donc toujours sa place à côté de la case ; les étiquettes
       (Obligatoire, À choix…) le suivent sur la même ligne s'il reste de la place, sinon passent dessous,
       alignées sur le texte. Avant, un texte trop long partait entier à la ligne et laissait la case seule. */
    /* (.appearance-panel dans le sélecteur : il doit l'emporter sur « .plan-group-members .plan-task { padding: 2px 0 } »,
       plus bas, sinon le retrait saute dans les groupes de choix et la case recouvre le texte) */
    .projected-columns .appearance-panel .plan-task { position: relative; line-height: 1.2; padding-left: calc(var(--cb, 22px) + var(--cb-gap, 8px)); }
    .projected-columns .plan-task > input[type="checkbox"] {
      position: absolute; left: 0; top: calc(3px + (1.2em - var(--cb, 22px)) / 2); margin: 0;
      font-size: inherit; /* pour que « 1.2em » ci-dessus soit la hauteur de ligne du texte de la tâche, pas celle du champ */
      width: var(--cb, 22px); height: var(--cb, 22px);
    }
    .projected-columns .plan-task > span:first-of-type { flex: 1 1 18ch; min-width: 0; max-width: max-content; }
    .proj-info-text { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.4; font-size: clamp(1.1rem, min(3.2vh, 7.5cqi), 1.9rem); overflow: auto; }
    .projected-info-panel textarea {
      flex: 1 1 auto; min-height: 0; resize: none; font-size: clamp(0.92rem, 1.8vh, 1.2rem);
    }
    /* petits écrans (portable de classe) : on resserre encore pour garder les listes lisibles plutôt que réduites à rien */
    @media (max-height: 640px) {
      .projected-dashboard { gap: 6px; }
      .projected-context-title { font-size: clamp(1rem, 3.4vh, 1.6rem); padding: 2px 6px; }
      .projected-timer .active-card { padding: 6px !important; }
      .projected-timer .countdown { font-size: clamp(1.8rem, 8vh, 3.6rem); }
      .projected-columns { gap: 6px; }
    }
    @media (max-width: 780px) {
      .projected-columns { grid-template-columns: 1fr; overflow: auto; }
      .projected-columns .appearance-panel { min-height: clamp(70px, 16vh, 140px); flex: 0 0 auto; }
    }

    /* traffic light */
    .feu-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 2px 0; min-height: 0; flex: 1 1 auto; min-width: 0; }
    .feu-body { display: flex; flex-direction: column; gap: 5px; background: #2a2f2c; border-radius: 16px; padding: 6px 10px; flex-shrink: 0; }
    .feu-light {
      width: clamp(18px, 4vh, 28px); height: clamp(18px, 4vh, 28px); border-radius: 50%; flex-shrink: 0;
      background: rgba(255,255,255,0.08); cursor: pointer; border: none; padding: 0;
    }
    .feu-light.on.rouge { background: var(--red); box-shadow: 0 0 10px 2px color-mix(in srgb, var(--red) 70%, transparent); }
    .feu-light.on.orange { background: var(--pause-accent); box-shadow: 0 0 10px 2px color-mix(in srgb, var(--pause-accent) 70%, transparent); }
    .feu-light.on.vert { background: var(--accent); box-shadow: 0 0 10px 2px color-mix(in srgb, var(--accent) 70%, transparent); }
    .feu-current-label {
      font-size: clamp(0.9rem, 1.8vh, 1.05rem); font-weight: 700; text-align: center;

    }

    .tirage-history-count { color: var(--muted); font-variant-numeric: tabular-nums; }
    .group-controls { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .group-controls input[type="number"] { width: 56px; }
    .group-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 6px; }

  var HELP_GUIDE_HTML = '<p class="editor-hint">PL-planif’ aide à préparer et faire vivre le déroulé minuté d\'une séance, pour une classe ou un petit groupe.</p><h2>Vue d\'ensemble</h2><p class="editor-hint">Page web unique, sans compte ni serveur : tout est enregistré dans le navigateur de l\'appareil (localStorage), sans synchronisation entre appareils — pour transporter un programme, on passe par un fichier de sauvegarde (voir plus bas). Un même appareil garde plusieurs programmes indépendants.</p><p class="editor-hint">Trois écrans principaux :</p><ul><li><strong>La vue Programme</strong> : l\'écran normal en classe, étape par étape.</li><li><strong>La vue projetée</strong> : un tableau de bord à projeter devant la classe (minuteur, tâches, devoirs, infos, outils).</li><li><strong>Les outils</strong> : neuf utilitaires indépendants (feu tricolore, mode de travail, minuteur rapide, tirage au sort, dé, comment ça va, sonomètre, plan de travail, minuteur de cours — ce dernier réservé à la vue projetée).</li></ul><h2>La page d\'accueil</h2><p class="editor-hint">La liste des programmes enregistrés sur cet appareil.</p><ul><li><strong>Créer</strong> : trois types de programme (voir section suivante).</li><li><strong>Ouvrir</strong> : le bouton principal de chaque programme.</li><li><strong>Plus</strong> (à côté d’Ouvrir) : les autres actions sur ce programme — Dupliquer, Sauvegarder dans un fichier, Remettre le minuteur au début (retour à la première étape, sans ouvrir le programme ; « Revenir à la première étape » pour une checklist), Monter ou Descendre dans la liste, Supprimer (avec confirmation).</li><li><strong>Sauvegarder</strong> (un programme, depuis son menu Plus, ou une sélection cochée) : télécharge un fichier <code>.json</code> — seule façon de sécuriser ou transférer un programme.</li><li><strong>Importer un fichier de sauvegarde</strong> : récupère un ou plusieurs programmes depuis un <code>.json</code>.</li></ul><p class="editor-hint">Un rappel discret indique depuis combien de temps la dernière sauvegarde a été faite (mis à jour seulement après un téléchargement volontaire).</p><h2>Les trois types de programme</h2><table class="help-table"><thead><tr><th>Type</th><th>Étapes minutées\u202F?</th><th>Usage</th></tr></thead><tbody><tr><td>Déroulé minuté</td><td>Oui</td><td>Le minuteur avance seul, la case se remplit visuellement</td></tr><tr><td>Checklist sans minutage</td><td>Non, à la main (bouton « Suivant »)</td><td>Une suite d\'étapes à cocher sans contrainte de temps</td></tr><tr><td>Leçon</td><td>Pas d\'étapes</td><td>Ouvre directement en vue projetée : durée, tâches, devoirs, infos</td></tr></tbody></table><p class="editor-hint">Un déroulé se change en checklist (et inversement) dans l\'éditeur, panneau « Minutage ». Une Leçon est un type à part, sans étapes successives.</p><h2>La vue Programme au quotidien</h2><p class="editor-hint">L\'étape en cours s\'affiche en grande carte (icône, nom, temps restant si activé), avec les étapes à venir juste en dessous (« À suivre »). Au-dessus, l\'indication « Étape X sur Y » et une barre montrent l\'avancement dans le programme. Au-dessus du nom de l’étape, un mot indique l’état du minuteur : « Prêt » (pas encore démarré), « En cours » ou « En pause ».</p><p class="editor-hint">Boutons de l’en-tête, en trois groupes : Démarrer/Pause/Reprendre et Étape suivante ; Projeter (vue projetée), Outils et Modifier (éditeur) ; puis le menu Plus, qui regroupe Accueil, Guide d’utilisation, Apparence (thème), Son de transition et Recommencer le programme (avec confirmation, volontairement à l’écart d’Étape suivante). Le bouton Outils est le même en vue Programme et en vue projetée.</p><p class="editor-hint"><strong>Détail d\'une étape</strong> : cliquer sur la carte active ou sur une étape à suivre ouvre un aperçu détaillé (icône, nom, durée, tâches), fermé par la croix, un clic extérieur ou Echap.</p><p class="editor-hint"><strong>Raccourcis clavier</strong> (sur cet écran et en vue projetée, sans effet pendant la saisie dans un champ) : Espace démarre, met en pause ou reprend le décompte affiché, → passe à l’étape suivante, ← revient à l’étape précédente, F bascule vers la vue projetée (et vice versa). Pour une checklist, Espace n’agit qu’en vue projetée (sur le minuteur de cours) ; les flèches et F fonctionnent normalement.</p><h2>L\'éditeur d\'un programme</h2><p class="editor-hint">Accessible via le crayon « Modifier ». Rien n\'est pris en compte avant <strong>Enregistrer</strong> — Annuler ignore les changements.</p><ul><li><strong>Minutage</strong> (déroulé/checklist uniquement) : minuté ou checklist ; si minuté, possibilité de masquer le chiffre du temps restant (le remplissage visuel reste toujours visible).</li><li><strong>Apparence</strong> (déroulé/checklist uniquement) : couleur principale, couleur des pauses, police.</li><li><strong>Déroulement</strong> (déroulé/checklist uniquement) : ajouter/supprimer/réordonner les étapes, icône, durée, marquage « Pause ». Chaque étape a des tâches (élève + consigne), chacune Obligatoire ou non et À la maison ou non (voir étiquettes ci-dessous) ; une tâche « à la maison » peut recevoir une date de rendu, et un sélecteur « Élèves assignés » permet de l\'assigner à zéro, un ou plusieurs élèves de la liste (Ctrl/Cmd-clic pour en choisir plusieurs) — indépendant du champ libre « Élève » à côté, qui reste un simple texte affiché tel quel. Cette assignation sert de base au filtrage par élève des blocs personnalisés de la vue projetée (voir plus bas).</li><li><strong>Tâches à faire en classe</strong> (Leçon uniquement) : mêmes tâches, groupes de choix et assignation aux élèves qu\'une étape de déroulé, mais directement pour la leçon puisqu\'il n\'y a pas d\'étapes.</li><li><strong>Élèves</strong> : liste utilisée par le tirage au sort et les groupes dans les Outils, ainsi que par l\'assignation des tâches ci-dessus. Un élève peut être exclu du tirage et/ou des groupes aléatoires (case « À ne pas attribuer à un groupe (tirage aléatoire) »), et recevoir une étiquette pour être séparé d\'autres élèves. Import possible (un nom par ligne, codes <code>!</code>, <code>#</code>, <code>@tag</code>).</li><li><strong>Groupes d\'élèves</strong> (sous-section du panneau « Élèves ») : créez ici des groupes nommés à l\'avance (ex. « Groupe rouge », « Groupe bleu »), puis choisissez dans la liste des élèves, pour chacun, à quel groupe il appartient (un seul groupe à la fois, ou aucun). Ce sont des groupes fixes que vous composez vous-même — à ne pas confondre avec les « Groupes de choix » des tâches (choisir N tâches sur M, voir plus bas) ni avec les « Groupes aléatoires » du tirage au sort (composition tirée au hasard). Ils servent à l\'onglet « Groupes fixes » de l\'outil Tirage au sort (voir « Les outils » ci-dessous), qui affiche cette répartition et peut aussi la composer au hasard pour vous ; le résultat reste ensuite modifiable ici, élève par élève.</li><li><strong>Devoirs et infos</strong> : panneau dédié pour préparer, à l\'avance et sans passer par la vue projetée, les devoirs et les infos importantes : la liste (en lecture) des tâches déjà marquées « à la maison » dans les étapes, une liste de devoirs ajoutés à la main (texte + date de rendu, ajout/suppression comme pour les élèves), un champ « Infos importantes », et le bouton « Copier devoirs et infos ». C\'est la même donnée que celle modifiable en vue projetée — ici elle suit la règle Enregistrer/Annuler de l\'éditeur.</li><li><strong>Blocs personnalisés</strong> : panneau pour créer des blocs supplémentaires affichés dans la vue projetée, en plus des trois blocs fixes, et pour les réordonner entre eux (flèches monter/descendre, comme pour les étapes), puis, dans sa sous-partie « Blocs affichés en vue projetée », une case par bloc pour afficher ou masquer chacun (les trois blocs fixes, le bloc « Minuteur de cours » et chaque bloc personnalisé) — voir « Blocs personnalisés » dans la section « La vue projetée » ci-dessous.</li><li><strong>Vue projetée</strong> (nommé « Outils affichés dans la vue projetée » dans l\'éditeur d\'une Leçon) : « Outils du panneau Outils » (outils proposés dans la vue projetée), réglage « Afficher Obligatoire / À choix / À la maison » et réglage « Afficher les groupes de choix » (deux cases indépendantes, uniquement modifiables ici ou dans l\'éditeur d\'une Leçon).</li></ul><h2>Les étiquettes de tâches</h2><p class="editor-hint">Chaque tâche peut porter jusqu\'à deux étiquettes indépendantes :</p><table class="help-table"><thead><tr><th>Étiquette</th><th>Sens</th></tr></thead><tbody><tr><td><strong>Obligatoire</strong></td><td>La tâche doit être faite</td></tr><tr><td><strong>À choix</strong></td><td>Automatique dès qu\'une tâche n\'est pas Obligatoire — jamais les deux à la fois</td></tr><tr><td><strong>À la maison si pas fini</strong></td><td>Indépendante des deux précédentes, cumulable avec l\'une ou l\'autre</td></tr></tbody></table><p class="editor-hint">Affichées dans le Plan de travail, le détail d\'une étape, la vue projetée et à l\'impression. Réglage « Afficher Obligatoire / À choix / À la maison » dans l\'éditeur (panneau « Vue projetée » du déroulé, ou « Outils affichés dans la vue projetée » de la Leçon) : unique pour tout le programme, ne se change que depuis l\'éditeur (jamais depuis un écran élève) ; une fois enregistré, il s\'applique partout.</p><p class="editor-hint"><strong>Groupes de choix</strong> : pour dire « choisissez-en N sur M » (ex. 2 exercices de divisions sur 5), regroupez des tâches d\'une même étape (ou de la Leçon) dans l\'éditeur : créez un groupe (nom facultatif + nombre à choisir), puis assignez-lui les tâches concernées — le « sur M » se recalcule automatiquement selon les tâches actuellement dans le groupe. Les tâches d\'un groupe s\'affichent ensemble dans un sous-bloc coloré (« Divisions — 2 sur 5 »), sans toucher aux étiquettes Obligatoire / À choix / À la maison de chacune. Leur affichage se règle indépendamment des étiquettes, avec la case « Afficher les groupes de choix » du même panneau.</p><h2>La vue projetée</h2><p class="editor-hint">Le tableau de bord à projeter, ouvert par « Projeter » (ou l’ouverture directe d’une Leçon). Tout tient sur un seul écran, sans défilement de page.</p><ul><li><strong>Piloter sans quitter</strong> : l’en-tête garde Démarrer/Pause/Reprendre, Suivant, Outils et le menu Plus (Accueil, Modifier devoirs et infos, Guide d’utilisation, Apparence, Son de transition, Recommencer le programme). À gauche, « Quitter la présentation » est la seule sortie : elle ramène à la vue Programme (à l’accueil pour une Leçon). La touche Échap fait de même pour un programme ou une checklist ; si un outil est ouvert, elle le referme d’abord.</li><li><strong>Titre de contexte</strong> : en haut, l\'étape en cours (déroulé) ou le titre de la leçon, mis à jour automatiquement. Pour un déroulé, l\'indication « Étape X / Y » et une barre de progression s\'affichent juste en dessous.</li><li><strong>Décompte</strong> : un mot d’état (« Prêt », « En cours », « En pause », « Terminé »), le temps restant (ou la note « Temps non affiché ») et le remplissage visuel de la case, toujours affiché. Le texte reste lisible sur la partie remplie comme sur la partie vide, et sa taille s’adapte à la largeur du bloc (par exemple quand un outil est ouvert à côté). Pour un programme minuté, c’est le décompte de l’étape en cours, le même que dans la vue Programme : Pause, Suivant et le passage automatique à l’étape suivante agissent sur ce que la classe voit. Pour une checklist ou une Leçon, c’est le minuteur de cours, dont la durée totale se règle dans l’outil « Minuteur de cours » (voir « Les outils » ci-dessous).</li><li><strong>Trois blocs fixes</strong> : Tâches à faire en classe (pour un programme ou une checklist, uniquement les tâches de l’étape en cours : la liste change à chaque étape et une tâche non cochée disparaît avec son étape ; pour une Leçon, toutes les tâches ; les cases cochées ne sont pas enregistrées), Devoirs (tâches « à la maison » + lignes manuelles, chacune avec date de rendu possible), Infos importantes (texte libre). Chaque bloc défile indépendamment si le contenu est long. Chacun peut être affiché ou masqué indépendamment depuis l\'éditeur, panneau « Blocs personnalisés », sous-partie « Blocs affichés en vue projetée » (une case par bloc).</li><li><strong>Bloc « Minuteur de cours »</strong> : comme les trois blocs fixes ci-dessus, ce grand bloc (en haut, à côté du bloc-outil éventuel) a sa propre case « affiché » dans l\'éditeur, panneau « Blocs personnalisés » — le décocher le masque entièrement en vue projetée. C\'est différent du réglage « Afficher le temps » de l\'outil « Minuteur de cours » (voir « Les outils » ci-dessous), qui masque seulement le chiffre à l\'intérieur du bloc quand celui-ci reste affiché.</li><li><strong>Copier devoirs et infos</strong> (bouton visible pendant « Modifier devoirs et infos », voir ci-dessous) : copie l\'ensemble (devoirs avec date au format JJ.MM.AAAA si renseignée, puis infos) dans le presse-papiers, prêt à coller ailleurs (par ex. le site de l\'école). Même bouton disponible dans l\'éditeur du programme (voir plus haut), pour préparer sans passer par la vue projetée.</li><li><strong>Modifier devoirs et infos</strong> (menu Plus) : fait apparaître, dans la vue projetée elle-même, les champs pour ajouter ou corriger un devoir et les infos importantes, ainsi que tous les blocs affichés, même vides. « Terminer » (ou la touche Échap) revient à l’affichage pour la classe, qui masque les champs, retire les blocs vides et agrandit le décompte et les textes. « Projeter » ouvre toujours l’affichage pour la classe.</li><li><strong>Outils</strong> : le bouton Outils de l\'en-tête ouvre l\'outil choisi dans un bloc à côté, sans masquer les autres blocs. Outils proposés réglables dans l\'éditeur.</li><li><strong>Blocs personnalisés</strong> : en plus des trois blocs fixes, l\'éditeur   var confirmReturnFocus = null;

    confirmReturnFocus = null;

  function confirmKeydown(e) {
    if (e.key === "Escape") { e.preventDefault(); closeConfirm(); return; }
    if (e.key !== "Tab") return;
    var btns = document.querySelectorAll("#confirm-overlay button");
    if (!btns.length) return;
    var first = btns[0], last = btns[btns.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }

    if (days <= 0) return "Dernière sauvegarde : aujourd’hui.";

  function downloadJson(data, filename) {
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });

    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    markBackupNow();
    var statusEl = document.querySelector(".home-backup-status");
    if (statusEl) statusEl.textContent = backupReminderText();
  }
